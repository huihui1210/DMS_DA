name: Deploy DMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 注入/更新 bridge-rev 时间戳
      - name: Inject bridge-rev timestamp
        run: |
          REV_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "bridge-rev: ${REV_TS}"
          for f in *.html; do
            if grep -q '<!-- bridge-rev ' "$f"; then
              sed -i "s|<!-- bridge-rev .* -->|<!-- bridge-rev ${REV_TS} -->|" "$f"
            else
              sed -i "/<head>/a\\    <!-- bridge-rev ${REV_TS} -->" "$f"
            fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
