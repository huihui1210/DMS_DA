<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福建LNG设备缺陷数据分析报告</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* ======= Reset & 全局 ======= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            padding: 20px;
            min-height: 100vh;
        }

        /* ======= 容器 ======= */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 36px 40px;
            min-height: calc(100vh - 40px);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2c3e50 0%, #34495e 50%, #2c3e50 100%);
            border-radius: 16px 16px 0 0;
        }

        /* ======= 头部 ======= */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #2c3e50, #3498db);
            border-radius: 2px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .header .date {
            color: #666;
            font-size: 13px;
            margin-top: 12px;
            font-weight: 400;
        }

        /* ======= 报告章节 ======= */
        .report-section {
            margin-bottom: 30px;
        }

        .report-section h2 {
            color: #2c3e50;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding: 8px 14px;
            background: linear-gradient(90deg, #f8f9fa 0%, transparent 100%);
            border-left: 4px solid #3498db;
            border-radius: 0 4px 4px 0;
            display: flex;
            align-items: center;
        }

        .chart-block-title {
            color: #2c3e50;
            font-size: 15px;
            font-weight: 600;
            margin: 18px 0 10px 0;
            padding-left: 10px;
            border-left: 3px solid #3498db;
        }

        /* 消缺龙虎榜：左侧前三专业卡片 + 右侧上榜率表格（样式与报告其他表格统一） */
        .lb-layout {
            display: flex;
            gap: 12px;
            align-items: stretch;
            margin-top: 10px;
            break-inside: avoid;
        }

        .lb-left {
            flex: 0 0 230px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lb-left .profession-item {
            flex: 1;
        }

        .lb-right {
            flex: 1;
            min-width: 0;
        }

        .lb-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .lb-table th,
        .lb-table td {
            padding: 7px 10px;
            text-align: center;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
        }

        .lb-table thead tr:first-child th:last-child,
        .lb-table tbody tr td:last-child {
            border-right: none;
        }

        .lb-table tbody tr:last-child td {
            border-bottom: none;
        }

        .lb-table th {
            background-color: #ffffff;
            color: #2c3e50;
            font-weight: 600;
        }

        .lb-table td:first-child {
            font-weight: 600;
            color: #2c3e50;
        }

        /* ======= 生产重点关注缺陷情况 ======= */
        .focus-table-wrap {
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 1px 4px rgba(44, 62, 80, 0.07);
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .focus-table-wrap+.focus-table-wrap {
            margin-top: 14px;
        }

        .focus-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            font-size: 12px;
            background-color: #ffffff;
        }

        .focus-table th,
        .focus-table td {
            padding: 8px;
            text-align: center;
            vertical-align: middle;
            word-break: break-all;
            line-height: 1.6;
            border-right: 1px solid #e6e9ed;
            border-bottom: 1px solid #e6e9ed;
        }

        .focus-table th:nth-child(1),
        .focus-table td:nth-child(1),
        .focus-table td:nth-child(3),
        .focus-table td:nth-child(4),
        .focus-table td:nth-child(5) {
            white-space: nowrap;
            word-break: keep-all;
        }

        .focus-table tr th:last-child,
        .focus-table tr td:last-child {
            border-right: none;
        }

        .focus-table tbody tr:last-child td {
            border-bottom: none;
        }

        .focus-table thead th {
            background-color: #f5f7fa;
            color: #2c3e50;
            font-weight: 600;
        }

        .focus-table thead .focus-group-title {
            background: linear-gradient(135deg, #eef3f8 0%, #e6edf4 100%);
            color: #1f3b57;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid #dbe3ec;
        }

        .focus-table td.focus-desc {
            text-align: left;
        }

        .report-section p {
            color: #444;
            line-height: 1.8;
            font-size: 14px;
            text-indent: 2em;
            margin-bottom: 16px;
        }

        .highlight {
            font-weight: normal;
            color: #2c3e50;
        }

        /* ======= 年度累计统计卡片 ======= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .stat-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9fa 100%);
            padding: 16px 14px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3498db 0%, #2c3e50 100%);
            border-radius: 10px 10px 0 0;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: #2c3e50;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ======= 按钮 ======= */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #2c3e50;
            color: white;
        }

        .btn-primary:hover {
            background-color: #34495e;
        }

        .btn-back {
            background-color: #95a5a6;
            color: white;
            margin-right: 10px;
        }

        .btn-back:hover {
            background-color: #7f8c8d;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-data p {
            margin-bottom: 20px;
        }

        /* ======= 分专业模块 ======= */
        .profession-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #f0f3f6 100%);
            border-radius: 10px;
            padding: 14px 20px;
            margin-bottom: 16px;
            border-left: 4px solid #3498db;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .profession-section p {
            margin-bottom: 6px;
            text-indent: 0;
            color: #444;
            font-size: 14px;
            line-height: 1.6;
        }

        .profession-block+.profession-block {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed rgba(0, 0, 0, 0.08);
        }

        .profession-block .profession-list {
            margin-top: 8px;
        }

        .profession-section p:last-child {
            margin-bottom: 0;
        }

        .profession-section span {
            font-weight: normal;
            color: #2c3e50;
        }

        .profession-list {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px 12px;
        }

        .profession-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: white;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid rgba(44, 62, 80, 0.12);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .profession-name {
            color: #333;
            font-weight: 500;
        }

        .profession-count {
            font-weight: 700;
            color: #2c3e50;
            font-size: 14px;
            background: #edf2f7;
            padding: 2px 10px;
            border-radius: 12px;
            min-width: 44px;
            text-align: center;
        }

        /* ======= 汇总表样式（与 index.html 一致） ======= */
        .summary-table-wrap {
            margin: 0;
            padding: 8px 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
            table-layout: fixed;
        }

        .summary-table th,
        .summary-table td {
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 3px 2px;
            text-align: center;
            white-space: nowrap;
        }

        .summary-table tr.st-header-row th {
            background: #2c3e50;
            color: white;
            font-weight: 600;
            font-size: 10px;
            white-space: normal;
            word-break: break-all;
            line-height: 1.4;
        }

        .summary-table tr.st-header-row th.st-col {
            background: #34495e;
        }

        .summary-table tr.st-header-row th.st-sub-total {
            background: #34495e;
        }

        .summary-table th.st-col,
        .summary-table td.st-col {
            width: 26px;
            padding: 6px 2px;
            font-size: 13px;
            line-height: 1.4;
            letter-spacing: 1px;
            vertical-align: middle;
        }

        .summary-table tbody td.st-total {
            font-weight: 700;
            color: #2c3e50;
        }

        /* ======= 图表区 ======= */
        .chart-section {
            background: white;
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .chart-container {
            width: 100%;
            height: 280px;
            margin-bottom: 12px;
            min-height: 260px;
        }

        .chart-data-table {
            margin-top: 5px;
            overflow-x: auto;
        }

        .chart-data-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .chart-data-table th,
        .chart-data-table td {
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 6px 10px;
            text-align: center;
        }

        .chart-data-table th {
            background-color: #2c3e50;
            font-weight: 600;
            color: white;
        }

        .chart-data-table .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .chart-summary {
            text-align: left;
            text-indent: 2em;
            color: #666;
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #3498db;
        }

        /* ======= 打印样式 ======= */
        /* 上下页边距对每一页生效，避免第2页起内容顶格 */
        @page {
            margin: 8mm 0;
        }

        @media print {
            body {
                background: white !important;
                margin: 0;
                padding: 0;
            }

            /* 容器左右内边距：跨页生效，提供每页左右页边距 */
            .container {
                min-height: auto !important;
                height: auto !important;
                overflow: visible !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                padding: 0 12mm !important;
                position: relative !important;
            }

            /* 第一页顶部页边距 */
            .header {
                margin: 0 !important;
                padding: 10mm 0 5mm !important;
            }

            /* section 允许跨页：避免长章节整体被推到下一页导致首页空白 */
            .report-section {
                margin: 0 !important;
                padding: 4mm 0 0 !important;
                break-inside: auto;
                page-break-inside: auto;
            }

            /* 打印时整体收紧字号与间距，提升每页信息密度 */
            .report-section h2 {
                font-size: 16px !important;
                margin-bottom: 8px !important;
                padding: 6px 12px !important;
            }

            .report-section p {
                font-size: 12px !important;
                line-height: 1.6 !important;
                margin-bottom: 8px !important;
            }

            .profession-section {
                padding: 10px 14px !important;
            }

            .profession-item {
                padding: 5px 12px !important;
            }

            /* 打印时龙虎榜强制完整网格边框（浅灰，与其他表格一致），覆盖屏幕端去右边框/底边框的规则 */
            .lb-table th,
            .lb-table td {
                padding: 5px 8px !important;
                border: 1px solid #cfcfcf !important;
            }

            /* 标题不与正文分离 */
            .report-section h2,
            .chart-block-title {
                break-after: avoid;
                page-break-after: avoid;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* 图表区块作为整体，避免图表与数据表被拆开 */
            .chart-section {
                break-inside: avoid;
                page-break-inside: avoid;
                box-shadow: none !important;
                border: 1px solid #e8ebef;
                padding: 6px 10px !important;
                margin-bottom: 8px !important;
            }

            /* 打印时压缩图表高度，让每页容纳更多内容，减少大面积留白 */
            .chart-container {
                height: 200px !important;
                min-height: 0 !important;
                margin-bottom: 6px !important;
                overflow: hidden !important;
            }

            /* 双保险：canvas 位图等比缩放到容器内，防止溢出重叠下方表格；
               canvas 必须 width/height auto 保持宽高比（否则单边压缩饼图变椭圆）；
               注意 auto 只能加在 canvas 上：外层 div 的子元素是绝对定位，高度 auto 会塌成 0 */
            .chart-container>div {
                max-width: 100% !important;
                max-height: 100% !important;
            }

            .chart-container canvas {
                width: auto !important;
                height: auto !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }

            .chart-summary {
                font-size: 12px !important;
                line-height: 1.6 !important;
                margin-bottom: 6px !important;
                padding: 5px 10px !important;
            }

            /* 表格：表头跨页重复，行内不拆分，避免边框断裂 */
            .summary-table thead,
            .chart-data-table thead,
            .lb-table thead,
            .focus-table thead {
                display: table-header-group;
            }

            .summary-table tr,
            .chart-data-table tr,
            .lb-table tr,
            .focus-table tr {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .summary-table-wrap,
            .chart-data-table {
                overflow: visible !important;
                border-radius: 0 !important;
                box-shadow: none !important;
            }

            /* 图表数据表列多，打印时压缩字号并允许换行，避免超出纸张被截断 */
            .chart-data-table table {
                font-size: 9px !important;
            }

            .chart-data-table th,
            .chart-data-table td {
                white-space: normal !important;
                word-break: break-all;
                padding: 3px 2px !important;
                overflow: visible !important;
                text-overflow: clip !important;
            }

            /* 重点关注缺陷表：去掉圆角容器，改为单元格完整边框，跨页时不断线 */
            .focus-table-wrap {
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                overflow: visible !important;
            }

            .focus-table {
                border-collapse: collapse !important;
                font-size: 10px !important;
            }

            .focus-table th,
            .focus-table td,
            .focus-table th:nth-child(1),
            .focus-table td:nth-child(1),
            .focus-table td:nth-child(3),
            .focus-table td:nth-child(4),
            .focus-table td:nth-child(5) {
                border: 1px solid #cfcfcf !important;
                padding: 4px 5px !important;
                white-space: normal !important;
                word-break: break-all;
                line-height: 1.5 !important;
            }

            .focus-table thead .focus-group-title {
                background: #eef3f8 !important;
            }

            .report-section:last-of-type {
                padding-bottom: 10mm !important;
            }

            .btn-group {
                display: none !important;
            }

            .btn-group#btnGroup {
                display: none !important;
            }

            .chart-container {
                page-break-inside: avoid;
            }

            /* 年度累计统计：打印改为单行四卡，节省高度，避免单独占一页 */
            .stats-grid {
                grid-template-columns: repeat(4, 1fr) !important;
                gap: 8px !important;
                margin-top: 8px !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            .stat-card {
                padding: 10px 8px !important;
            }

            .stat-label {
                font-size: 12px !important;
                margin-bottom: 4px !important;
            }

            .stat-value {
                font-size: 20px !important;
            }

            /* 重点关注缺陷分组表整体尽量不被拆开，避免表头悬挂在页底 */
            .focus-table-wrap {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* 重点关注缺陷整块尽量放一起：当前页剩余空间放得下就留，放不下整体移到下一页；
               内容超过一页时浏览器会自动忽略 avoid 正常拆分，单行仍不拆分 */
            .focus-report-section {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            .focus-table tr {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* 打印时汇总表允许换行，避免文字被截断 */
            .summary-table {
                font-size: 10px !important;
            }

            .summary-table th,
            .summary-table td {
                white-space: normal !important;
                overflow: visible !important;
                text-overflow: clip !important;
                padding: 3px 2px !important;
            }

            .summary-table th.st-col,
            .summary-table td.st-col {
                font-size: 11px !important;
                padding: 4px 2px !important;
            }

            .stat-value {
                background: none !important;
                -webkit-background-clip: initial !important;
                -webkit-text-fill-color: #2c3e50 !important;
                background-clip: initial !important;
                color: #2c3e50 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            svg {
                filter: none !important;
            }

            canvas {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 id="reportTitle">福建LNG设备缺陷数据分析报告</h1>
            <div class="date" id="reportDate"></div>
        </div>

        <div id="reportContent" style="display: none;">
            <div class="report-section">
                <h2>一、总体情况</h2>
                <p id="summaryText"></p>

                <div class="chart-section">
                    <div class="chart-container" id="barChart"></div>
                    <div class="chart-data-table" id="barChartTable"></div>
                </div>

                <div class="chart-section">
                    <h3 class="chart-block-title" id="pieOverallTitle">（一）福建LNG</h3>
                    <div class="chart-container" id="pieChart"></div>
                    <p class="chart-summary" id="pieChartSummary"></p>
                    <div id="pieChartTable"></div>
                </div>

                <div class="chart-section" id="recvPieSection" style="display: none;">
                    <h3 class="chart-block-title">（二）接收站</h3>
                    <div class="chart-container" id="pieChartRecv"></div>
                    <p class="chart-summary" id="pieChartSummaryRecv"></p>
                    <div id="pieChartTableRecv"></div>
                </div>

                <div class="chart-section" id="fenPieSection" style="display: none;">
                    <h3 class="chart-block-title">（三）分输站</h3>
                    <div class="chart-container" id="pieChartFen"></div>
                    <p class="chart-summary" id="pieChartSummaryFen"></p>
                    <div id="pieChartTableFen"></div>
                </div>

                <div class="chart-section">
                    <h3 class="chart-block-title" id="civilTitle">土建类缺陷</h3>
                    <p class="chart-summary" id="civilSummary"></p>
                </div>

                <div class="chart-section">
                    <h3 class="chart-block-title" id="fireTitle">消防类缺陷</h3>
                    <p class="chart-summary" id="fireSummary"></p>
                </div>
            </div>

            <div class="report-section">
                <h2>二、分专业情况</h2>
                <div class="profession-section" id="professionSection">
                    <div class="profession-block">
                        <p><span id="completedMonthLabel"></span>消缺最多前三名专业：<span id="topCompletedProfessions"></span>。
                        </p>
                        <div class="lb-layout">
                            <div class="lb-left" id="completedProfessionList"></div>
                            <div class="lb-right" id="leaderboardTable"></div>
                        </div>
                    </div>
                    <div class="profession-block">
                        <p><span id="pendingMonthLabel"></span>剩余最多前三名专业：<span id="topPendingProfessions"></span>。
                        </p>
                        <div class="profession-list" id="pendingProfessionList"></div>
                    </div>
                </div>
            </div>

            <div class="report-section focus-report-section">
                <h2>三、生产重点关注缺陷情况</h2>
                <p id="focusSummary"></p>
                <p>附：重点关注缺陷处理清单：</p>
                <div id="focusTable"></div>
            </div>

            <div class="report-section">
                <h2>四、年度累计统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label" id="labelYearNew"></div>
                        <div class="stat-value" id="statYearNew"></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label" id="labelYearCompleted"></div>
                        <div class="stat-value" id="statYearCompleted"></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">环比变化率</div>
                        <div class="stat-value" id="statChangeRate"></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">消缺完成率</div>
                        <div class="stat-value" id="statCompletionRate"></div>
                    </div>
                </div>
            </div>

        </div>

        <div id="noData" class="no-data">
            <p>暂无数据，请先在主页面导入Excel文件</p>
            <button class="btn btn-primary" onclick="goBack()">返回主页面</button>
        </div>

        <div class="btn-group" id="btnGroup" style="display: none;">
            <button class="btn btn-back" onclick="goBack()">返回主页面</button>
            <button class="btn btn-primary" onclick="printReport()">打印报告</button>
        </div>
    </div>

    <script>
        // ======= 全局配置常量（与 index.html 完全一致）=======
        let MAJOR_PROFESSIONS = ['机械', '电气', '仪表', '信息化', '防腐', '工程', '分析', '管道抢修', '后勤', '安全', '接收站运行部', '管道运行部'];

        // ======= 导航 & 打印 =======
        function goBack() {
            const params = new URLSearchParams(window.location.search);
            const station = params.get('station');
            const backPage = station === 'fen' ? 'index_2.html' :
                station === 'all' ? 'index_1.html' : 'index.html';
            window.location.href = backPage;
        }

        function printReport() {
            window.print();
        }

        // 打印时压缩图表高度，减少分页留白；打印结束后恢复屏幕高度
        // 注意：必须同时清掉屏幕样式的 min-height:260px，否则 resize 读到的容器高度仍是260
        function resizeChartsForPrint(height) {
            document.querySelectorAll('.chart-container').forEach(el => {
                el.style.minHeight = height ? '0' : '';
                el.style.height = height;
                const inst = echarts.getInstanceByDom(el);
                if (inst) inst.resize();
            });
        }

        window.addEventListener('beforeprint', () => resizeChartsForPrint('200px'));
        window.addEventListener('afterprint', () => resizeChartsForPrint(''));

        // ======= 通用工具函数（与 index.html 对齐）=======
        function isEmpty(value) {
            return value === null || value === undefined || value === '' ||
                (typeof value === 'string' && value.trim() === '');
        }

        function getFieldValue(row, fieldName) {
            if (!row || !fieldName) return null;
            if (fieldName in row && !isEmpty(row[fieldName])) return row[fieldName];
            // 模糊匹配：专业 → 专业分类
            const alias = { '专业': ['专业分类', '专业类型'], '分类定级': ['定级', '分类'] };
            if (alias[fieldName]) {
                for (const alt of alias[fieldName]) {
                    if (alt in row && !isEmpty(row[alt])) return row[alt];
                }
            }
            return null;
        }

        function getProfession(row) {
            const p = getFieldValue(row, '专业') || '未分类';
            return String(p).trim();
        }

        function isCompleted(row) {
            return row.status === '已消缺项' || row.status === '已消缺';
        }

        // ======= 日期工具函数（与 index.html 对齐）=======
        function getMonthKey(dateValue) {
            if (isEmpty(dateValue)) return null;
            let date;
            if (typeof dateValue === 'number') {
                date = new Date((dateValue - 25569) * 86400 * 1000);
            } else {
                date = new Date(dateValue);
            }
            if (isNaN(date.getTime())) return null;
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }

        function getDateFromDefectId(defectId) {
            if (!defectId) return null;
            const idStr = String(defectId);
            let datePart;
            if (idStr.length === 14) {
                datePart = idStr.substring(3, 11);
            } else if (idStr.length >= 8) {
                datePart = idStr.substring(0, 8);
            } else {
                return null;
            }
            const year = parseInt(datePart.substring(0, 4));
            const month = parseInt(datePart.substring(4, 6));
            const day = parseInt(datePart.substring(6, 8));
            if (!isNaN(year) && !isNaN(month) && !isNaN(day) &&
                year >= 2000 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                return new Date(year, month - 1, day);
            }
            return null;
        }

        function getMonthFromDefectId(defectId) {
            if (!defectId) return null;
            const idStr = String(defectId);
            let datePart;
            if (idStr.length === 14) {
                datePart = idStr.substring(3, 11);
            } else if (idStr.length >= 8) {
                datePart = idStr.substring(0, 8);
            } else {
                return null;
            }
            const year = datePart.substring(0, 4);
            const month = datePart.substring(4, 6);
            if (!isNaN(year) && !isNaN(month) && year.length === 4 && month.length === 2) {
                return `${year}-${month}`;
            }
            return null;
        }

        // 自动检测站点类型
        function detectStationType(data) {
            if (!data || data.length === 0) return 'recv';
            let has11 = false, has14 = false;
            for (const row of data) {
                const id = row['缺陷编号'] || row['编号'] || row['ID'];
                if (id) {
                    const idStr = String(id).trim();
                    if (idStr.length === 11) has11 = true;
                    if (idStr.length === 14) has14 = true;
                }
            }
            if (has11 && has14) return 'all';
            if (has14) return 'fen';
            return 'recv';
        }

        function getCompleteDate(row) {
            const completeDate = row['消项时间'] || row['消缺完成日期'] || row['完成日期'] || row['消缺时间'];
            if (!isEmpty(completeDate)) {
                let d;
                if (typeof completeDate === 'number') {
                    d = new Date((completeDate - 25569) * 86400 * 1000);
                } else {
                    d = new Date(completeDate);
                }
                if (!isNaN(d.getTime())) return d;
            }
            return null;
        }

        function getCompleteMonth(row) {
            const date = getCompleteDate(row);
            if (!date) return null;
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }

        function isSameMonth(date, now) {
            return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth();
        }

        function isSameYear(date, now) {
            return date.getFullYear() === now.getFullYear();
        }

        // 分类定级是否为Ⅰ类（一类/Ⅰ/I/1，排除二类/Ⅱ/II/2）
        function isClassILevel(level) {
            const s = String(level || '');
            if (/[二Ⅱ]/.test(s) || /II/i.test(s)) return false;
            return /[一Ⅰ1I]/.test(s);
        }

        // Ⅰ类缺陷口径：分类定级=Ⅰ类 且 专业不含土建、消防（未分类专业不计入）
        // 排行榜/柱状图/饼图及其底下表格共用
        function isClassIScopeRow(row) {
            const profession = getProfession(row);
            if (profession === '未分类' || profession.includes('土建') || profession.includes('消防')) return false;
            const levelRaw = getFieldValue(row, '分类定级');
            return !isEmpty(levelRaw) && isClassILevel(levelRaw);
        }

        // ======= 统计：月度数据（柱状图用，默认全部数据；classIOnly=true 时仅统计Ⅰ类缺陷）=======
        // 口径：新增只看缺陷编号前8位；消缺只看消项时间；取不到就不算（无 fallback）
        function calculateMonthlyStats(processedData, yearMonths, classIOnly) {
            const monthlyStats = {};
            yearMonths.forEach(m => { monthlyStats[m] = { new: 0, completed: 0, pending: 0 }; });

            processedData.forEach(row => {
                // Ⅰ类口径：仅统计 分类定级=Ⅰ类 且 专业不含土建/消防 的缺陷
                if (classIOnly && !isClassIScopeRow(row)) return;

                const defectId = row['缺陷编号'] || row['编号'] || row['ID'];

                // 新增：只信缺陷编号前8位
                const newMonthKey = getMonthFromDefectId(defectId);
                if (newMonthKey && yearMonths.includes(newMonthKey)) {
                    monthlyStats[newMonthKey].new++;
                }

                // 消缺：只信消项时间
                if (isCompleted(row)) {
                    const completeMonthKey = getCompleteMonth(row);
                    if (completeMonthKey && yearMonths.includes(completeMonthKey)) {
                        monthlyStats[completeMonthKey].completed++;
                    }
                }
            });

            // 剩余 = 截至该月底仍未消缺的数量（直接判定，与饼图/汇总表口径完全一致）
            // 判定：新增月份(缺陷编号前8位)≤该月 且 （尚未消缺 或 消缺月份>该月）
            // 不再用"滚存"算法：滚存会把12个月窗口外的新增漏掉，导致柱状图最后一月的剩余 ≠ 饼图剩余总计
            yearMonths.forEach(month => {
                let pending = 0;
                processedData.forEach(row => {
                    if (classIOnly && !isClassIScopeRow(row)) return;
                    const defectId = row['缺陷编号'] || row['编号'] || row['ID'];
                    const mk = getMonthFromDefectId(defectId);
                    if (!mk || mk > month) return;
                    if (isCompleted(row)) {
                        const ck = getCompleteMonth(row);
                        if (!ck || ck <= month) return;
                    }
                    pending++;
                });
                monthlyStats[month].pending = pending;
            });

            return monthlyStats;
        }

        // 专业显示名映射（根据站点类型动态设置）
        let PROFESSION_DISPLAY_NAMES = {
            '安全': 'QHSE部',
            '后勤': '综合管理部'
        };
        // 站点名称（根据来源界面URL参数判断，不再依赖数据自动检测）
        let stationName = '福建LNG';
        function setupStationConfig(data) {
            // 从URL参数读取站点类型，来源界面决定报告类型
            const urlParams = new URLSearchParams(window.location.search);
            const stationType = urlParams.get('station') || detectStationType(data);
            if (stationType === 'fen') {
                stationName = '分输站';
                MAJOR_PROFESSIONS = ['机械', '电气', '仪表', '信息化', '防腐', '工程', '分析', '管道抢修', '后勤', '安全', '管道运行部'];
                PROFESSION_DISPLAY_NAMES = {
                    '安全': 'QHSE部',
                    '后勤': '综合管理部'
                };
            } else if (stationType === 'recv') {
                stationName = '接收站';
                MAJOR_PROFESSIONS = ['机械', '电气', '仪表', '信息化', '防腐', '工程', '分析', '管道抢修', '后勤', '安全', '接收站运行部'];
                PROFESSION_DISPLAY_NAMES = {
                    '安全': 'QHSE部',
                    '后勤': '综合管理部'
                };
            } else {
                stationName = '福建LNG';
                MAJOR_PROFESSIONS = ['机械', '电气', '仪表', '信息化', '防腐', '工程', '分析', '管道抢修', '后勤', '安全', '接收站运行部', '管道运行部'];
                PROFESSION_DISPLAY_NAMES = {
                    '安全': 'QHSE部',
                    '后勤': '综合管理部'
                };
            }
            document.getElementById('reportTitle').textContent = `福建LNG${stationType === 'all' ? '' : stationName}设备缺陷数据分析报告`;
            // 饼图区块标题：总界面=（一）福建LNG，接收站=（一）接收站，分输站=（一）分输站
            document.getElementById('pieOverallTitle').textContent = stationType === 'all' ? '（一）福建LNG' : `（一）${stationName}`;
            // 土建/消防区块编号：总界面排在三个饼图后为（四）（五），单站报告排在自身饼图后为（二）（三）
            const civilNo = stationType === 'all' ? '（四）' : '（二）';
            const fireNo = stationType === 'all' ? '（五）' : '（三）';
            document.getElementById('civilTitle').textContent = `${civilNo}土建类缺陷`;
            document.getElementById('fireTitle').textContent = `${fireNo}消防类缺陷`;
        }
        function displayProfession(name) {
            return PROFESSION_DISPLAY_NAMES[name] || name;
        }

        // ======= 统计：Ⅰ类缺陷专业分布（饼图 + 饼图底下表格 共用，与 index.html 完全一致）=======
        // 口径：分类定级=Ⅰ类 + 专业不含土建、消防 + 专业≠未分类
        // 基准日期基准：remaining 统计全部待消缺项；new/completed 按 baseDate 所在月
        function getClassIProfessionStats(processedData, baseDate) {
            const isCivil = p => p.includes('土建');
            const ref = baseDate || new Date();
            const currentMonthKey = `${ref.getFullYear()}-${String(ref.getMonth() + 1).padStart(2, '0')}`;

            const remainingStats = {};
            const newStats = {};
            const completedStats = {};
            const extraProfessions = new Set();

            processedData.forEach(row => {
                const profession = getProfession(row);
                if (profession === '未分类' || isCivil(profession) || profession.includes('消防')) return;

                const levelRaw = getFieldValue(row, '分类定级');
                if (isEmpty(levelRaw) || !isClassILevel(levelRaw)) return;

                // 收集专业：预定义列表里没有的也加上
                if (!MAJOR_PROFESSIONS.includes(profession)) extraProfessions.add(profession);

                const defectId = row['缺陷编号'] || row['编号'] || row['ID'];
                const newMonthKey = getMonthFromDefectId(defectId);

                // 剩余统计：截至基准月底仍未消缺（与柱状图最后一月"剩余"口径完全一致）
                // = 新增月份≤基准月 且 （尚未消缺 或 消缺月份>基准月）
                // 上月模式下，本月才消缺的缺陷在上月底仍未消缺，需计入剩余
                if (newMonthKey && newMonthKey <= currentMonthKey) {
                    const ck = getCompleteMonth(row);
                    if (!isCompleted(row) || (ck && ck > currentMonthKey)) {
                        remainingStats[profession] = (remainingStats[profession] || 0) + 1;
                    }
                }

                // 本月新增统计（只认缺陷编号前8位，在基准月）
                if (newMonthKey === currentMonthKey) {
                    newStats[profession] = (newStats[profession] || 0) + 1;
                }

                // 本月消项统计（只认消项时间，在基准月）
                if (isCompleted(row)) {
                    const completeMonthKey = getCompleteMonth(row);
                    if (completeMonthKey === currentMonthKey) {
                        completedStats[profession] = (completedStats[profession] || 0) + 1;
                    }
                }
            });

            const professions = [...MAJOR_PROFESSIONS, ...extraProfessions];
            return { professions, remainingStats, newStats, completedStats };
        }

        // ======= 消缺龙虎榜表：日/周/月榜，各按对应周期的"第一"计榜，上榜率=拿第一次数/周期总数 =======
        // 每行显示该周期上榜率第一的专业及其消缺量与上榜率；周榜从1日起每7天算一周，月窗口=当年1月~基准月
        // 口径与主界面龙虎榜一致：Ⅰ/Ⅱ类均统计，土建/消防参与排名，未分类不计，仅统计已消缺且有消缺完成日期的数据
        function buildLeaderboard(processedData, baseDate, asOfDay) {
            const refDate = new Date(baseDate.getFullYear(), baseDate.getMonth(), asOfDay);

            // 预提取：日/月两个粒度的各专业消缺数
            const dailyCount = {}, monthCount = {};
            processedData.forEach(row => {
                if (!isCompleted(row)) return;
                const d = getCompleteDate(row);
                if (!d) return;
                const profession = getProfession(row);
                if (profession === '未分类') return;
                const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
                (dailyCount[`${y}-${m}-${day}`] = dailyCount[`${y}-${m}-${day}`] || {})[profession] = (dailyCount[`${y}-${m}-${day}`][profession] || 0) + 1;
                (monthCount[`${y}-${m}`] = monthCount[`${y}-${m}`] || {})[profession] = (monthCount[`${y}-${m}`][profession] || 0) + 1;
            });

            const topOf = counts => {
                const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
                return entries.length ? entries[0][0] : null;
            };
            // 某周期"第一"：拿第一次数最多（并列按消缺量），返回该专业的名称/消缺量/上榜率（仅百分比）
            const champInfo = (onList, volume, total) => {
                const entries = Object.entries(onList).sort((a, b) => b[1] - a[1] || (volume[b[0]] || 0) - (volume[a[0]] || 0));
                if (!entries.length) return { prof: '—', vol: '—', rate: '无上榜专业' };
                const [name, times] = entries[0];
                return {
                    prof: displayProfession(name),
                    vol: `${volume[name] || 0}项`,
                    rate: `${(times / total * 100).toFixed(0)}%`
                };
            };

            // === 日榜 & 周榜：窗口=基准月1日~基准日；周榜从1日起每7天算一周（1-7、8-14、15-21...） ===
            const periodDays = refDate.getDate();
            const dayTop = {}, periodVolume = {}, weekTop = {}, weekCounts = {};
            for (let i = 1; i <= periodDays; i++) {
                const dk = `${refDate.getFullYear()}-${String(refDate.getMonth() + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                Object.entries(dailyCount[dk] || {}).forEach(([name, c]) => { periodVolume[name] = (periodVolume[name] || 0) + c; });
                const t = topOf(dailyCount[dk]);
                if (t) dayTop[t] = (dayTop[t] || 0) + 1;
                const w = Math.floor((i - 1) / 7);
                (weekCounts[w] = weekCounts[w] || {});
                Object.entries(dailyCount[dk] || {}).forEach(([name, c]) => { weekCounts[w][name] = (weekCounts[w][name] || 0) + c; });
            }
            Object.values(weekCounts).forEach(counts => { const t = topOf(counts); if (t) weekTop[t] = (weekTop[t] || 0) + 1; });

            // === 月榜：窗口=当年1月~基准月（分母=已过月数，10月即除10），每月消缺第一计入榜单 ===
            const elapsedMonths = refDate.getMonth() + 1;
            const monthTop = {}, yearVolume = {};
            for (let m = 1; m <= elapsedMonths; m++) {
                const mk = `${refDate.getFullYear()}-${String(m).padStart(2, '0')}`;
                Object.entries(monthCount[mk] || {}).forEach(([name, c]) => { yearVolume[name] = (yearVolume[name] || 0) + c; });
                const t = topOf(monthCount[mk]);
                if (t) monthTop[t] = (monthTop[t] || 0) + 1;
            }

            // === 组装表格（备注列预留为空） ===
            const rows = [
                { period: '日榜', ...champInfo(dayTop, periodVolume, periodDays) },
                { period: '周榜', ...champInfo(weekTop, periodVolume, Object.keys(weekCounts).length) },
                { period: '月榜', ...champInfo(monthTop, yearVolume, elapsedMonths) }
            ];
            const rowsHtml = rows.map(r => `<tr><td>${r.period}</td><td>${r.prof}</td><td>${r.vol}</td><td>${r.rate}</td><td></td></tr>`).join('');

            return `<table class="lb-table"><thead>` +
                `<tr><th rowspan="2" style="width:12%;">周期</th><th colspan="3">消缺龙虎榜（第一）</th><th rowspan="2" style="width:16%;">备注</th></tr>` +
                `<tr><th style="width:18%;">专业</th><th style="width:16%;">消缺量</th><th style="width:38%;">上榜率</th></tr>` +
                `</thead><tbody>${rowsHtml}</tbody></table>`;
        }

        // ======= 生产重点关注缺陷情况：是否督办=是 =======
        // 缺陷描述=区域部位/设备名称/位号+缺陷描述；责任人=党员责任人；计划完成时间=计划期限；实际完成时间=消项时间
        function buildFocusSection(processedData, stationParam) {
            const normalize = s => String(s == null ? '' : s).replace(/[\s\/\\（）()·\-—_、，,。.:：]/g, '').toLowerCase();

            // 汇总所有行出现过的列名（首行可能缺列）
            const allKeys = [];
            const seenKeys = new Set();
            processedData.forEach(row => Object.keys(row).forEach(k => {
                if (!seenKeys.has(k)) { seenKeys.add(k); allKeys.push(k); }
            }));

            const findKey = (candidates, fuzzy) => {
                for (const cand of candidates) {
                    const nc = normalize(cand);
                    const hit = allKeys.find(k => normalize(k) === nc);
                    if (hit) return hit;
                }
                if (!fuzzy) return null;
                for (const cand of candidates) {
                    const nc = normalize(cand);
                    const hit = allKeys.find(k => normalize(k).includes(nc));
                    if (hit) return hit;
                }
                return null;
            };

            const keySupervise = findKey(['是否督办'], true);
            const keyAreaCombined = findKey(['区域部位/设备名称/位号'], false);
            const keyArea = findKey(['区域部位'], false);
            const keyDevice = findKey(['设备名称'], false);
            const keyTag = findKey(['位号'], false);
            const keyDesc = findKey(['缺陷描述'], true);
            const keyOwner = findKey(['党员责任人'], true);
            const keyPlan = findKey(['计划期限'], true);

            const parseDateValue = raw => {
                if (isEmpty(raw)) return null;
                let d;
                if (raw instanceof Date) d = raw;
                else if (typeof raw === 'number') d = new Date((raw - 25569) * 86400 * 1000);
                else d = new Date(String(raw).trim().replace(/[年\/.]/g, '-').replace(/月/g, '-').replace(/日/g, ''));
                return isNaN(d.getTime()) ? null : d;
            };
            const formatCnDate = d => d ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日` : '';

            // 重点关注：是否督办=是
            const isSupervised = row => keySupervise && String(row[keySupervise] == null ? '' : row[keySupervise]).trim() === '是';
            const focusRows = processedData.filter(isSupervised);

            // 总界面按缺陷编号长度拆分接收站(11位)/分输站(14位)；单站报告只统计本站
            const idLenOf = row => String(row['缺陷编号'] || row['编号'] || row['ID'] || '').trim().length;
            const isFenRow = row => idLenOf(row) === 14;
            const isAll = stationParam === 'all';
            const recvRows = focusRows.filter(row => !isFenRow(row));
            const fenRows = focusRows.filter(isFenRow);
            const ownRows = stationParam === 'fen' ? fenRows : recvRows;
            const groups = isAll
                ? [{ name: '接收站', rows: recvRows }, { name: '分输站', rows: fenRows }]
                : [{ name: stationParam === 'fen' ? '分输站' : '接收站', rows: ownRows }];

            const doneCount = rows => rows.filter(isCompleted).length;
            let summary;
            if (isAll) {
                summary = `累计梳理重点关注缺陷<span class="highlight">${focusRows.length}</span>项（接收站 ${recvRows.length} 项、分输站 ${fenRows.length} 项），已完成<span class="highlight">${doneCount(focusRows)}</span>项（接收站 ${doneCount(recvRows)} 项、分输站 ${doneCount(fenRows)} 项）。`;
            } else {
                summary = `累计梳理重点关注缺陷<span class="highlight">${ownRows.length}</span>项，已完成<span class="highlight">${doneCount(ownRows)}</span>项。`;
            }

            // 清单表：按站分组，每组带“接收站/分输站”标题行
            let seq = 0;
            const tableHtml = groups.map(group => {
                if (!group.rows.length) return '';
                const bodyHtml = group.rows.map(row => {
                    seq++;
                    const areaParts = [];
                    if (keyAreaCombined) {
                        const v = row[keyAreaCombined];
                        if (!isEmpty(v)) areaParts.push(String(v).trim());
                    } else {
                        [keyArea, keyDevice, keyTag].forEach(k => {
                            if (k && !isEmpty(row[k])) areaParts.push(String(row[k]).trim());
                        });
                    }
                    const descText = keyDesc ? String(row[keyDesc] == null ? '' : row[keyDesc]).trim() : '';
                    const desc = [areaParts.join('/'), descText].filter(Boolean).join(' ');
                    const owner = keyOwner ? String(row[keyOwner] == null ? '' : row[keyOwner]).trim() : '';
                    const planDate = formatCnDate(parseDateValue(keyPlan ? row[keyPlan] : ''));
                    const actualDate = isCompleted(row) ? formatCnDate(getCompleteDate(row)) : '';
                    return `<tr><td>${seq}</td><td class="focus-desc">${desc}</td><td>${owner}</td><td>${planDate}</td><td>${actualDate}</td></tr>`;
                }).join('');
                return `<div class="focus-table-wrap"><table class="focus-table">` +
                    `<colgroup><col style="width:6%;"><col style="width:56%;"><col style="width:10%;"><col style="width:14%;"><col style="width:14%;"></colgroup><thead>` +
                    `<tr><th colspan="5" class="focus-group-title">${group.name}</th></tr>` +
                    `<tr><th>序号</th><th>缺陷描述</th><th>责任人</th><th>计划完成时间</th><th>实际完成时间</th></tr>` +
                    `</thead><tbody>${bodyHtml}</tbody></table></div>`;
            }).join('');

            return { summary, tableHtml: tableHtml || '<p>暂无重点关注缺陷。</p>' };
        }

        function renderFocusSection(processedData) {
            const stationParam = new URLSearchParams(window.location.search).get('station') || 'recv';
            const { summary, tableHtml } = buildFocusSection(processedData, stationParam);
            document.getElementById('focusSummary').innerHTML = summary;
            document.getElementById('focusTable').innerHTML = tableHtml;
        }

        // ======= 加载 & 渲染主流程 =======
        function loadReport() {
            const saved = localStorage.getItem('defectData');
            if (!saved) {
                document.getElementById('noData').style.display = 'block';
                return;
            }

            const processedData = JSON.parse(saved);
            if (processedData.length === 0) {
                document.getElementById('noData').style.display = 'block';
                return;
            }

            // 总界面报告：清理残留的"其他"值，按编号长度转换
            const urlParams0 = new URLSearchParams(window.location.search);
            if (urlParams0.get('station') === 'all') {
                processedData.forEach(row => {
                    let profKey = null;
                    for (const key of Object.keys(row)) {
                        const ck = key.replace(/\s/g, '').toLowerCase();
                        if (ck === '专业' || ck === 'specialty' || ck === 'major') { profKey = key; break; }
                    }
                    if (!profKey) {
                        for (const key of Object.keys(row)) {
                            const ck = key.replace(/\s/g, '').toLowerCase();
                            if (ck.includes('专业')) { profKey = key; break; }
                        }
                    }
                    if (!profKey) return;
                    const prof = String(row[profKey] || '').trim();
                    if (prof !== '其他' && prof !== '其他专业') return;
                    let idKey = null;
                    for (const key of Object.keys(row)) {
                        const ck = key.replace(/\s/g, '').toLowerCase();
                        if (ck === '缺陷编号' || ck === '编号' || ck === 'id') { idKey = key; break; }
                    }
                    if (!idKey) return;
                    const id = String(row[idKey] || '').trim();
                    if (id.length === 11) {
                        row[profKey] = '接收站运行部';
                    } else if (id.length === 14) {
                        row[profKey] = '管道运行部';
                    }
                });
            }

            document.getElementById('noData').style.display = 'none';
            document.getElementById('reportContent').style.display = 'block';
            document.getElementById('btnGroup').style.display = 'flex';

            // 自动检测站点类型，设置站名和专业显示名
            setupStationConfig(processedData);

            const now = new Date();

            // 报告范围：thismonth=本月（截至当日）；lastmonth/默认=上月（截至上个完整月底）
            const params = new URLSearchParams(window.location.search);
            const isThisMonth = params.get('range') === 'thismonth';

            // 报告基准日期：本月模式=今天；上月模式=上个完整月（以该月1号代表）
            const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const baseDate = isThisMonth ? now : lastMonthDate;
            const currentYear = baseDate.getFullYear();
            const currentMonth = baseDate.getMonth() + 1;
            const currentMonthKey = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
            const prevMonthDate = new Date(baseDate.getFullYear(), baseDate.getMonth() - 1, 1);
            const lastMonthKey = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth() + 1).padStart(2, '0')}`;
            const daysInMonth = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 0).getDate();
            const asOfDay = isThisMonth ? now.getDate() : daysInMonth;

            // 报告标题："截至X年X月X日"
            document.getElementById('reportDate').textContent = `截至${currentYear}年${currentMonth}月${asOfDay}日`;

            // 动态年份（不再硬编码 2026）
            document.getElementById('labelYearNew').textContent = `${currentYear}年累计新增（Ⅰ类）`;
            document.getElementById('labelYearCompleted').textContent = `${currentYear}年累计消缺（Ⅰ类）`;

            // === 12 个月范围（从基准月往回数）===
            const yearMonths = [];
            for (let i = 11; i >= 0; i--) {
                const d = new Date(baseDate.getFullYear(), baseDate.getMonth() - i, 1);
                const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                yearMonths.push(monthKey);
            }

            // === 月度统计（Ⅰ类口径：定级Ⅰ类，专业不含土建/消防）===
            // 柱状图/底下月份表/总体情况文字/年度累计卡片 全部共用这一套
            const monthlyStats = calculateMonthlyStats(processedData, yearMonths, true);

            // === 本月（基准月）数据 ===
            const currentNew = monthlyStats[currentMonthKey].new;
            const currentCompleted = monthlyStats[currentMonthKey].completed;
            const currentRemaining = monthlyStats[currentMonthKey].pending;
            const lastMonthRemaining = monthlyStats[lastMonthKey] ? monthlyStats[lastMonthKey].pending : 0;

            // === 环比（剩余缺陷环比，与"剩余"口径一致）===
            let changeRate = 0;
            if (lastMonthRemaining > 0) {
                changeRate = ((currentRemaining - lastMonthRemaining) / lastMonthRemaining * 100).toFixed(1);
            }

            // === 年度累计 ===
            const yearNewTotal = yearMonths.reduce((sum, m) => sum + monthlyStats[m].new, 0);
            const yearCompletedTotal = yearMonths.reduce((sum, m) => sum + monthlyStats[m].completed, 0);

            // === 消缺完成率 = 本月消缺 / (本月消缺 + 本月新增) ===
            let completionRate = '无数据';
            const totalProcessed = currentCompleted + currentNew;
            if (totalProcessed > 0) {
                completionRate = `${(currentCompleted / totalProcessed * 100).toFixed(1)}%`;
            }

            // === I 类剩余 + 本月消缺（饼图/汇总表/分专业卡片共用，按 baseDate 所在月统计）===
            const classIStats = getClassIProfessionStats(processedData, baseDate);

            // 本月消缺前三名专业（基准月消项，Ⅰ类口径；本月模式=本月消缺，上月模式=上月消缺）
            const topCompleted = Object.entries(classIStats.completedStats)
                .sort((a, b) => b[1] - a[1]).slice(0, 3).map(([name]) => name);
            const topCompletedNames = topCompleted.map(displayProfession).join('、') || '无';

            // === 剩余前三名专业 + 专业剩余列表（截至基准月底仍未消缺，与饼图/柱状图剩余口径一致）===
            const pendingByProfession = {};
            processedData.forEach(row => {
                if (!isClassIScopeRow(row)) return;
                const profession = getProfession(row);
                const newMonthKey = getMonthFromDefectId(row['缺陷编号'] || row['编号'] || row['ID']);
                if (!newMonthKey || newMonthKey > currentMonthKey) return;
                // 已消缺且消缺月份≤基准月 → 基准月底时已消缺，不计入剩余
                const ck = getCompleteMonth(row);
                if (isCompleted(row) && (!ck || ck <= currentMonthKey)) return;
                pendingByProfession[profession] = (pendingByProfession[profession] || 0) + 1;
            });
            const topPending = Object.entries(pendingByProfession).sort((a, b) => b[1] - a[1]).slice(0, 3).map(item => item[0]);

            // === 文本 ===
            const changeText = changeRate >= 0 ? `上升${Math.abs(changeRate)}%` : `下降${Math.abs(changeRate)}%`;
            const summaryText = `截至${currentMonth}月${asOfDay}日，${stationName}Ⅰ类缺陷剩余<span class="highlight">${currentRemaining}</span>项，环比${changeText}（从<span class="highlight">${lastMonthRemaining}</span>项${changeRate >= 0 ? '上升至' : '降至'}<span class="highlight">${currentRemaining}</span>项）；${currentMonth}月消缺前三专业为${topCompletedNames}；${currentYear}年累计新增Ⅰ类缺陷<span class="highlight">${yearNewTotal}</span>项、消缺<span class="highlight">${yearCompletedTotal}</span>项。`;

            document.getElementById('summaryText').innerHTML = summaryText;
            document.getElementById('statYearNew').textContent = yearNewTotal;
            document.getElementById('statYearCompleted').textContent = yearCompletedTotal;
            document.getElementById('statChangeRate').textContent = lastMonthRemaining > 0 ? `${changeRate >= 0 ? '+' : ''}${changeRate}%` : '无数据';
            document.getElementById('statCompletionRate').textContent = completionRate;

            // 专业排名段落（用具体月份，避免"本月/上月"歧义）
            document.getElementById('completedMonthLabel').textContent = `${currentMonth}月`;
            document.getElementById('pendingMonthLabel').textContent = `${currentMonth}月`;
            document.getElementById('topCompletedProfessions').textContent = topCompletedNames;
            document.getElementById('topPendingProfessions').textContent = topPending.map(displayProfession).join('、') || '无';

            // 专业卡片：分别放在"本月消缺最多"与"本月剩余最多"下方，与前三名顺序一一对应
            // 消缺组卡片显示基准月消缺项数，剩余组卡片显示截至基准月底剩余项数
            const buildProfessionCard = (name, count) => {
                const item = document.createElement('div');
                item.className = 'profession-item';
                item.innerHTML = `<span class="profession-name">${displayProfession(name)}</span><span class="profession-count">${count}项</span>`;
                return item;
            };
            const completedListEl = document.getElementById('completedProfessionList');
            const pendingListEl = document.getElementById('pendingProfessionList');
            completedListEl.innerHTML = '';
            pendingListEl.innerHTML = '';
            topCompleted.forEach(name => completedListEl.appendChild(buildProfessionCard(name, classIStats.completedStats[name] || 0)));
            topPending.forEach(name => pendingListEl.appendChild(buildProfessionCard(name, pendingByProfession[name] || 0)));

            // 消缺龙虎榜表（日/周/月榜，每行显示各周期自己的第一）
            document.getElementById('leaderboardTable').innerHTML = buildLeaderboard(processedData, baseDate, asOfDay);

            // 生产重点关注缺陷情况（是否督办=是）
            renderFocusSection(processedData);

            // === 土建/消防：新增（基准月按编号解析）与剩余（截至基准月底仍未消缺，不分Ⅰ/Ⅱ类）===
            let civilNew = 0, civilPending = 0, fireNew = 0, firePending = 0;
            processedData.forEach(row => {
                const profession = getProfession(row);
                const isCiv = profession.includes('土建');
                const isFir = profession.includes('消防');
                if (!isCiv && !isFir) return;
                const newMonthKey = getMonthFromDefectId(row['缺陷编号'] || row['编号'] || row['ID']);
                if (!newMonthKey) return;
                if (newMonthKey === currentMonthKey) {
                    if (isCiv) civilNew++; else fireNew++;
                }
                if (newMonthKey <= currentMonthKey) {
                    const ck = getCompleteMonth(row);
                    if (!isCompleted(row) || (ck && ck > currentMonthKey)) {
                        if (isCiv) civilPending++; else firePending++;
                    }
                }
            });
            document.getElementById('civilSummary').innerHTML = `截至${currentMonth}月${asOfDay}日，土建类缺陷新增<span class="highlight">${civilNew}</span>项，剩余<span class="highlight">${civilPending}</span>项。`;
            document.getElementById('fireSummary').innerHTML = `截至${currentMonth}月${asOfDay}日，消防类缺陷新增<span class="highlight">${fireNew}</span>项，剩余<span class="highlight">${firePending}</span>项。`;

            // === 渲染图表 ===
            renderBarChart(yearMonths, monthlyStats, currentYear);
            renderPieChart(processedData, classIStats, baseDate, asOfDay);

            // === 总界面：饼图后追加接收站、分输站分站饼图（按缺陷编号长度拆分：11位=接收站，14位=分输站）===
            const urlParams2 = new URLSearchParams(window.location.search);
            if (urlParams2.get('station') === 'all') {
                const idOf = row => String(row['缺陷编号'] || row['编号'] || row['ID'] || '').trim();
                const recvData = processedData.filter(row => idOf(row).length === 11);
                const fenData = processedData.filter(row => idOf(row).length === 14);
                const allProfessions = MAJOR_PROFESSIONS.slice();
                const RECV_PROFESSIONS = ['机械', '电气', '仪表', '信息化', '防腐', '工程', '分析', '管道抢修', '后勤', '安全', '接收站运行部'];
                const FEN_PROFESSIONS = ['机械', '电气', '仪表', '信息化', '防腐', '工程', '分析', '管道抢修', '后勤', '安全', '管道运行部'];
                if (recvData.length > 0) {
                    MAJOR_PROFESSIONS = RECV_PROFESSIONS;
                    document.getElementById('recvPieSection').style.display = 'block';
                    renderPieChart(recvData, getClassIProfessionStats(recvData, baseDate), baseDate, asOfDay,
                        { station: '接收站', chartId: 'pieChartRecv', summaryId: 'pieChartSummaryRecv', tableId: 'pieChartTableRecv' });
                }
                if (fenData.length > 0) {
                    MAJOR_PROFESSIONS = FEN_PROFESSIONS;
                    document.getElementById('fenPieSection').style.display = 'block';
                    renderPieChart(fenData, getClassIProfessionStats(fenData, baseDate), baseDate, asOfDay,
                        { station: '分输站', chartId: 'pieChartFen', summaryId: 'pieChartSummaryFen', tableId: 'pieChartTableFen' });
                }
                MAJOR_PROFESSIONS = allProfessions;
            }
        }

        // ======= 柱状图（Ⅰ类口径：定级Ⅰ类，专业不含土建/消防，与底下月份表一致）=======
        function renderBarChart(months, monthlyStats, year) {
            const container = document.getElementById('barChart');
            const chart = echarts.init(container);

            const monthLabels = months.map(m => parseInt(m.split('-')[1]) + '月');
            const newData = months.map(m => monthlyStats[m].new);
            const completedData = months.map(m => monthlyStats[m].completed);
            const pendingData = months.map(m => monthlyStats[m].pending);

            chart.setOption({
                title: {
                    text: `${year}年${stationName}Ⅰ类设备缺陷管理统计`,
                    left: 'center', top: 0,
                    textStyle: { fontSize: 18, fontWeight: 'bold', color: '#333' }
                },
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: {
                    data: ['新增', '消缺', '剩余'],
                    right: 10, top: 'middle', orient: 'vertical'
                },
                grid: { left: '3%', right: '120px', bottom: '5%', top: '10%', containLabel: true },
                xAxis: { type: 'category', data: monthLabels, axisLabel: { rotate: 0, fontSize: 12 } },
                yAxis: { type: 'value' },
                series: [
                    { name: '新增', type: 'bar', data: newData, itemStyle: { color: '#4472c4' }, label: { show: true, position: 'top', fontSize: 11, fontWeight: 'bold' } },
                    { name: '消缺', type: 'bar', data: completedData, itemStyle: { color: '#c5504b' }, label: { show: true, position: 'top', fontSize: 11, fontWeight: 'bold' } },
                    { name: '剩余', type: 'bar', data: pendingData, itemStyle: { color: '#70ad47' }, label: { show: true, position: 'top', fontSize: 11, fontWeight: 'bold' } }
                ]
            });

            // 底下月份表
            const tbl = document.getElementById('barChartTable');
            let html = '<table><thead><tr><th></th>';
            monthLabels.forEach(m => html += `<th>${m}</th>`);
            html += '</tr></thead><tbody>';
            html += '<tr><td><span class="legend-dot" style="background-color: #4472c4;"></span>新增</td>';
            newData.forEach(v => html += `<td>${v}</td>`);
            html += '</tr><tr><td><span class="legend-dot" style="background-color: #c5504b;"></span>消缺</td>';
            completedData.forEach(v => html += `<td>${v}</td>`);
            html += '</tr><tr><td><span class="legend-dot" style="background-color: #70ad47;"></span>剩余</td>';
            pendingData.forEach(v => html += `<td>${v}</td>`);
            html += '</tr></tbody></table>';
            tbl.innerHTML = html;

            window.addEventListener('resize', () => chart.resize());
        }

        // ======= 饼图（Ⅰ类缺陷专业分布，与 index.html 口径完全一致）=======
        // 饼图底下表格：接收站 + 总计 + 各专业（MAJOR_PROFESSIONS + Excel额外）
        // opts：station=站名覆盖、chartId/summaryId/tableId=渲染目标容器（总界面分站饼图用）
        function renderPieChart(processedData, classIStats, baseDate, asOfDay, opts = {}) {
            const { professions, remainingStats, newStats, completedStats } = classIStats;
            const currentMonthKey = `${baseDate.getFullYear()}-${String(baseDate.getMonth() + 1).padStart(2, '0')}`;
            const day = asOfDay || new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 0).getDate();
            const labelStation = opts.station || stationName;
            const chartId = opts.chartId || 'pieChart';
            const summaryId = opts.summaryId || 'pieChartSummary';
            const tableId = opts.tableId || 'pieChartTable';

            const pieData = professions
                .map(name => ({ name: displayProfession(name), value: remainingStats[name] || 0 }));

            const container = document.getElementById(chartId);
            if (!container) return;

            if (pieData.every(d => d.value === 0)) {
                container.innerHTML = '<div style="text-align:center;padding-top:100px;color:#999;">暂无数据</div>';
            } else {
                const colors = ['#4472c4', '#c5504b', '#70ad47', '#ffc000', '#5b9bd5', '#ed7d31', '#a5a5a5', '#7030a0'];
                const chart = echarts.init(container);
                chart.setOption({
                    title: {
                        text: `${labelStation}当前主要剩余Ⅰ类缺陷专业分布情况`,
                        left: 'center', top: 10,
                        textStyle: { fontSize: 16, fontWeight: 'bold', color: '#333' }
                    },
                    tooltip: { trigger: 'item', formatter: '{b}: {c}项 ({d}%)' },
                    legend: {
                        type: 'plain', orient: 'vertical', right: 15, top: 60,
                        columns: 1, itemWidth: 10, itemHeight: 8, itemGap: 8,
                        textStyle: { fontSize: 11 }, data: professions.map(displayProfession)
                    },
                    series: [{
                        name: '待消缺专业分布',
                        type: 'pie',
                        radius: ['35%', '70%'],
                        center: ['50%', '55%'],
                        itemStyle: { borderRadius: 5, borderColor: '#fff', borderWidth: 2 },
                        label: { show: true, formatter: '{b}: {c}项', fontSize: 12 },
                        labelLine: { show: true, length: 15, length2: 20 },
                        data: pieData.map((item, index) => ({
                            ...item,
                            itemStyle: { color: colors[index % colors.length] }
                        }))
                    }]
                });
                window.addEventListener('resize', () => chart.resize());
            }

            // 饼图底下汇总表
            const totalRemaining = pieData.reduce((s, d) => s + d.value, 0);
            const totalNew = Object.values(newStats).reduce((s, v) => s + v, 0);
            const totalCompleted = Object.values(completedStats).reduce((s, v) => s + v, 0);
            // 行标签用基准月份数字（本月模式=当月，上月模式=上个月），避免"本月"歧义
            const monthLabel = parseInt(currentMonthKey.split('-')[1], 10) + '月';

            // 二类/土建/消防剩余（截至基准月底仍未消缺，与Ⅰ类剩余同口径；土建、消防不分Ⅰ/Ⅱ类）
            let pendingII = 0, pendingCivil = 0, pendingFire = 0;
            processedData.forEach(row => {
                const profession = getProfession(row);
                const newMonthKey = getMonthFromDefectId(row['缺陷编号'] || row['编号'] || row['ID']);
                if (!newMonthKey || newMonthKey > currentMonthKey) return;
                const ck = getCompleteMonth(row);
                if (isCompleted(row) && (!ck || ck <= currentMonthKey)) return;
                if (profession.includes('消防')) { pendingFire++; return; }
                if (profession.includes('土建')) { pendingCivil++; return; }
                const levelRaw = getFieldValue(row, '分类定级');
                if (!isEmpty(levelRaw) && !isClassILevel(levelRaw) && /二|Ⅱ|II/i.test(String(levelRaw))) pendingII++;
            });

            const summaryEl = document.getElementById(summaryId);
            summaryEl.innerHTML = `截至${currentMonthKey.split('-')[1]}月${day}日，${labelStation}Ⅰ类缺陷剩余<span class="highlight">${totalRemaining}</span>项；${currentMonthKey.split('-')[1]}月新增${totalNew}项，消缺${totalCompleted}项。Ⅱ类剩余${pendingII}项，土建剩余${pendingCivil}项，消防剩余${pendingFire}项。`;

            // 表格结构（与 index.html renderSummaryTable 一致）
            const totalRows = 1 + 3;  // 1行表头 + 3行数据
            const tbl = document.getElementById(tableId);
            let html = '<div class="summary-table-wrap"><table class="summary-table">';
            html += '<tbody>';
            // 表头行
            html += '<tr class="st-header-row">';
            html += `<th class="st-col" rowspan="${totalRows}">${labelStation.split('').join('<br>')}</th>`;
            html += '<th>Ⅰ类缺陷</th>';
            html += '<th class="st-sub-total">总计</th>';
            professions.forEach(p => { html += `<th>${displayProfession(p)}</th>`; });
            html += '</tr>';

            // 剩余
            html += '<tr>';
            html += '<td>剩余</td>';
            html += `<td class="st-total">${totalRemaining}</td>`;
            professions.forEach(p => { html += `<td>${remainingStats[p] || 0}</td>`; });
            html += '</tr>';

            // 本月新增
            html += '<tr>';
            html += `<td>${monthLabel}新增</td>`;
            html += `<td class="st-total">${totalNew}</td>`;
            professions.forEach(p => { html += `<td>${newStats[p] || 0}</td>`; });
            html += '</tr>';

            // 本月消项
            html += '<tr>';
            html += `<td>${monthLabel}消项</td>`;
            html += `<td class="st-total">${totalCompleted}</td>`;
            professions.forEach(p => { html += `<td>${completedStats[p] || 0}</td>`; });
            html += '</tr>';

            html += '</tbody></table></div>';
            tbl.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadReport);
    </script>
</body>

</html>
