<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福建LNG接收站设备缺陷数据分析报告</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* ======= Reset & 全局 ======= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            padding: 20px;
            min-height: 100vh;
        }

        /* ======= 容器 ======= */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 36px 40px;
            min-height: calc(100vh - 40px);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2c3e50 0%, #34495e 50%, #2c3e50 100%);
            border-radius: 16px 16px 0 0;
        }

        /* ======= 头部 ======= */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #2c3e50, #3498db);
            border-radius: 2px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .header .date {
            color: #666;
            font-size: 13px;
            margin-top: 12px;
            font-weight: 400;
        }

        /* ======= 报告章节 ======= */
        .report-section {
            margin-bottom: 30px;
        }

        .report-section h2 {
            color: #2c3e50;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding: 8px 14px;
            background: linear-gradient(90deg, #f8f9fa 0%, transparent 100%);
            border-left: 4px solid #3498db;
            border-radius: 0 4px 4px 0;
            display: flex;
            align-items: center;
        }

        .report-section p {
            color: #444;
            line-height: 1.8;
            font-size: 14px;
            text-indent: 2em;
            margin-bottom: 16px;
        }

        .highlight {
            font-weight: normal;
            color: #2c3e50;
        }

        /* ======= 年度累计统计卡片 ======= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .stat-card {
            background: linear-gradient(145deg, #ffffff 0%, #f8f9fa 100%);
            padding: 16px 14px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3498db 0%, #2c3e50 100%);
            border-radius: 10px 10px 0 0;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: #2c3e50;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ======= 按钮 ======= */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #2c3e50;
            color: white;
        }

        .btn-primary:hover {
            background-color: #34495e;
        }

        .btn-back {
            background-color: #95a5a6;
            color: white;
            margin-right: 10px;
        }

        .btn-back:hover {
            background-color: #7f8c8d;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-data p {
            margin-bottom: 20px;
        }

        /* ======= 分专业模块 ======= */
        .profession-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #f0f3f6 100%);
            border-radius: 10px;
            padding: 14px 20px;
            margin-bottom: 16px;
            border-left: 4px solid #3498db;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .profession-section p {
            margin-bottom: 6px;
            text-indent: 0;
            color: #444;
            font-size: 14px;
            line-height: 1.6;
        }

        .profession-section p:last-child {
            margin-bottom: 0;
        }

        .profession-section span {
            font-weight: normal;
            color: #2c3e50;
        }

        .profession-list {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px 12px;
        }

        .profession-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #e9ecef;
        }

        .profession-name {
            color: #333;
            font-weight: 500;
        }

        .profession-count {
            font-weight: 700;
            color: #2c3e50;
            font-size: 14px;
            background: white;
            padding: 2px 10px;
            border-radius: 12px;
            min-width: 44px;
            text-align: center;
        }

        /* ======= 汇总表样式（与 index.html 一致） ======= */
        .summary-table-wrap {
            margin: 0;
            padding: 8px 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            table-layout: fixed;
        }

        .summary-table th,
        .summary-table td {
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 4px 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .summary-table tr.st-header-row th {
            background: #2c3e50;
            color: white;
            font-weight: 600;
            font-size: 11px;
        }

        .summary-table tr.st-header-row th.st-col {
            background: #34495e;
        }

        .summary-table tr.st-header-row th.st-sub-total {
            background: #34495e;
        }

        .summary-table th.st-col,
        .summary-table td.st-col {
            width: 26px;
            padding: 6px 2px;
            font-size: 13px;
            line-height: 1.4;
            letter-spacing: 1px;
            vertical-align: middle;
        }

        .summary-table tbody td.st-total {
            font-weight: 700;
            color: #2c3e50;
        }

        /* ======= 图表区 ======= */
        .chart-section {
            background: white;
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .chart-container {
            width: 100%;
            height: 280px;
            margin-bottom: 12px;
            min-height: 260px;
        }

        .chart-data-table {
            margin-top: 5px;
            overflow-x: auto;
        }

        .chart-data-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .chart-data-table th,
        .chart-data-table td {
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 6px 10px;
            text-align: center;
        }

        .chart-data-table th {
            background-color: #2c3e50;
            font-weight: 600;
            color: white;
        }

        .chart-data-table .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: middle;
        }

        .chart-summary {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #3498db;
        }

        /* ======= 打印样式 ======= */
        @page {
            margin: 0;
        }

        @media print {
            body {
                background: white !important;
                margin: 0;
                padding: 0;
            }

            /* 容器左右内边距：跨页生效，提供每页左右页边距 */
            .container {
                min-height: auto !important;
                height: auto !important;
                overflow: visible !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                padding: 0 12mm !important;
                position: relative !important;
            }

            /* 第一页顶部页边距 */
            .header {
                margin: 0 !important;
                padding: 10mm 0 5mm !important;
            }

            /* 每个 section 顶部内边距作为新页顶部页边距；break-inside 避免跨页截断 */
            .report-section {
                margin: 0 !important;
                padding: 10mm 0 0 !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .report-section:last-of-type {
                padding-bottom: 10mm !important;
            }

            .btn-group {
                display: none !important;
            }

            .btn-group#btnGroup {
                display: none !important;
            }

            .chart-container {
                page-break-inside: avoid;
            }

            .stats-grid {
                page-break-inside: avoid;
            }

            /* 打印时汇总表允许换行，避免文字被截断 */
            .summary-table {
                font-size: 10px !important;
            }

            .summary-table th,
            .summary-table td {
                white-space: normal !important;
                overflow: visible !important;
                text-overflow: clip !important;
                padding: 3px 2px !important;
            }

            .summary-table th.st-col,
            .summary-table td.st-col {
                font-size: 11px !important;
                padding: 4px 2px !important;
            }

            .stat-value {
                background: none !important;
                -webkit-background-clip: initial !important;
                -webkit-text-fill-color: #2c3e50 !important;
                background-clip: initial !important;
                color: #2c3e50 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            svg {
                filter: none !important;
            }

            canvas {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>福建LNG接收站设备缺陷数据分析报告</h1>
            <div class="date" id="reportDate"></div>
        </div>

        <div id="reportContent" style="display: none;">
            <div class="report-section">
                <h2>一、总体情况</h2>
                <p id="summaryText"></p>

                <div class="chart-section">
                    <div class="chart-container" id="barChart"></div>
                    <div class="chart-data-table" id="barChartTable"></div>
                </div>
            </div>

            <div class="report-section">
                <h2>二、分专业情况</h2>
                <div class="profession-section" id="professionSection">
                    <p>本期消缺最多前三名专业：<span id="topCompletedProfessions"></span>。</p>
                    <p>本期剩余最多前三名专业：<span id="topPendingProfessions"></span>。</p>
                </div>

                <div class="profession-list" id="professionList"></div>

                <div class="chart-section">
                    <div class="chart-container" id="pieChart"></div>
                    <p class="chart-summary" id="pieChartSummary"></p>
                    <div id="pieChartTable"></div>
                </div>
            </div>

            <div class="report-section">
                <h2>三、年度累计统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label" id="labelYearNew"></div>
                        <div class="stat-value" id="statYearNew"></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label" id="labelYearCompleted"></div>
                        <div class="stat-value" id="statYearCompleted"></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">环比变化率</div>
                        <div class="stat-value" id="statChangeRate"></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">消缺完成率</div>
                        <div class="stat-value" id="statCompletionRate"></div>
                    </div>
                </div>
            </div>

        </div>

        <div id="noData" class="no-data">
            <p>暂无数据，请先在主页面导入Excel文件</p>
            <button class="btn btn-primary" onclick="goBack()">返回主页面</button>
        </div>

        <div class="btn-group" id="btnGroup" style="display: none;">
            <button class="btn btn-back" onclick="goBack()">返回主页面</button>
            <button class="btn btn-primary" onclick="printReport()">打印报告</button>
        </div>
    </div>

    <script>
        // ======= 全局配置常量（与 index.html 完全一致）=======
        const MAJOR_PROFESSIONS = ['机械', '电气', '仪表', '信息化', '防腐', '工程', '分析', '管道抢修', '后勤', '安全', '其他'];

        // ======= 导航 & 打印 =======
        function goBack() {
            window.location.href = 'index.html';
        }

        function printReport() {
            window.print();
        }

        // ======= 通用工具函数（与 index.html 对齐）=======
        function isEmpty(value) {
            return value === null || value === undefined || value === '' ||
                (typeof value === 'string' && value.trim() === '');
        }

        function getFieldValue(row, fieldName) {
            if (!row || !fieldName) return null;
            if (fieldName in row && !isEmpty(row[fieldName])) return row[fieldName];
            // 模糊匹配：专业 → 专业分类
            const alias = { '专业': ['专业分类', '专业类型'], '分类定级': ['定级', '分类'] };
            if (alias[fieldName]) {
                for (const alt of alias[fieldName]) {
                    if (alt in row && !isEmpty(row[alt])) return row[alt];
                }
            }
            return null;
        }

        function getProfession(row) {
            const p = getFieldValue(row, '专业') || '未分类';
            return String(p).trim();
        }

        function isPending(row) {
            return row.status === '待消缺项目' || row.status === '待消缺';
        }

        function isCompleted(row) {
            return row.status === '已消缺项' || row.status === '已消缺';
        }

        // ======= 日期工具函数（与 index.html 对齐）=======
        function getMonthKey(dateValue) {
            if (isEmpty(dateValue)) return null;
            let date;
            if (typeof dateValue === 'number') {
                date = new Date((dateValue - 25569) * 86400 * 1000);
            } else {
                date = new Date(dateValue);
            }
            if (isNaN(date.getTime())) return null;
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }

        function getDateFromDefectId(defectId) {
            if (!defectId) return null;
            const idStr = String(defectId);
            if (idStr.length >= 8) {
                const datePart = idStr.substring(0, 8);
                const year = parseInt(datePart.substring(0, 4));
                const month = parseInt(datePart.substring(4, 6));
                const day = parseInt(datePart.substring(6, 8));
                if (!isNaN(year) && !isNaN(month) && !isNaN(day) &&
                    year >= 2000 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                    return new Date(year, month - 1, day);
                }
            }
            return null;
        }

        function getMonthFromDefectId(defectId) {
            if (!defectId) return null;
            const idStr = String(defectId);
            if (idStr.length >= 8) {
                const datePart = idStr.substring(0, 8);
                const year = datePart.substring(0, 4);
                const month = datePart.substring(4, 6);
                if (!isNaN(year) && !isNaN(month) && year.length === 4 && month.length === 2) {
                    return `${year}-${month}`;
                }
            }
            return null;
        }

        function getCompleteDate(row) {
            const completeDate = row['消项时间'] || row['消缺完成日期'] || row['完成日期'] || row['消缺时间'];
            if (!isEmpty(completeDate)) {
                let d;
                if (typeof completeDate === 'number') {
                    d = new Date((completeDate - 25569) * 86400 * 1000);
                } else {
                    d = new Date(completeDate);
                }
                if (!isNaN(d.getTime())) return d;
            }
            return null;
        }

        function getCompleteMonth(row) {
            const date = getCompleteDate(row);
            if (!date) return null;
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }

        function isSameMonth(date, now) {
            return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth();
        }

        function isSameYear(date, now) {
            return date.getFullYear() === now.getFullYear();
        }

        // ======= 统计：月度数据（柱状图用，全部数据、不筛 I/II、不筛土建）=======
        // 口径：新增只看缺陷编号前8位；消缺只看消项时间；取不到就不算（无 fallback）
        function calculateMonthlyStats(processedData, yearMonths) {
            const monthlyStats = {};
            yearMonths.forEach(m => { monthlyStats[m] = { new: 0, completed: 0, pending: 0 }; });

            processedData.forEach(row => {
                const defectId = row['缺陷编号'] || row['编号'] || row['ID'];

                // 新增：只信缺陷编号前8位
                const newMonthKey = getMonthFromDefectId(defectId);
                if (newMonthKey && yearMonths.includes(newMonthKey)) {
                    monthlyStats[newMonthKey].new++;
                }

                // 消缺：只信消项时间
                if (isCompleted(row)) {
                    const completeMonthKey = getCompleteMonth(row);
                    if (completeMonthKey && yearMonths.includes(completeMonthKey)) {
                        monthlyStats[completeMonthKey].completed++;
                    }
                }
            });

            // 剩余 = 滚存
            let prevPending = 0;
            yearMonths.forEach(month => {
                const { new: n, completed: c } = monthlyStats[month];
                const currentRemaining = prevPending + n - c;
                monthlyStats[month].pending = currentRemaining;
                prevPending = currentRemaining;
            });

            return monthlyStats;
        }

        // ======= 统计：I类缺陷专业分布（饼图 + 饼图底下表格 共用，与 index.html 完全一致）=======
        // 口径：分类定级=一类 + 专业不含土建 + 专业≠未分类
        // 基准日期基准：remaining 统计全部待消缺项；new/completed 按 baseDate 所在月
        function getClassIProfessionStats(processedData, baseDate) {
            const isCivil = p => p.includes('土建');
            const isClassI = level => /[一ⅠI]/.test(String(level));
            const ref = baseDate || new Date();
            const currentMonthKey = `${ref.getFullYear()}-${String(ref.getMonth() + 1).padStart(2, '0')}`;

            const remainingStats = {};
            const newStats = {};
            const completedStats = {};
            const extraProfessions = new Set();

            processedData.forEach(row => {
                const profession = getProfession(row);
                if (profession === '未分类' || isCivil(profession)) return;

                const levelRaw = getFieldValue(row, '分类定级');
                const level = isEmpty(levelRaw) ? '' : String(levelRaw);
                if (!isClassI(level)) return;

                // 收集专业：预定义列表里没有的也加上
                if (!MAJOR_PROFESSIONS.includes(profession)) extraProfessions.add(profession);

                // 剩余统计（待消缺）
                if (isPending(row)) {
                    remainingStats[profession] = (remainingStats[profession] || 0) + 1;
                }

                // 本月新增统计（缺陷编号前8位在本月）
                const defectId = row['缺陷编号'] || row['编号'] || row['ID'];
                const newMonthKey = getMonthFromDefectId(defectId);
                if (newMonthKey === currentMonthKey) {
                    newStats[profession] = (newStats[profession] || 0) + 1;
                }

                // 本月消项统计（消项时间在本月）
                if (isCompleted(row)) {
                    const completeMonthKey = getCompleteMonth(row);
                    if (completeMonthKey === currentMonthKey) {
                        completedStats[profession] = (completedStats[profession] || 0) + 1;
                    }
                }
            });

            const professions = [...MAJOR_PROFESSIONS, ...extraProfessions];
            return { professions, remainingStats, newStats, completedStats };
        }

        // ======= 统计：分专业消缺/剩余排名（龙虎榜用，全部数据）=======
        function calculateLeaderboard(processedData, baseDate) {
            const ref = baseDate || new Date();
            const startOfWeek = new Date(ref);
            const day = startOfWeek.getDay() || 7;
            startOfWeek.setDate(startOfWeek.getDate() - day + 1);
            startOfWeek.setHours(0, 0, 0, 0);
            const startOfMonth = new Date(ref.getFullYear(), ref.getMonth(), 1);
            const startOfYear = new Date(ref.getFullYear(), 0, 1);

            function countByProfession(datePredicate) {
                const stats = {};
                processedData.forEach(row => {
                    if (!isCompleted(row)) return;
                    const completeDate = getCompleteDate(row);
                    if (!completeDate || !datePredicate(completeDate)) return;
                    const profession = getProfession(row);
                    if (profession === '未分类') return;
                    stats[profession] = (stats[profession] || 0) + 1;
                });
                return stats;
            }

            const yesterdayStats = countByProfession(d => {
                const yesterday = new Date(ref); yesterday.setDate(yesterday.getDate() - 1);
                return d.getFullYear() === yesterday.getFullYear() && d.getMonth() === yesterday.getMonth() && d.getDate() === yesterday.getDate();
            });
            const weekStats = countByProfession(d => d >= startOfWeek);
            const monthStats = countByProfession(d => d >= startOfMonth);
            const yearStats = countByProfession(d => d >= startOfYear);

            function top(stats, n) {
                return Object.entries(stats).sort((a, b) => b[1] - a[1]).slice(0, n);
            }

            return {
                yesterdayTop1: top(yesterdayStats, 1),
                weekTop1: top(weekStats, 1),
                monthTop3: top(monthStats, 3),
                yearTop3: top(yearStats, 3)
            };
        }

        // ======= 加载 & 渲染主流程 =======
        function loadReport() {
            const saved = localStorage.getItem('defectData');
            if (!saved) {
                document.getElementById('noData').style.display = 'block';
                return;
            }

            const processedData = JSON.parse(saved);
            if (processedData.length === 0) {
                document.getElementById('noData').style.display = 'block';
                return;
            }

            document.getElementById('noData').style.display = 'none';
            document.getElementById('reportContent').style.display = 'block';
            document.getElementById('btnGroup').style.display = 'flex';

            const now = new Date();

            // 报告基准：以"上个月"为准（当月数据不完整）
            const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const currentYear = lastMonthDate.getFullYear();
            const currentMonth = lastMonthDate.getMonth() + 1;
            const currentMonthKey = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
            const prevMonthDate = new Date(lastMonthDate.getFullYear(), lastMonthDate.getMonth() - 1, 1);
            const lastMonthKey = `${prevMonthDate.getFullYear()}-${String(prevMonthDate.getMonth() + 1).padStart(2, '0')}`;
            const daysInMonth = new Date(lastMonthDate.getFullYear(), lastMonthDate.getMonth() + 1, 0).getDate();

            // 报告标题："截至上月X日"
            document.getElementById('reportDate').textContent = `截至${currentYear}年${currentMonth}月${daysInMonth}日`;

            // 动态年份（不再硬编码 2026）
            document.getElementById('labelYearNew').textContent = `${currentYear}年累计新增`;
            document.getElementById('labelYearCompleted').textContent = `${currentYear}年累计消缺`;

            // === 12 个月范围（从上月往回数）===
            const yearMonths = [];
            for (let i = 11; i >= 0; i--) {
                const d = new Date(lastMonthDate.getFullYear(), lastMonthDate.getMonth() - i, 1);
                const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                yearMonths.push(monthKey);
            }

            // === 月度统计 ===
            const monthlyStats = calculateMonthlyStats(processedData, yearMonths);

            // === 本月数据 ===
            const currentNew = monthlyStats[currentMonthKey].new;
            const currentCompleted = monthlyStats[currentMonthKey].completed;
            const currentRemaining = monthlyStats[currentMonthKey].pending;
            const lastMonthRemaining = monthlyStats[lastMonthKey] ? monthlyStats[lastMonthKey].pending : 0;

            // === 环比（剩余缺陷环比，与"剩余"口径一致）===
            let changeRate = 0;
            if (lastMonthRemaining > 0) {
                changeRate = ((currentRemaining - lastMonthRemaining) / lastMonthRemaining * 100).toFixed(1);
            }

            // === 年度累计 ===
            const yearNewTotal = yearMonths.reduce((sum, m) => sum + monthlyStats[m].new, 0);
            const yearCompletedTotal = yearMonths.reduce((sum, m) => sum + monthlyStats[m].completed, 0);

            // === 消缺完成率 = 本月消缺 / (本月消缺 + 本月新增) ===
            let completionRate = '无数据';
            const totalProcessed = currentCompleted + currentNew;
            if (totalProcessed > 0) {
                completionRate = `${(currentCompleted / totalProcessed * 100).toFixed(1)}%`;
            }

            // === 消缺龙虎榜（年度累计按 baseDate 所在年算）===
            const lb = calculateLeaderboard(processedData, lastMonthDate);
            const topCompletedNames = lb.yearTop3.map(([name]) => name).join('、') || '无';

            // === I 类剩余（饼图数据口径，本月新增/消项按 baseDate 所在月）===
            const classIStats = getClassIProfessionStats(processedData, lastMonthDate);
            const totalClassIRemaining = Object.values(classIStats.remainingStats).reduce((a, b) => a + b, 0);

            // === 剩余前三名专业（全部专业口径）===
            const pendingByProfession = {};
            processedData.forEach(row => {
                if (!isPending(row)) return;
                const profession = getProfession(row);
                if (profession === '未分类') return;
                const newMonthKey = getMonthFromDefectId(row['缺陷编号'] || row['编号'] || row['ID']);
                if (newMonthKey && yearMonths.includes(newMonthKey)) {
                    pendingByProfession[profession] = (pendingByProfession[profession] || 0) + 1;
                }
            });
            const topPending = Object.entries(pendingByProfession).sort((a, b) => b[1] - a[1]).slice(0, 3).map(item => item[0]);

            // === 文本 ===
            const changeText = changeRate >= 0 ? `上升${Math.abs(changeRate)}%` : `下降${Math.abs(changeRate)}%`;
            const summaryText = `截至${currentMonth}月${daysInMonth}日，接收站缺陷剩余<span class="highlight">${currentRemaining}</span>项，环比${changeText}（从<span class="highlight">${lastMonthRemaining}</span>项${changeRate >= 0 ? '上升至' : '降至'}<span class="highlight">${currentRemaining}</span>项）；本期消缺前三专业为${topCompletedNames}；${currentYear}年累计新增<span class="highlight">${yearNewTotal}</span>项、消缺<span class="highlight">${yearCompletedTotal}</span>项。`;

            document.getElementById('summaryText').innerHTML = summaryText;
            document.getElementById('statYearNew').textContent = yearNewTotal;
            document.getElementById('statYearCompleted').textContent = yearCompletedTotal;
            document.getElementById('statChangeRate').textContent = lastMonthRemaining > 0 ? `${changeRate >= 0 ? '+' : ''}${changeRate}%` : '无数据';
            document.getElementById('statCompletionRate').textContent = completionRate;

            // 专业排名段落
            document.getElementById('topCompletedProfessions').textContent = topCompletedNames;
            document.getElementById('topPendingProfessions').textContent = topPending.join('、') || '无';

            // 专业剩余列表
            const professionListEl = document.getElementById('professionList');
            professionListEl.innerHTML = '';
            const sortedPendingProfessions = Object.entries(pendingByProfession).sort((a, b) => {
                if (a[0] === '其他') return 1;
                if (b[0] === '其他') return -1;
                if (b[1] !== a[1]) return b[1] - a[1];
                return a[0].localeCompare(b[0], 'zh-CN');
            });
            sortedPendingProfessions.forEach(([name, count]) => {
                const item = document.createElement('div');
                item.className = 'profession-item';
                item.innerHTML = `<span class="profession-name">${name}</span><span class="profession-count">${count}项</span>`;
                professionListEl.appendChild(item);
            });

            // === 渲染图表 ===
            renderBarChart(yearMonths, monthlyStats, currentYear);
            renderPieChart(processedData, classIStats, lastMonthDate);
        }

        // ======= 柱状图（与 index.html 逻辑一致，全部数据）=======
        function renderBarChart(months, monthlyStats, year) {
            const container = document.getElementById('barChart');
            const chart = echarts.init(container);

            const monthLabels = months.map(m => parseInt(m.split('-')[1]) + '月');
            const newData = months.map(m => monthlyStats[m].new);
            const completedData = months.map(m => monthlyStats[m].completed);
            const pendingData = months.map(m => monthlyStats[m].pending);

            chart.setOption({
                title: {
                    text: `${year}年缺陷管理统计`,
                    left: 'center', top: 0,
                    textStyle: { fontSize: 18, fontWeight: 'bold', color: '#333' }
                },
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: {
                    data: ['新增', '消缺', '剩余'],
                    right: 10, top: 'middle', orient: 'vertical'
                },
                grid: { left: '3%', right: '120px', bottom: '5%', top: '10%', containLabel: true },
                xAxis: { type: 'category', data: monthLabels, axisLabel: { rotate: 0, fontSize: 12 } },
                yAxis: { type: 'value' },
                series: [
                    { name: '新增', type: 'bar', data: newData, itemStyle: { color: '#4472c4' }, label: { show: true, position: 'top', fontSize: 11, fontWeight: 'bold' } },
                    { name: '消缺', type: 'bar', data: completedData, itemStyle: { color: '#c5504b' }, label: { show: true, position: 'top', fontSize: 11, fontWeight: 'bold' } },
                    { name: '剩余', type: 'bar', data: pendingData, itemStyle: { color: '#70ad47' }, label: { show: true, position: 'top', fontSize: 11, fontWeight: 'bold' } }
                ]
            });

            // 底下月份表
            const tbl = document.getElementById('barChartTable');
            let html = '<table><thead><tr><th></th>';
            monthLabels.forEach(m => html += `<th>${m}</th>`);
            html += '</tr></thead><tbody>';
            html += '<tr><td><span class="legend-dot" style="background-color: #4472c4;"></span>新增</td>';
            newData.forEach(v => html += `<td>${v}</td>`);
            html += '</tr><tr><td><span class="legend-dot" style="background-color: #c5504b;"></span>消缺</td>';
            completedData.forEach(v => html += `<td>${v}</td>`);
            html += '</tr><tr><td><span class="legend-dot" style="background-color: #70ad47;"></span>剩余</td>';
            pendingData.forEach(v => html += `<td>${v}</td>`);
            html += '</tr></tbody></table>';
            tbl.innerHTML = html;

            window.addEventListener('resize', () => chart.resize());
        }

        // ======= 饼图（I类缺陷专业分布，与 index.html 口径完全一致）=======
        // 饼图底下表格：接收站 + 总计 + 各专业（MAJOR_PROFESSIONS + Excel额外）
        function renderPieChart(processedData, classIStats, baseDate) {
            const { professions, remainingStats, newStats, completedStats } = classIStats;
            const currentMonthKey = `${baseDate.getFullYear()}-${String(baseDate.getMonth() + 1).padStart(2, '0')}`;
            const daysInMonth = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 0).getDate();

            const pieData = professions
                .map(name => ({ name, value: remainingStats[name] || 0 }));

            const container = document.getElementById('pieChart');
            if (!container) return;

            if (pieData.every(d => d.value === 0)) {
                container.innerHTML = '<div style="text-align:center;padding-top:100px;color:#999;">暂无数据</div>';
            } else {
                const colors = ['#4472c4', '#c5504b', '#70ad47', '#ffc000', '#5b9bd5', '#ed7d31', '#a5a5a5', '#7030a0'];
                const chart = echarts.init(container);
                chart.setOption({
                    title: {
                        text: '接收站当前主要剩余I类缺陷专业分布情况',
                        left: 'center', top: 10,
                        textStyle: { fontSize: 16, fontWeight: 'bold', color: '#333' }
                    },
                    tooltip: { trigger: 'item', formatter: '{b}: {c}项 ({d}%)' },
                    legend: {
                        type: 'plain', orient: 'vertical', right: 15, top: 60,
                        columns: 1, itemWidth: 10, itemHeight: 8, itemGap: 8,
                        textStyle: { fontSize: 11 }, data: professions
                    },
                    series: [{
                        name: '待消缺专业分布',
                        type: 'pie',
                        radius: ['35%', '70%'],
                        center: ['50%', '55%'],
                        itemStyle: { borderRadius: 5, borderColor: '#fff', borderWidth: 2 },
                        label: { show: true, formatter: '{b}: {c}项', fontSize: 12 },
                        labelLine: { show: true, length: 15, length2: 20 },
                        data: pieData.map((item, index) => ({
                            ...item,
                            itemStyle: { color: colors[index % colors.length] }
                        }))
                    }]
                });
                window.addEventListener('resize', () => chart.resize());
            }

            // 饼图底下汇总表
            const totalRemaining = pieData.reduce((s, d) => s + d.value, 0);
            const totalNew = Object.values(newStats).reduce((s, v) => s + v, 0);
            const totalCompleted = Object.values(completedStats).reduce((s, v) => s + v, 0);

            const summaryEl = document.getElementById('pieChartSummary');
            summaryEl.innerHTML = `截至${currentMonthKey.split('-')[1]}月${daysInMonth}日，接收站I类缺陷剩余<span class="highlight">${totalRemaining}</span>项；${currentMonthKey.split('-')[1]}月新增${totalNew}项，消缺${totalCompleted}项。`;

            // 表格结构（与 index.html renderSummaryTable 一致）
            const totalRows = 1 + 3;  // 1行表头 + 3行数据
            const tbl = document.getElementById('pieChartTable');
            let html = '<div class="summary-table-wrap"><table class="summary-table">';
            html += '<tbody>';
            // 表头行
            html += '<tr class="st-header-row">';
            html += `<th class="st-col" rowspan="${totalRows}">接<br>收<br>站</th>`;
            html += '<th>I类缺陷</th>';
            html += '<th class="st-sub-total">总计</th>';
            professions.forEach(p => { html += `<th>${p}</th>`; });
            html += '</tr>';

            // 剩余
            html += '<tr>';
            html += '<td>剩余</td>';
            html += `<td class="st-total">${totalRemaining}</td>`;
            professions.forEach(p => { html += `<td>${remainingStats[p] || 0}</td>`; });
            html += '</tr>';

            // 本月新增
            html += '<tr>';
            html += '<td>本月新增</td>';
            html += `<td class="st-total">${totalNew}</td>`;
            professions.forEach(p => { html += `<td>${newStats[p] || 0}</td>`; });
            html += '</tr>';

            // 本月消项
            html += '<tr>';
            html += '<td>本月消项</td>';
            html += `<td class="st-total">${totalCompleted}</td>`;
            professions.forEach(p => { html += `<td>${completedStats[p] || 0}</td>`; });
            html += '</tr>';

            html += '</tbody></table></div>';
            tbl.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadReport);
    </script>
