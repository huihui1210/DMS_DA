                        {
                            type: 'ellipse', silent: true,
                            shape: { cx: cx + depth / 2, cy: baseY + 0.5, rx: half + depth + 3, ry: 2.4 },
                            style: { fill: 'rgba(2,9,20,.5)' }
                        },
                        {
                            type: 'polygon', silent: true,
                            shape: { points: [[x1, barTop], [x1 + depth, capTop], [x1 + depth, baseY - rise], [x1, baseY]] },
                            style: { fill: zero ? 'rgba(60,90,110,.22)' : style.side }
                        },
                        {
                            type: 'rect',
                            shape: { x: x0, y: barTop, width: half * 2, height: Math.max(baseY - barTop, 2), r: [2, 2, 0, 0] },
                            style: { fill: faceFill }
                        },
                        {
                            type: 'polygon', silent: true,
                            shape: { points: [[x0, barTop], [x0 + depth, capTop], [x1 + depth, capTop], [x1, barTop]] },
                            style: { fill: zero ? 'rgba(120,150,170,.28)' : style.cap }
                        },
                        {
                            type: 'ellipse', silent: true,
                            shape: { cx: cx + depth / 2, cy: barTop - rise / 2, rx: half + depth / 2 - 1.5, ry: 1.5 },
                            style: { fill: zero ? 'rgba(180,200,215,.2)' : 'rgba(255,255,255,.5)' }
                        }
                    ]
                };
            };
        }

        function renderTrend() {
            const chart = getChart('chartTrend');
            if (!chart) {
                showChartFallback('chartTrend', '图表组件加载失败');
                return;
            }
            const { monthlyStats, filteredMonths } = calculateMonthlyStats(state.rows);
            state.trendMonths = filteredMonths;
            const labels = filteredMonths.map(m => m.slice(5) + '月');
            const newData = filteredMonths.map(m => monthlyStats[m].new);
            const doneData = filteredMonths.map(m => monthlyStats[m].completed);
            const pendingData = filteredMonths.map(m => monthlyStats[m].pending);

            /* 「剩余」是主视觉：只在最新月份点上方标一个数值，其余数值交给 tooltip */
            const lastRemain = pendingData.length ? pendingData[pendingData.length - 1] : 0;
            const REMAIN_HERO = '#ff7b6d';
            /* 纵轴：按全部系列的最大值取 15 的整数倍，保证刻度均匀（0/15/30/45…）；
               并为最新月的点上方标签预留足够余量，避免被顶部裁切 */
            const dataMax = Math.max(0, ...newData, ...doneData, ...pendingData);
            let axisMax = dataMax > 0 ? Math.ceil(dataMax * 1.15 / 15) * 15 : 15;
            const labelHead = Math.max(1, Math.ceil(axisMax * 0.12));
            if (lastRemain + labelHead > axisMax) axisMax = Math.ceil((lastRemain + labelHead) / 15) * 15;
            const axisInterval = axisMax / 3;
            const remainLineGrad = new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                { offset: 0, color: '#ffd76a' },
                { offset: .5, color: '#ff9e6b' },
                { offset: 1, color: '#ff6f61' }
            ]);

            chart.setOption({
                tooltip: {
                    ...CHART_TOOLTIP,
                    trigger: 'axis',
                    axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(59,210,255,.10)' } },
                    formatter: function (items) {
                        if (!items || !items.length) return '';
                        const i = items[0].dataIndex;
                        const month = filteredMonths[i] || '';
                        const dot = c => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:6px;vertical-align:middle;"></span>`;
                        /* 剩余置顶并放大，环比放在 tooltip 里（不回到图面） */
                        const heroRow = (i) => {
                            const cur = pendingData[i];
                            const prev = i > 0 ? pendingData[i - 1] : null;
                            const d = prev === null ? null : cur - prev;
                            const dTxt = d === null ? '—' : (d === 0 ? '持平' : (d > 0 ? '▲' : '▼') + Math.abs(d));
                            return `<div style="display:flex;align-items:center;justify-content:space-between;gap:24px;line-height:1.85;">
                            <span style="color:#ffd0b5;font-weight:700;">${dot(REMAIN_HERO)}剩余</span>
                            <span style="display:flex;align-items:baseline;gap:6px;">
                                <b style="color:#ffeedd;font-family:var(--num-font);font-size:16px;font-weight:800;letter-spacing:.5px;">${cur}</b>
                                <em style="font-style:normal;font-size:10px;color:#c99a86;">${d === null ? '—' : dTxt + ' 环比'}</em>
                            </span></div>`;
                        };
                        const row = (name, color, v) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:24px;line-height:1.6;opacity:.86;"><span style="color:#9cc8e2;">${dot(color)}${name}</span><b style="color:#d3ecf9;font-family:var(--num-font);font-size:12px;">${v}</b></div>`;
                        return `<div style="font-size:11px;letter-spacing:1px;color:#86b3cc;margin-bottom:4px;">${month.slice(0, 4)}年${Number(month.slice(5))}月 · Ⅰ类</div>`
                            + heroRow(i)
                            + `<div style="height:1px;background:rgba(59,210,255,.18);margin:5px 0 4px;"></div>`
                            + row('新增', TREND_COL3D.新增.legend, newData[i])
                            + row('消缺', TREND_COL3D.消缺.legend, doneData[i]);
                    }
                },
                /* 图例与坐标轴退居次要层，避免与「剩余」抢注意力 */
                legend: {
                    top: 0,
                    right: 0,
                    itemWidth: 8,
                    itemHeight: 8,
                    itemGap: 10,
                    data: ['剩余', '新增', '消缺'],
                    textStyle: { color: '#6f9cb5', fontSize: 10 },
                    inactiveColor: '#41647a'
                },
                grid: { left: 30, right: 24, top: 24, bottom: 24 },
                xAxis: {
                    type: 'category',
                    data: labels,
                    axisLine: { lineStyle: { color: 'rgba(59,210,255,.16)' } },
                    axisTick: { show: false },
                    axisLabel: { color: '#6f9cb5', fontSize: 9, interval: 0, margin: 9 }
                },
                yAxis: {
                    type: 'value',
                    splitNumber: 3,
                    axisLine: { show: false },
                    axisTick: { show: false },
                    axisLabel: { color: '#5b87a0', fontSize: 9 },
                    splitLine: { lineStyle: { color: 'rgba(59,210,255,.06)' } },
                    max: axisMax,
                    interval: axisInterval
                },
                series: [
                    {
                        name: '新增',
                        type: 'custom',
                        data: newData.map((v, i) => [i, v]),
                        encode: { x: 0, y: 1 },
                        renderItem: trend3dBarItem(TREND_COL3D.新增),
                        z: 4,
                        itemStyle: { color: TREND_COL3D.新增.legend }
                    },
                    {
                        name: '消缺',
                        type: 'custom',
                        data: doneData.map((v, i) => [i, v]),
                        encode: { x: 0, y: 1 },
                        renderItem: trend3dBarItem(TREND_COL3D.消缺),
                        z: 4,
                        itemStyle: { color: TREND_COL3D.消缺.legend }
                    },
                    {
                        /* 折线描边层：深色宽线垫在彩色折线下，柱体上不会糊在一起 */
                        name: '剩余描边',
                        type: 'line',
                        data: pendingData,
                        smooth: true,
                        symbol: 'none',
                        silent: true,
                        z: 5,
                        tooltip: { show: false },
                        legendHoverLink: false,
                        lineStyle: { color: 'rgba(2,8,18,.92)', width: 7, opacity: .95 }
                    },
                    {
                        name: '剩余',
                        type: 'line',
                        data: pendingData,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 7,
                        z: 6,
                        lineStyle: {
                            color: remainLineGrad,
                            width: 3,
                            shadowColor: 'rgba(255,150,96,.6)',
                            shadowBlur: 12,
                            shadowOffsetY: 2
                        },
                        itemStyle: {
                            color: new echarts.graphic.RadialGradient(.5, .5, .7, [
                                { offset: 0, color: '#fff3cd' },
                                { offset: .55, color: '#ff9e6b' },
                                { offset: 1, color: '#ff6f61' }
                            ]),
                            borderColor: 'rgba(2,8,18,.92)',
                            borderWidth: 1.5,
                            shadowColor: 'rgba(255,150,96,.6)',
                            shadowBlur: 6
                        }
                    },
                    {
                        /* 只在最新月份的数据点正上方标一个数值：不占右侧留白，也不越出绘图区 */
                        name: '剩余数值',
                        type: 'scatter',
                        data: pendingData.map((v, i) => (i === pendingData.length - 1 ? v : null)),
                        symbolSize: 1,
                        itemStyle: { color: 'rgba(0,0,0,0)', borderWidth: 0 },
                        silent: true,
                        z: 8,
                        clip: false,
                        tooltip: { show: false },
                        legendHoverLink: false,
                        label: {
                            show: true,
                            position: 'top',
                            distance: 7,
                            formatter: p => String(p.value),
                            /* 文字渐变在 label 上不生效，改用暖金实色 + 珊瑚描边光，保持与折线同一色系 */
                            color: '#ffcf8d',
                            fontSize: 15,
                            fontWeight: 800,
                            fontFamily: 'Bahnschrift, Microsoft YaHei, sans-serif',
                            textBorderColor: 'rgba(2,8,18,.9)',
                            textBorderWidth: 2.5,
                            textShadowColor: 'rgba(255,120,90,.85)',
                            textShadowBlur: 8
                        }
                    }
                ]
            }, true);

            chart.off('click');
            chart.on('click', function (params) {
                const month = (state.trendMonths || [])[params.dataIndex];
                if (!month) return;
                // 主标题与区块名一致，月份 / 系列 / 等级放进副标题
                openModal('缺陷趋势', trendRows(month, params.seriesName),
                    `${month.slice(0, 4)}年${Number(month.slice(5))}月 · ${params.seriesName}缺陷 · Ⅰ类`);
            });
        }

        /* ================= 督办统计卡片（重新设计 · 参考图风格） ================= */
        function renderSuperviseStats() {
            const rows = state.rows;
            const now = new Date();
            const curY = now.getFullYear();
            const curM = now.getMonth();
            const lastMD = new Date(curY, curM - 1, 1);
            const lastY = lastMD.getFullYear();
            const lastM = lastMD.getMonth();

            // 是否督办 = 是（含已消缺 + 待消缺）
            const spRows = rows.filter(r => isFlag(r, '是否督办'));
            const total = spRows.length;
            const done = spRows.filter(r => r.status === '已消缺项').length;
            const remain = spRows.filter(r => r.status === '待消缺项目').length;
            const rate = total ? (done / total * 100) : 0;

            // 存量环比：当前累计 vs 上月末累计（同口径，不用本月/上月新增流量）
            const prevSnap = stockSnapshot(spRows, monthEndDate(lastY, lastM));
            const tTotal = stockTrend(total, prevSnap.total, '督办总数', { invert: true });
            const tRemain = stockTrend(remain, prevSnap.remain, '督办剩余', { invert: true });
            const tDone = stockTrend(done, prevSnap.done, '督办完成');
            // 累计督办完成率环比：主显示累计完成绝对增量，百分比与百分点为次要信息
            const rateTrend = rateDeltaView(spRows, curY, curM, lastY, lastM, rate, '累计督办完成率');

            // 生成最近 N 个月的督办数据（用于 sparkline）
            const MONTHS = 6;
            const months = [];
            for (let i = MONTHS - 1; i >= 0; i--) {
                const d = new Date(curY, curM - i, 1);
                months.push({ y: d.getFullYear(), m: d.getMonth() });
            }
            const slStock = months.map(m => (m.y === curY && m.m === curM)
                ? { total, done, remain }
                : stockSnapshot(spRows, monthEndDate(m.y, m.m)));
            const slTotal = slStock.map(s => s.total);
            const slDone = slStock.map(s => s.done);
            const slRemain = slStock.map(s => s.remain);
            const slRate = cumulativeRateSeries(spRows, months, curY, curM);

            const cards = [
                { key: 'total', cls: 'cyan', val: total, lbl: '督办总数', icon: '●', arrow: tTotal.arrow, pct: tTotal.pct, tone: tTotal.tone, tip: tTotal.tip || '较上月', title: tTotal.title, spark: slTotal, sparkW: 62, sparkH: 26 },
                { key: 'remain', cls: 'amber', val: remain, lbl: '督办剩余', icon: '◆', arrow: tRemain.arrow, pct: tRemain.pct, tone: tRemain.tone, tip: tRemain.tip || '较上月', title: tRemain.title, spark: slRemain, sparkW: 62, sparkH: 26 },
                { key: 'done', cls: 'green', val: done, lbl: '督办完成', icon: '✓', arrow: tDone.arrow, pct: tDone.pct, tone: tDone.tone, tip: tDone.tip || '较上月', title: tDone.title, spark: slDone, sparkW: 62, sparkH: 26 },
                { key: 'rate', cls: 'silver', val: total ? rate.toFixed(1) + '%' : '—', lbl: '累计督办完成率', icon: '%', arrow: rateTrend.arrow, pct: rateTrend.pct, tone: rateTrend.tone, tip: rateTrend.tip, title: rateTrend.title, spark: slRate, sparkW: 62, sparkH: 26 }
            ];

            const grid = document.getElementById('superviseGrid');
            grid.innerHTML = cards.map(kpiCardHTML).join('');

            // 点击卡片弹出对应明细：主标题沿用卡片标题，副标题补口径
            const SP_CARD_META = {
                total: ['督办总数', sp => sp, '督办标记 · 全部'],
                remain: ['督办剩余', sp => sp.filter(r => r.status === '待消缺项目'), '督办标记 · 待消缺'],
                done: ['督办完成', sp => sp.filter(r => r.status === '已消缺项'), '督办标记 · 已消缺'],
                rate: ['累计督办完成率', sp => sp, '完成率明细']
            };
            grid.querySelectorAll('.s-card').forEach(card => {
                card.addEventListener('click', () => {
                    const allSp = rows.filter(r => isFlag(r, '是否督办'));
                    const meta = SP_CARD_META[card.dataset.key];
                    if (!meta) return;
                    openModal(meta[0], meta[1](allSp), meta[2]);
                });
            });
        }

        /* ---- 专业分布：纯 SVG 立体饼环（挤出侧壁 + 底座椭圆投影 + 渐变顶面），零第三方依赖 ---- */
        /* 同源色板：青蓝主色系 + 金 / 银 / 铜，少量靛、青绿、钢蓝；顺序按「暖-冷」交替排列，
           保证相邻扇区色相拉开，超过 16 个专业时循环取色也不会与相邻项重合 */
        const PROF_SLICE_COLORS = [
            '#d8b174', '#4fc3e8', '#c58c66', '#48b3a9',
            '#f0c878', '#3f95cf', '#bccfe0', '#2fd6c4',
            '#5a7fc0', '#e0a45c', '#7fe0f2', '#7b78c8',
            '#9fb6c9', '#4a9db8', '#c99a6a', '#2a7fa8'
        ];

        function shadeHex(hex, p) {
            const num = parseInt(hex.slice(1), 16);
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            const to = p >= 0 ? 255 : 0;
            const k = Math.abs(p);
            const f = v => Math.round(v + (to - v) * k).toString(16).padStart(2, '0');
            return '#' + f(r) + f(g) + f(b);
        }

        function escHtml(v) {
            return String(v).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function openProfItem(idx) {
            const item = (state.profItems || [])[idx];
            if (!item) return;
            const rows = state.rows.filter(row => {
                if (!classIRemaining(row)) return false;
                const prof = getProfession(row);
                return item.members ? item.members.indexOf(prof) >= 0 : prof === item.prof;
            });
            // 主标题与区块名一致，专业与条数放进副标题
            openModal('专业分布', rows, `${item.disp} · Ⅰ类剩余 ${item.count} 条`);
        }

        // 底部读数：默认显示最大扇区，hover 扇区/图例时跟随切换
        function updateProfSpot(idx) {
            const items = state.profItems || [];
            const item = items[idx] || items[0];
            const spot = document.getElementById('profSpot');
            if (!spot || !item) return;
            const color = PROF_SLICE_COLORS[idx % PROF_SLICE_COLORS.length];
            const chip = spot.querySelector('i');
            if (chip) {
                chip.style.background = color;
                chip.style.boxShadow = `0 0 8px ${color}`;
            }
            const name = spot.querySelector('.ps-name');
            if (name) name.textContent = item.disp;
            const cnt = spot.querySelector('.ps-cnt b');
            if (cnt) cnt.textContent = item.count;
        }

        function renderProfChart() {
            const box = document.getElementById('chartProf');
            if (!box) return;

            const { remainingStats } = getClassIProfessionStats(state.rows);
            const all = Object.entries(remainingStats)
                .map(([prof, count]) => ({ prof, disp: displayProfession(prof), count }))
                .filter(item => item.count > 0)
                .sort((a, b) => b.count - a.count);
            const total = all.reduce((sum, item) => sum + item.count, 0);

            // 不再把尾部专业合并成「其他 N 类」：所有专业都作为独立扇区，
            // 取数与过滤口径沿用 getClassIProfessionStats，合计仍为全量。
            const items = all;
            state.profItems = items;
            state.profTotal = total;

            if (!items.length) {
                box.innerHTML = '<div class="prof-empty">暂无Ⅰ类剩余缺陷</div>';
                return;
            }

            // 画布坐标（viewBox 324×250，随容器等比缩放，不做固定像素假设）
            const CX = 162, CY = 112, RX = 112, RY = 72, IRX = 54, IRY = 34, DEP = 17;
            const rad = d => d * Math.PI / 180;
            const P = (x, y) => `${x.toFixed(1)} ${y.toFixed(1)}`;
            const outer = (a, dy) => P(CX + RX * Math.cos(rad(a)), CY - RY * Math.sin(rad(a)) + (dy || 0));
            const inner = (a, dy) => P(CX + IRX * Math.cos(rad(a)), CY - IRY * Math.sin(rad(a)) + (dy || 0));

            // 从 12 点开始顺时针排布（数学角递减），count 越大扇区越大
            let angle = 90;
            const slices = items.map((item, idx) => {
                const sweep = item.count / total * 360;
                const a1 = angle;
                const a2 = angle - sweep;
                angle = a2;
                return {
                    ...item,
                    idx,
                    a1,
                    a2,
                    sweep,
                    color: PROF_SLICE_COLORS[idx % PROF_SLICE_COLORS.length]
                };
            });

            const defs = [];
            const walls = [];
            const tops = [];
            const single = slices.length === 1;

            slices.forEach(s => {
                defs.push(`<linearGradient id="pfT${s.idx}" x1="0" y1="0" x2="1" y2="1">` +
                    `<stop offset="0" stop-color="${shadeHex(s.color, 0.34)}"/>` +
                    `<stop offset="42%" stop-color="${s.color}"/>` +
                    `<stop offset="100%" stop-color="${shadeHex(s.color, -0.24)}"/></linearGradient>`);
                defs.push(`<linearGradient id="pfW${s.idx}" x1="0" y1="0" x2="0" y2="1">` +
                    `<stop offset="0" stop-color="${shadeHex(s.color, -0.3)}"/>` +
                    `<stop offset="100%" stop-color="${shadeHex(s.color, -0.62)}"/></linearGradient>`);

                // 扇区内计数标注（太窄的扇区跳过，交给图例呈现）
                let label = '';
                if (s.sweep >= 18) {
                    const mid = rad((s.a1 + s.a2) / 2);
                    const lx = CX + RX * 0.74 * Math.cos(mid);
                    const ly = CY - RY * 0.74 * Math.sin(mid);
                    label = `<text class="pf-num" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central">${s.count}</text>`;
                }

                const aria = `${escHtml(s.disp)} 剩余 ${s.count} 条`;

                if (single) {
                    // 整圆：起止点重合，用两段 180° 圆弧闭合
                    walls.push(`<path d="M ${outer(90, 0)} A ${RX} ${RY} 0 0 1 ${outer(-90, 0)} A ${RX} ${RY} 0 0 1 ${outer(-270, 0)} ` +
                        `L ${outer(-270, DEP)} A ${RX} ${RY} 0 0 0 ${outer(-90, DEP)} A ${RX} ${RY} 0 0 0 ${outer(90, DEP)} ` +
                        `L ${outer(90, 0)} Z" fill="url(#pfW${s.idx})"/>`);
                    tops.push(`<g class="prof-slice" data-idx="${s.idx}" tabindex="0" role="button" aria-label="${aria}">` +
                        `<path d="M ${inner(90, 0)} L ${outer(90, 0)} A ${RX} ${RY} 0 0 1 ${outer(-90, 0)} A ${RX} ${RY} 0 0 1 ${outer(-270, 0)} ` +
                        `L ${inner(-270, 0)} A ${IRX} ${IRY} 0 0 0 ${inner(-90, 0)} A ${IRX} ${IRY} 0 0 0 ${inner(90, 0)} Z" ` +
                        `fill="url(#pfT${s.idx})" stroke="rgba(4,14,26,.5)" stroke-width="1"/>${label}</g>`);
                    return;
                }

                const large = s.sweep > 180 ? 1 : 0;
                // 侧壁：外弧顶 → 外弧底（下沉 DEP）→ 回程，先画壁后画顶，上半圈侧壁天然被顶面遮住
                walls.push(`<path d="M ${outer(s.a1, 0)} L ${outer(s.a1, DEP)} ` +
                    `A ${RX} ${RY} 0 ${large} 1 ${outer(s.a2, DEP)} L ${outer(s.a2, 0)} ` +
                    `A ${RX} ${RY} 0 ${large} 0 ${outer(s.a1, 0)} Z" fill="url(#pfW${s.idx})"/>`);
                tops.push(`<g class="prof-slice" data-idx="${s.idx}" tabindex="0" role="button" aria-label="${aria}">` +
                    `<path d="M ${inner(s.a1, 0)} L ${outer(s.a1, 0)} ` +
                    `A ${RX} ${RY} 0 ${large} 1 ${outer(s.a2, 0)} L ${inner(s.a2, 0)} ` +
                    `A ${IRX} ${IRY} 0 ${large} 0 ${inner(s.a1, 0)} Z" ` +
                    `fill="url(#pfT${s.idx})" stroke="rgba(4,14,26,.5)" stroke-width="1"/>${label}</g>`);
            });

            // 图例与「缺陷滚动清单」同款：斑马纹按全局第 N 行取奇偶，复制第二份时接缝不断纹
            const legRow = (s, alt) =>
                `<button type="button" class="prof-leg${alt ? ' alt' : ''}" data-idx="${s.idx}" title="${escHtml(s.disp)} · 剩余 ${s.count} 条">` +
                `<i style="background:${s.color};box-shadow:0 0 8px ${s.color}"></i>` +
                `<span class="pl-name">${escHtml(s.disp)}</span>` +
                `<span class="pl-cnt">${s.count}</span></button>`;
            const legend = slices.map((s, i) => legRow(s, i % 2 === 1)).join('');

            box.innerHTML = `
                <div class="prof-plot">
                    <svg class="prof-chart" viewBox="0 0 324 250" preserveAspectRatio="xMidYMid meet" role="img"
                        aria-label="Ⅰ类剩余缺陷专业分布，共 ${total} 条">
                        <defs>
                            <radialGradient id="pfShadow" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="rgba(0,0,0,.62)"/>
                                <stop offset="62%" stop-color="rgba(0,0,0,.3)"/>
                                <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
                            </radialGradient>
                            <linearGradient id="pfHubGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="#ffffff"/>
                                <stop offset="55%" stop-color="#a7ecff"/>
                                <stop offset="100%" stop-color="#3bd2ff"/>
                            </linearGradient>
                            ${defs.join('')}
                        </defs>
                        <ellipse class="pf-shadow" cx="${CX}" cy="192" rx="${RX + 8}" ry="30" fill="url(#pfShadow)"/>
                        <g>${walls.join('')}</g>
                        <g>${tops.join('')}</g>
                        <ellipse cx="${CX}" cy="${CY}" rx="${IRX}" ry="${IRY}" fill="none" stroke="rgba(59,210,255,.2)" stroke-width="1.5"/>
                        <text class="pf-hub-cap" x="${CX}" y="100" text-anchor="middle">剩余合计</text>
                        <text class="pf-hub-num" x="${CX}" y="136" text-anchor="middle">${total}<tspan class="pf-hub-unit" dx="3" dy="-3">条</tspan></text>
                    </svg>
                    <div class="prof-spot" id="profSpot" aria-hidden="true">
                        <i style="background:${slices[0].color};box-shadow:0 0 8px ${slices[0].color}"></i>
                        <span class="ps-name">${escHtml(slices[0].disp)}</span>
                        <span class="ps-cnt">剩余<b>${slices[0].count}</b>条</span>
                    </div>
                </div>
                <div class="prof-legend">
                    <div class="prof-legend-head"><span>专业</span><span>剩余</span></div>
                    <div class="prof-legend-body" id="profLegendBody">
                        <div class="prof-legend-track" id="profLegendTrack">${legend}</div>
                    </div>
                </div>`;

            // 图例超出可视高度才启动循环滚动；不足一屏保持静态，避免少量条目空转
            const legBody = document.getElementById('profLegendBody');
            const legTrack = document.getElementById('profLegendTrack');
            if (legBody && legTrack && legBody.clientHeight > 0 && legTrack.scrollHeight > legBody.clientHeight) {
                const oneCopy = legTrack.scrollHeight;
                // 第二份沿用原始索引（data-idx 不变），奇偶按全局行号续接，滚动接缝不跳纹
                const copy = slices.map((s, i) => legRow(s, (slices.length + i) % 2 === 1)).join('');
                legTrack.innerHTML = legend + copy;
                legTrack.classList.add('scroll-track');
                legTrack.style.animationName = 'scrollUp';
                legTrack.style.animationDuration = listScrollDuration(oneCopy);
            }
        }

        function renderBoardChart() {
            const period = state.period || 'month';
            const periodLabel = PERIOD_LABELS[period] || '本月';
            const items = getLeaderboard(state.rows, period).slice(0, 3);
            state.boardItems = items;
            const boardRate = getBoardRateStats(state.rows);

            const box = document.getElementById('boardList');
            if (!box) return;

            if (items.length === 0) {
                box.innerHTML = `<div class="board-empty">${periodLabel}暂无消缺记录</div>`;
                return;
            }

            // 领奖台：3 席 2-1-3；2 席 2-1；1 席居中，不留空柱台
            const podiumCls = items.length === 1 ? ' solo' : (items.length === 2 ? ' duo' : '');
            const order = items.length >= 3 ? [1, 0, 2] : (items.length === 2 ? [1, 0] : [0]);

            // 名次标识：冠军皇冠，亚军盾牌，季军奖牌（内联 SVG，单色金属线条）
            const EMBLEMS = {
                1: `<svg class="po-emblem" viewBox="0 0 22 16" fill="none" aria-hidden="true">
                        <path d="M3.4 12.6 L2 4.9 L7 8.3 L11 2 L15 8.3 L20 4.9 L18.6 12.6 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                        <path d="M3.2 14.2 H18.8" stroke="currentColor" stroke-width="1.1" opacity=".7"/>
                        <circle cx="2" cy="4.9" r="1" fill="currentColor"/>
                        <circle cx="20" cy="4.9" r="1" fill="currentColor"/>
                    </svg>`,
                2: `<svg class="po-emblem" viewBox="0 0 22 16" fill="none" aria-hidden="true">
                        <path d="M11 1.6 L19 4.2 V9.4 C19 12.8 15.7 14.3 11 15.2 C6.3 14.3 3 12.8 3 9.4 V4.2 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                        <path d="M7.8 6.4 L11 9.2 L14.2 6.4" stroke="currentColor" stroke-width="1" opacity=".85"/>
                    </svg>`,
                3: `<svg class="po-emblem" viewBox="0 0 22 16" fill="none" aria-hidden="true">
                        <circle cx="11" cy="6" r="4.1" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M11 3.7 L11.9 5.5 L13.8 6 L11.9 6.5 L11 8.3 L10.1 6.5 L8.2 6 L10.1 5.5 Z" fill="currentColor" opacity=".8"/>
                        <path d="M8.8 9.2 L7.6 15 L11 13.3 L14.4 15 L13.2 9.2" stroke="currentColor" stroke-width="1.1" opacity=".85"/>
                    </svg>`
            };

            const podiumSlot = (idx) => {
                const item = items[idx];
                const prof = displayProfession(item.prof);
                const rank = idx + 1;
                const rateHit = boardRate.hits[item.prof] || 0;
                const ratePct = boardRate.totalMonths ? Math.round(rateHit / boardRate.totalMonths * 100) : 0;
                const showRate = SHOW_BOARD_RATE && prof && prof !== '未分类';
                const rateShort = rateHit ? ratePct + '%' : '—';
                const plateText = showRate ? `上榜率 ${rateShort}` : `NO.${rank}`;
                const plateCls = showRate ? 'pb-plate rate' : 'pb-plate';
                const plateTitle = showRate
                    ? ` title="本年上榜 ${rateHit}/${boardRate.totalMonths} 期 · 上榜率 ${ratePct}%"`
                    : '';
                const plateShort = showRate ? ` data-short="${rateShort}"` : '';
                return `<div class="podium-item p${rank}" data-idx="${idx}"
                            title="${prof} · ${periodLabel}消缺 ${item.count} 条">
                            <div class="po-plaque">
                                <span class="po-name">${EMBLEMS[rank]}<span>${prof}</span></span>
                                <span class="po-count">${item.count}<em>条</em></span>
                                <i class="po-ribbon"></i>
                                ${rank === 1 ? '<i class="po-spark sp-a"></i><i class="po-spark sp-b"></i>' : ''}
                            </div>
                            <div class="podium-block">
                                <i class="pb-top"></i>
                                <i class="pb-front"></i>
                                <i class="pb-side"></i>
                                <i class="pb-floor"></i>
                                <span class="${plateCls}"${plateTitle}${plateShort}>${plateText}</span>
                                <span class="pb-medal"></span>
                                <span class="po-rank">${rank}</span>
                            </div>
                        </div>`;
            };

            box.innerHTML = `
                <div class="board-podium${podiumCls}">${order.map(podiumSlot).join('')}</div>
                <div class="board-foot"></div>
            `;

            // 柱台宽度不足时，把「上榜率 XX%」收敛为纯百分比，避免溢出或遮挡柱内名次
            requestAnimationFrame(() => {
                box.querySelectorAll('.pb-plate.rate').forEach(plate => {
                    const block = plate.parentElement;
                    if (!block) return;
                    const available = block.clientWidth - 18;
                    if (plate.scrollWidth > available && plate.dataset.short) {
                        plate.textContent = plate.dataset.short;
                    }
                });
            });
        }

        /* ================= 滚动清单 / 预警 / 督办 ================= */
        /* 两个滚动清单共用同一套滚动参数：按实测「一份内容高度」换算时长，速度统一 14.2px/s */
        const LIST_SCROLL_SPEED = 14.2;
        const LIST_SCROLL_MIN_DURATION = 18;

        function listScrollDuration(halfHeight) {
            const secs = Math.max(LIST_SCROLL_MIN_DURATION, Math.round(halfHeight / LIST_SCROLL_SPEED * 10) / 10);
            return secs.toFixed(1) + 's';
        }

        function listRowHTML(row) {
            const id = getId(row);
            return `<div class="list-row" data-id="${id || ''}">
                <span class="c-id">${id || '—'}</span>
                <span class="c-zone">${getZone(row)}</span>
                <span class="c-prof">${displayProfession(getProfession(row))}</span>
                <span class="c-desc">${getDesc(row)}</span>
            </div>`;
        }

        function renderList() {
            const viewport = document.getElementById('listViewport');
            const hint = document.getElementById('listHint');
            const pending = state.rows.filter(row => row.status === '待消缺项目');
            if (hint) hint.textContent = pending.length ? `待消缺 ${pending.length} 项` : '';

            if (pending.length === 0) {
                viewport.innerHTML = '<div class="empty-row">当前视图暂无待消缺缺陷</div>';
                return;
            }

            const sorted = pending.slice().sort((a, b) => {
                const da = getDateFromDefectId(getId(a));
                const db = getDateFromDefectId(getId(b));
                const ta = da ? da.getTime() : 0;
                const tb = db ? db.getTime() : 0;
                if (tb !== ta) return tb - ta;
                return getId(b).localeCompare(getId(a));
            }).slice(0, 40);

            const rowsHTML = sorted.map(listRowHTML).join('');
            const needScroll = sorted.length > 10;
            viewport.innerHTML = `<div class="scroll-track" id="scrollTrack" style="animation-name:${needScroll ? 'scrollUp' : 'none'};">${rowsHTML}${needScroll ? rowsHTML : ''}</div>`;
            if (!needScroll) return;
            const track = document.getElementById('scrollTrack');
            if (!track) return;
            // 位移距离是 -50%，即一份内容高度；按实测高度换算时长，与督办清单同速
            track.style.animationDuration = listScrollDuration(track.scrollHeight / 2);
        }

        function getAlertCandidates() {
            const pending = state.rows.filter(row => row.status === '待消缺项目');
            const flagged = pending.filter(row => isFlag(row, '是否督办'));
            return flagged.length ? flagged : pending;
        }

        function renderAlerts() {
            const candidates = getAlertCandidates();
            const textEl = document.getElementById('alertText');

            state.alertItems = candidates.slice(0, 12).map(row => {
                // 条目前缀改用所属专业，避免再出现作为标签的「督办」字样
                const profRaw = getProfession(row);
                const prof = displayProfession(profRaw) || profRaw || '—';
                const desc = getDesc(row, '未填写缺陷描述');
                return `【${prof}】${getId(row) || '无编号'} · ${getZone(row)} · ${desc}`;
            });

            if (!state.alertItems.length) {
                if (textEl) textEl.textContent = '当前视图暂无督办缺陷';
                return;
            }
            state.alertIndex = 0;
            if (textEl) textEl.textContent = state.alertItems[0];
        }

        function rotateAlert() {
            if (state.alertItems.length <= 1) return;
            const textEl = document.getElementById('alertText');
            if (!textEl) return;
            textEl.classList.add('swap');
            setTimeout(function () {
                state.alertIndex = (state.alertIndex + 1) % state.alertItems.length;
                textEl.textContent = state.alertItems[state.alertIndex];
                textEl.classList.remove('swap');
            }, 300);
        }

        function renderSuperviseList() {
            const viewport = document.getElementById('superviseViewport');
            const hint = document.getElementById('superviseHint');
            const pending = state.rows.filter(row => row.status === '待消缺项目');
            const supervised = pending.filter(row => isFlag(row, '是否督办'));
            if (hint) hint.textContent = `督办 ${supervised.length} 项`;

            const items = supervised.length ? supervised : pending;

            if (items.length === 0) {
                viewport.innerHTML = '<div class="sp-empty">当前视图暂无督办记录</div>';
                return;
            }

            const rowsHTML = items.map(row => {
                const supervised = isFlag(row, '是否督办');
                const profRaw = getProfession(row);
                const prof = displayProfession(profRaw) || profRaw || '—';
                const cls = supervised ? '' : ' normal';
                return `<div class="sp-item${cls}" data-id="${getId(row) || ''}">
                    <div class="sp-main">
                        <div class="sp-id">${getId(row) || '无编号'}</div>
                        <div class="sp-desc">${getDesc(row, '未填写缺陷描述')}</div>
                    </div>
                    <div class="sp-side"><b title="${escHtml(prof)}">${escHtml(prof)}</b>${getZone(row)}</div>
                </div>`;
            }).join('');

            // 先按单份渲染并实测高度：内容不足一屏时静态显示，避免少量条目高速空转
            viewport.innerHTML = `<div class="sp-list">${rowsHTML}</div>`;
            const track = viewport.querySelector('.sp-list');
            if (!track) return;
            const copyH = track.scrollHeight;
            if (copyH <= viewport.clientHeight) return;

            // 内容超出一屏：复制一份并按 -50%（正好一份高度）匀速平移，实现无缝循环
            track.innerHTML = rowsHTML + rowsHTML;
            track.classList.add('scroll-track');
            track.style.animationName = 'scrollUp';
            track.style.animationDuration = listScrollDuration(copyH);
        }

        /* ================= 卫星底图 + 点位 ================= */
        function buildMapBox(type) {
            const label = type === 'recv' ? '接收站' : '分输站';
            const box = document.createElement('div');
            box.className = 'map-box' + (mapEdit.active ? ' map-edit' : '');
            box.dataset.station = type;
            box.innerHTML = `
                <div class="map-viewport" data-map="${type}">
                    <div class="map-canvas">
                        <div class="map-scale-wrap">
                            <img data-map-img="${type}" alt="${label}卫星图" draggable="false">
                            <div class="marker-layer" id="markers${type === 'recv' ? 'Recv' : 'Fen'}"></div>
                        </div>
                    </div>
                </div>
                <div class="map-top">
                    <span class="map-name"><i></i>${label}</span>
                    <span class="map-stats">待消缺<b id="${type}Pending">0</b>Ⅰ类<b id="${type}ClassI">0</b></span>
                </div>
                <div class="map-foot"><span class="map-unplaced" id="${type}Unplaced"></span></div>`;
            const vp = box.querySelector('.map-viewport');
            bindMapInteractions(vp, type);
            applyMapTransform(vp, type);
            return box;
        }

        function renderMaps() {
            const grid = document.getElementById('mapGrid');
            const single = state.view !== 'all';
            grid.classList.toggle('single', single);
            grid.innerHTML = '';

            const track = document.createElement('div');
            track.className = 'map-track';
            track.id = 'mapTrack';
            grid.appendChild(track);
            const types = single ? [state.view] : ['recv', 'fen'];
            types.forEach(type => {
                track.appendChild(buildMapBox(type));
                renderMarkers(type);
            });

            const dotsBox = document.getElementById('mapDots');
            if (dotsBox) {
                dotsBox.innerHTML = single ? '' : ['recv', 'fen'].map(t =>
                    `<span class="map-dot${state.mapSlide === t ? ' on' : ''}" data-slide="${t}"><i></i>${t === 'recv' ? '接收站' : '分输站'}</span>`
                ).join('');
            }
            applySlide(false);

            // DOM 渲染完成后，给每种地图计算默认放大倍率 + 异步填充底图 src
            requestAnimationFrame(async () => {
                for (const type of ['recv', 'fen']) {
                    const box = track.querySelector(`.map-box[data-station="${type}"]`);
                    if (!box) continue;
                    // 异步填充底图
                    const img = box.querySelector('[data-map-img]');
                    if (img) {
                        const src = await getMapImgSrc(type);
                        if (src) {
                            img.src = src;
                            img.style.display = '';
                        } else {
                            // 没有底图时显示占位提示
                            img.style.display = 'none';
                            if (!img.nextElementSibling?.classList.contains('map-placeholder')) {
                                const ph = document.createElement('div');
                                ph.className = 'map-placeholder';
                                ph.innerHTML = `<b>未上传底图</b><span>点击右上角「底图」按钮上传卫星图</span>`;
                                img.after(ph);
                            }
                        }
                    }
                    const vp = box.querySelector('.map-viewport');
                    const defaultS = state.view === 'all' ? 1 : getMapDefaultScale(vp, type);
                    mapState[type].defaultS = defaultS;
                    // 关键：切换视图重建 DOM 后，必须无条件 applyMapTransform ——
                    // 原来的 canvas transform 方案不调用也能正常显示（默认 scale=1），
                    // 但现在 .map-scale-wrap 依赖显式 width/height，默认是 0 → 黑屏。
                    // 同时 defaultS 也需要每次按当前视图重算（all↔single 切换时值会变）。
                    if (mapState[type].s === 1 && mapState[type].x === 0 && mapState[type].y === 0) {
                        mapState[type].s = defaultS;
                    }
                    applyMapTransform(vp, type);
                }
            });

            ['recv', 'fen'].forEach(type => {
                let pending = 0;
                let classI = 0;
                state.allRows.forEach(row => {
                    if (getStationType(getId(row)) !== type) return;
                    if (row.status !== '待消缺项目') return;
                    pending++;
                    if (isClassIScopeRow(row)) classI++;
                });
                const pEl = document.getElementById(type + 'Pending');
                const cEl = document.getElementById(type + 'ClassI');
                if (pEl) pEl.textContent = pending;
                if (cEl) cEl.textContent = classI;
            });

            if (mapEdit.active) renderEditDrawer();
        }

        function applySlide(animate) {
            const track = document.getElementById('mapTrack');
            if (!track) return;
            if (animate === false) track.classList.add('no-anim');
            track.style.transform = (state.view === 'all' && state.mapSlide === 'fen') ? 'translateX(-50%)' : 'translateX(0)';
            document.querySelectorAll('.map-dot').forEach(d => d.classList.toggle('on', d.dataset.slide === state.mapSlide));
            if (animate === false) requestAnimationFrame(() => track.classList.remove('no-anim'));
        }

        function setSlide(type) {
            if (state.view !== 'all') return;
            state.mapSlide = type === 'fen' ? 'fen' : 'recv';
            applySlide(true);
        }

        function renderMarkers(type) {
            const container = document.getElementById(type === 'recv' ? 'markersRecv' : 'markersFen');
            if (!container) return;
            const zonePending = {};
            const zoneAll = {};
            state.allRows.forEach(row => {
                if (getStationType(getId(row)) !== type) return;
                const zone = getZone(row);
                zoneAll[zone] = true;
                if (row.status === '待消缺项目') zonePending[zone] = (zonePending[zone] || 0) + 1;
            });
            const spots = getMapSpots()[type];
            container.innerHTML = Object.keys(spots).filter(z => zoneAll[z]).map(z => {
                const count = zonePending[z] || 0;
                return `<div class="marker${count ? ' alert' : ''}" data-zone="${z}" style="left:${spots[z].x * 100}%;top:${spots[z].y * 100}%">
                    <i></i><span>${z}${count ? ' · ' + count : ''}</span>
                </div>`;
            }).join('');
            const unplaced = Object.keys(zoneAll).filter(z => !spots[z]).length;
            const el = document.getElementById(type + 'Unplaced');
            if (el) el.textContent = unplaced ? `${unplaced}个区域未定位` : '';
        }

        /* ---- 缩放 / 平移 ---- */
        /* 架构说明：
           平移用 canvas 的 transform: translate 实现（便宜且直观）；
           缩放用 .map-scale-wrap 的物理 width/height 实现——
           当 scale>1 时 wrap 真实变大，浏览器必须以原始高清像素重新绘制底图和 marker，
           彻底解决 transform:scale 仅视觉放大导致的模糊问题。
           几何等价：canvas.translate(x,y) + wrap(width=vpW*s,height=vpH*s) + wrap 中心对齐 canvas 中心
                     ≡ 原来的 canvas.translate(x,y) scale(s) + origin center center
           clampMap 的边界计算无需改动，因为两者的 wrap/canvas 中心位置和尺寸完全一致。 */
        function applyMapTransform(vp, type) {
            const st = mapState[type];
            const canvas = vp.querySelector('.map-canvas');
            const wrap = canvas.querySelector('.map-scale-wrap');
            // 平移：canvas transform 只做 translate
            canvas.style.transform = `translate(${st.x}px, ${st.y}px)`;
            // 缩放：wrap 物理尺寸直接放大 s 倍
            const scaleW = vp.clientWidth * st.s;
            const scaleH = vp.clientHeight * st.s;
            wrap.style.width = scaleW + 'px';
            wrap.style.height = scaleH + 'px';
        }

        function clampMap(vp, type) {
            const st = mapState[type];
            const w = vp.clientWidth;
            const h = vp.clientHeight;
            st.s = Math.min(5, Math.max(1, st.s));
            if (st.s <= 1) {
                st.x = 0;
                st.y = 0;
            } else {
                // transform-origin: center center, s>1 放大态:
                // 画布比视口大, 边缘必须在视口外(保证视口始终被覆盖, 不留空白)
                // 画布中心 = (w/2 + x, h/2 + y), 画布半宽 = w*s/2
                // 左边缘 ≤ 0 → w/2+x-w*s/2 ≤ 0 → x ≤ w*(s-1)/2  (上界,正数)
                // 右边缘 ≥ w → w/2+x+w*s/2 ≥ w → x ≥ w*(1-s)/2  (下界,负数)
                // 范围 x ∈ [w*(1-s)/2, w*(s-1)/2]
                const lowerX = w * (1 - st.s) / 2;
                const upperX = w * (st.s - 1) / 2;
                const lowerY = h * (1 - st.s) / 2;
                const upperY = h * (st.s - 1) / 2;
                st.x = Math.min(upperX, Math.max(lowerX, st.x));
                st.y = Math.min(upperY, Math.max(lowerY, st.y));
            }
        }

        function bindMapInteractions(vp, type) {
            // drag 使用模块级变量（visibilitychange 兜底需要访问）

            vp.addEventListener('wheel', function (e) {
                e.preventDefault();
                const rect = vp.getBoundingClientRect();
                const ks = rect.width / vp.offsetWidth || 1;
                const cx = (e.clientX - rect.left) / ks;
                const cy = (e.clientY - rect.top) / ks;
                const st = mapState[type];
                const ns = Math.min(5, Math.max(1, st.s * (e.deltaY < 0 ? 1.18 : 1 / 1.18)));
                st.x = cx - (cx - st.x) * (ns / st.s);
                st.y = cy - (cy - st.y) * (ns / st.s);
                st.s = ns;
                clampMap(vp, type);
                applyMapTransform(vp, type);
            }, { passive: false });

            vp.addEventListener('pointerdown', function (e) {
                e.preventDefault(); // 阻止浏览器原生图片拖拽/文本选择
                if (e.button !== 0) return;
                // 非编辑模式下点击 marker 不启动拖拽，让 click 事件正常冒泡
                if (!mapEdit.active && e.target.closest('.marker')) return;
                const marker = mapEdit.active ? e.target.closest('.marker') : null;
                drag = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, marker, spots: null, spot: null };
                if (marker) {
                    drag.spots = getMapSpots();
                    drag.spot = drag.spots[type][marker.dataset.zone] || null;
                }
                try { vp.setPointerCapture(e.pointerId); } catch (err) { }
                vp.classList.add('dragging');
            }, { passive: false });

            vp.addEventListener('pointermove', function (e) {
                if (!drag) return;
                const ks = vp.getBoundingClientRect().width / vp.offsetWidth || 1;
                const dx = (e.clientX - drag.lx) / ks;
                const dy = (e.clientY - drag.ly) / ks;
                drag.lx = e.clientX;
                drag.ly = e.clientY;
                if (Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) > 5) drag.moved = true;

                if (drag.marker && drag.spot) {
                    drag.spot.x = Math.min(1, Math.max(0, drag.spot.x + dx / vp.offsetWidth));
                    drag.spot.y = Math.min(1, Math.max(0, drag.spot.y + dy / vp.offsetHeight));
                    drag.marker.style.left = drag.spot.x * 100 + '%';
                    drag.marker.style.top = drag.spot.y * 100 + '%';
                    return;
                }

                const st = mapState[type];
                if (st.s > 1) {
                    st.x += dx;
                    st.y += dy;
                    clampMap(vp, type);
                    applyMapTransform(vp, type);
                } else if (state.view === 'all' && !mapEdit.active) {
                    // 未放大时：水平拖动切换两张底图
                    drag.slideDx = (drag.slideDx || 0) + dx;
                    const track = document.getElementById('mapTrack');
                    if (track) {
                        const base = state.mapSlide === 'fen' ? -50 : 0;
                        const pct = drag.slideDx / (vp.offsetWidth * 2) * 100;
                        track.classList.add('no-anim');
                        track.style.transform = `translateX(${Math.min(0, Math.max(-50, base + pct))}%)`;
                    }
                }
            });

            vp.addEventListener('pointerup', function (e) {
                vp.classList.remove('dragging');
                try { vp.releasePointerCapture(e.pointerId); } catch (err) { }
                if (!drag) return;
                if (drag.marker && drag.moved && drag.spots) saveMapSpots(drag.spots);
                if (!drag.marker && state.view === 'all' && !mapEdit.active && drag.slideDx) {
                    const track = document.getElementById('mapTrack');
                    if (track) track.classList.remove('no-anim');
                    if (drag.slideDx < -60) setSlide('fen');
                    else if (drag.slideDx > 60) setSlide('recv');
                    else applySlide(true);
                }
                if (drag.moved) {
                    mapSuppressClick = true;
                    setTimeout(() => { mapSuppressClick = false; }, 60);
                }
                drag = null;
            });

            // pointercancel: 切标签页、窗口失焦、触控笔离开、系统手势中断
            vp.addEventListener('pointercancel', function (e) {
                vp.classList.remove('dragging');
                try { vp.releasePointerCapture(e.pointerId); } catch (err) { }
                drag = null;
            });

            vp.closest('.map-box').addEventListener('click', function (e) {
                if (mapSuppressClick) return;
                if (!mapEdit.active || !mapEdit.pending || mapEdit.pending.type !== type) return;
                const rect = vp.querySelector('.map-canvas').getBoundingClientRect();
                const fx = (e.clientX - rect.left) / rect.width;
                const fy = (e.clientY - rect.top) / rect.height;
                if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
                const spots = getMapSpots();
                spots[type][mapEdit.pending.zone] = { x: +fx.toFixed(4), y: +fy.toFixed(4) };
                saveMapSpots(spots);
                mapEdit.pending = null;
                renderMaps();
                renderEditDrawer();
            });

            vp.addEventListener('dblclick', function () {
                const defaultS = mapState[type].defaultS || getMapDefaultScale(vp, type);
                mapState[type] = { s: defaultS, x: 0, y: 0, defaultS };
                applyMapTransform(vp, type);
            });
        }

        /* ---- 点位编辑抽屉 ---- */
        function renderEditDrawer() {
            const drawer = document.getElementById('editDrawer');
            if (!mapEdit.active) {
                drawer.classList.remove('show');
                drawer.innerHTML = '';
                return;
            }
            const spots = getMapSpots();
            const groups = [];
            ['recv', 'fen'].forEach(type => {
                if (state.view !== 'all' && state.view !== type) return;
                const label = type === 'recv' ? '接收站 · 所属岗位' : '分输站 · 站点';
                const zoneSet = {};
                state.allRows.forEach(row => {
                    if (getStationType(getId(row)) === type) zoneSet[getZone(row)] = true;
                });
                const zones = Object.keys(zoneSet).sort();
                const rowsHtml = zones.map(z => {
                    const placed = !!spots[type][z];
                    const placing = mapEdit.pending && mapEdit.pending.zone === z;
                    return `<div class="ez-row${placed ? ' placed' : ''}${placing ? ' placing' : ''}" data-type="${type}" data-zone="${z}">
                        <span class="ez-name">${z}</span>
                        <span class="ez-state">${placing ? '点击底图落点' : (placed ? '已定位' : '未定位')}</span>
                        ${placed ? `<button class="ez-clear" data-type="${type}" data-zone="${z}" title="清除位置">×</button>` : ''}
                    </div>`;
                }).join('');
                groups.push(`<div class="ez-group"><div class="ez-title">${label}</div>${rowsHtml || '<div class="ez-none">暂无数据</div>'}</div>`);
            });
            drawer.innerHTML = `<div class="ez-head"><b>点位编辑</b><span>点区域名称 → 在对应底图上点击落点；拖动点位可微调</span><button id="editDone">完成</button></div>${groups.join('')}`;
            drawer.classList.add('show');
        }

        function toggleMapEdit() {
            mapEdit.active = !mapEdit.active;
            mapEdit.pending = null;
            document.getElementById('mapEditBtn').classList.toggle('on', mapEdit.active);
            renderMaps();
            renderEditDrawer();
        }

        /* ---- 底图上传抽屉 ---- */
        let mapImgDrawerOpen = false;
        async function renderMapImgDrawer() {
            const drawer = document.getElementById('mapImgDrawer');
            if (!mapImgDrawerOpen) {
                drawer.classList.remove('show');
                drawer.innerHTML = '';
                return;
            }
            const cards = await Promise.all(['recv', 'fen'].map(async (type) => {
                const label = type === 'recv' ? '接收站' : '分输站';
                const record = await dbGet(type);
                const src = record ? await getMapImgSrc(type) : '';
                const size = record ? (record.size / 1024 / 1024).toFixed(1) : 0;
                return `<div class="ez-group">
                    <div class="ez-title">${label}</div>
                    <div class="mi-preview">
                        ${src ? `<img src="${src}" alt="${label}底图">` : '<span class="mi-fallback">未上传</span>'}
                    </div>
                    <div class="mi-row">
                        <label class="mi-btn">上传PNG/JPG<input type="file" accept="image/*" data-type="${type}" hidden></label>
                        ${record ? `<button class="mi-del" data-type="${type}">删除</button>` : '<span class="mi-state">—</span>'}
                    </div>
                    ${record ? `<div class="mi-state mi-custom">已上传 ${size}MB · ${record.note || '原图'}</div>` : '<div class="mi-state mi-empty">未上传底图</div>'}
                </div>`;
            }));
            drawer.innerHTML = `<div class="ez-head"><b>底图管理</b><span>存浏览器IndexedDB,无需git提交;支持原图30MB+,JPEG默认缩到4096px</span><button id="imgDone">完成</button></div>${cards.join('')}`;
            drawer.classList.add('show');
        }

        function toggleMapImgDrawer() {
            mapImgDrawerOpen = !mapImgDrawerOpen;
            if (mapImgDrawerOpen && mapEdit.active) toggleMapEdit();
            document.getElementById('mapImgBtn').classList.toggle('on', mapImgDrawerOpen);
            renderMapImgDrawer();
        }

        /* ================= 弹窗与交互 ================= */
        const MODAL_FILTER_KEYS = ['prof', 'status', 'level', 'sup', 'zone'];
        const modalState = {
            rows: [],
            meta: [],
            index: [],
            query: '',
            filters: {
                prof: new Set(), status: new Set(), level: new Set(),
                sup: new Set(), zone: new Set(), from: '', to: ''
            }
        };
        let modalSearchTimer = null;

        function pad2(n) {
            return String(n).padStart(2, '0');
        }

        function fmtDay(d) {
            return d ? `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}` : '';
        }

        /* 行元数据只算一次：筛选、搜索、渲染都复用它，避免每次按键重复取值 */
        function modalRowMeta(row) {
            const done = row.status === '已消缺项';
            const cd = done ? getCompleteDate(row) : null;
            const reg = getDateFromDefectId(getId(row));
            return {
                id: getId(row) || '',
                zone: getZone(row) || '',
                prof: displayProfession(getProfession(row)) || '未分类',
                level: String(getLevelRaw(row) || '').trim(),
                desc: getDesc(row) || '',
                done: done,
                cdText: fmtDay(cd),
                regText: fmtDay(reg),
                sup: isFlag(row, '是否督办') ? '督办' : '非督办'
            };
        }

        function modalSearchText(row, m) {
            return [
                m.id, m.zone, m.prof, m.level, m.desc,
                getFieldValue(row, '消缺人') || '',
                getFieldValue(row, '责任人') || '',
                getFieldValue(row, '缺陷责任人') || '',
                getFieldValue(row, '负责人') || '',
                m.done ? '已消缺' : '待消缺', m.sup
            ].join(' ').toLowerCase();
        }

        /* 转义后按匹配区间切分，命中片段用 mark 高亮 */
        function hl(raw, q) {
            const s = String(raw == null ? '' : raw);
            if (!q) return escHtml(s);
            const lower = s.toLowerCase();
            const ql = q.toLowerCase();
            let out = '';
            let i = 0;
            while (true) {
                const p = lower.indexOf(ql, i);
                if (p < 0) { out += escHtml(s.slice(i)); break; }
                out += escHtml(s.slice(i, p))
                    + '<mark class="m-hl">' + escHtml(s.slice(p, p + q.length)) + '</mark>';
                i = p + q.length;
            }
            return out;
        }

        function modalRowHtml(i, q) {
            const row = modalState.rows[i];
            const m = modalState.meta[i];
            const worker = getFieldValue(row, '消缺人') || '—';
            const cdText = m.done ? (m.cdText || '—') : '—';
            return `<div class="m-row">
                <span class="m-id" title="${escHtml(m.id)}">${hl(m.id || '—', q)}</span>
                <span title="${escHtml(m.zone)}">${hl(m.zone, q)}</span>
                <span title="${escHtml(m.prof)}">${hl(m.prof, q)}</span>
                <span title="${escHtml(m.level)}">${hl(m.level || '—', q)}</span>
                <span class="m-desc">${hl(m.desc, q)}</span>
                <span class="${m.done ? 'm-done' : 'm-pending'}">${m.done ? '已消缺' : '待消缺'}</span>
                <span title="${escHtml(worker)}">${hl(worker, q)}</span>
                <span>${hl(cdText, q)}</span>
            </div>`;
        }

        function renderModalRows() {
            const box = document.getElementById('modalRows');
            const q = modalState.query;
            const ql = q.toLowerCase();
            const f = modalState.filters;
            const keep = [];
            for (let i = 0; i < modalState.rows.length; i++) {
                const m = modalState.meta[i];
                if (ql && modalState.index[i].indexOf(ql) < 0) continue;
                if (f.prof.size && !f.prof.has(m.prof)) continue;
                if (f.status.size && !f.status.has(m.done ? '已消缺' : '待消缺')) continue;
                if (f.level.size && !f.level.has(m.level)) continue;
                if (f.sup.size && !f.sup.has(m.sup)) continue;
                if (f.zone.size && !f.zone.has(m.zone)) continue;
                if (f.from && (!m.regText || m.regText < f.from)) continue;
                if (f.to && (!m.regText || m.regText > f.to)) continue;
                keep.push(i);
            }
            if (keep.length) {
                box.innerHTML = keep.map(i => modalRowHtml(i, q)).join('');
            } else {
                box.innerHTML = '<div class="m-empty">没有符合条件的记录'
                    + '<span>试试清除搜索词，或点击「重置」还原筛选条件</span></div>';
            }
            document.getElementById('modalCount').innerHTML =
                `共 <b>${modalState.rows.length}</b> 条 / 当前 <b>${keep.length}</b> 条`;
        }

        function buildModalFilterPop() {
            const rows = modalState.rows;
            const meta = modalState.meta;
            const uniq = fn => Array.from(new Set(
                rows.map((r, i) => fn(r, meta[i]).trim()).filter(Boolean)
            )).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
            const groups = [
                ['prof', '专业', uniq((r, m) => m.prof)],
                ['status', '状态', ['待消缺', '已消缺'].filter(s => rows.some((r, i) => (meta[i].done ? '已消缺' : '待消缺') === s))],
                ['level', '分类定级', uniq((r, m) => m.level)],
                ['sup', '是否督办', ['督办', '非督办'].filter(s => rows.some((r, i) => meta[i].sup === s))],
                ['zone', '岗位 / 站场', uniq((r, m) => m.zone)]
            ];
            let html = groups.map(([key, title, vals]) => {
                if (!vals.length) return '';
                return `<div class="mtf-group"><div class="mtf-title">${title}</div><div class="mtf-opts">`
                    + vals.map(v => `<button type="button" class="mtf-opt" data-f="${key}" data-v="${escHtml(v)}">${escHtml(v)}</button>`).join('')
                    + '</div></div>';
            }).join('');
            html += `<div class="mtf-group"><div class="mtf-title">登记日期区间</div><div class="mtf-dates">
                    <input type="date" id="mtfFrom" value="${escHtml(modalState.filters.from)}">
                    <span>至</span>
                    <input type="date" id="mtfTo" value="${escHtml(modalState.filters.to)}">
                    <span>按缺陷编号中的登记日期</span>
                </div></div>`;
            html += `<div class="mtf-foot">
                    <button type="button" class="mt-btn" id="mtfReset">重置</button>
                    <button type="button" class="mt-btn" id="mtfDone">完成</button>
                </div>`;
            document.getElementById('modalFilterPop').innerHTML = html;
            document.getElementById('mtfFrom').addEventListener('change', function (e) {
                modalState.filters.from = e.target.value;
                updateModalFilterUI();
                renderModalRows();
            });
            document.getElementById('mtfTo').addEventListener('change', function (e) {
                modalState.filters.to = e.target.value;
                updateModalFilterUI();
                renderModalRows();
            });
            syncModalFilterChips();
        }

        function syncModalFilterChips() {
            document.querySelectorAll('#modalFilterPop .mtf-opt').forEach(btn => {
                const set = modalState.filters[btn.dataset.f];
                btn.classList.toggle('on', !!set && set.has(btn.dataset.v));
            });
        }

        function modalFilterCount() {
            let n = MODAL_FILTER_KEYS.reduce((acc, k) => acc + modalState.filters[k].size, 0);
            if (modalState.filters.from || modalState.filters.to) n += 1;
            return n;
        }

        function updateModalFilterUI() {
            const n = modalFilterCount();
            const badge = document.getElementById('modalFilterBadge');
            badge.textContent = n;
            badge.classList.toggle('show', n > 0);
            document.getElementById('modalFilterSum').textContent = n > 0 ? `已选 ${n} 个条件` : '';
            const open = document.getElementById('modalFilterPop').classList.contains('show');
            document.getElementById('modalFilterBtn').classList.toggle('active', open || n > 0);
            syncModalFilterChips();
        }

        function toggleModalFilterPop(force) {
            const pop = document.getElementById('modalFilterPop');
            const show = typeof force === 'boolean' ? force : !pop.classList.contains('show');
            pop.classList.toggle('show', show);
            updateModalFilterUI();
        }

        function resetModalFilters() {
            MODAL_FILTER_KEYS.forEach(k => modalState.filters[k].clear());
            modalState.filters.from = '';
            modalState.filters.to = '';
            const from = document.getElementById('mtfFrom');
            const to = document.getElementById('mtfTo');
            if (from) from.value = '';
            if (to) to.value = '';
            updateModalFilterUI();
            renderModalRows();
        }

        function openModal(title, rows, sub) {
            modalState.rows = rows.slice();
            modalState.meta = modalState.rows.map(modalRowMeta);
            modalState.index = modalState.rows.map((r, i) => modalSearchText(r, modalState.meta[i]));
            modalState.query = '';
            MODAL_FILTER_KEYS.forEach(k => modalState.filters[k].clear());
            modalState.filters.from = '';
            modalState.filters.to = '';
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalSub').textContent = sub || '';
            const search = document.getElementById('modalSearch');
            search.value = '';
            document.getElementById('modalSearchClear').classList.remove('show');
            toggleModalFilterPop(false);
            buildModalFilterPop();
            updateModalFilterUI();
            renderModalRows();
            document.getElementById('modalMask').classList.add('show');
        }

        function closeModal() {
            toggleModalFilterPop(false);
            document.getElementById('modalMask').classList.remove('show');
        }

        function openRowDetail(id, section) {
            const row = state.rows.find(r => getId(r) === id);
            if (row) openModal(section || '缺陷滚动清单', [row], `缺陷编号 ${id}`);
        }

        // 专业分布口径：与 getClassIProfessionStats 的剩余统计一致
        function classIRemaining(row) {
            if (row.status !== '待消缺项目') return false;
            const prof = getProfession(row);
            if (prof === '未分类' || prof.includes('土建') || prof.includes('消防')) return false;
            const levelRaw = getLevelRaw(row);
            if (isEmpty(levelRaw) || !isClassILevel(levelRaw)) return false;
            const mk = getMonthFromDefectId(getId(row));
            if (!mk) return false;
            const now = new Date();
            const cur = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            return mk <= cur;
        }

        // 趋势图口径：与 calculateMonthlyStats 的月度统计一致
        function trendRows(month, seriesName) {
            return state.rows.filter(row => {
                if (!isClassIScopeRow(row)) return false;
                if (seriesName === '新增') return getMonthFromDefectId(getId(row)) === month;
                if (seriesName === '消缺') return row.status === '已消缺项' && getCompleteMonth(row) === month;
                const mk = getMonthFromDefectId(getId(row));
                if (!mk || mk > month) return false;
                if (row.status === '已消缺项') {
                    const ck = getCompleteMonth(row);
                    if (!ck || ck <= month) return false;
                }
                return true;
            });
        }

        // 龙虎榜周期口径：与 getLeaderboard 一致
        function inSelectedPeriod(d, period) {
            if (!d) return false;
            const now = new Date();
            const dayDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            if (period === 'yesterday') {
                const ys = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                const ye = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                return dayDate >= ys && dayDate < ye;
            }
            if (period === 'week') {
                const day = now.getDay() || 7;
                return dayDate >= new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 1);
            }
            if (period === 'month') return dayDate >= new Date(now.getFullYear(), now.getMonth(), 1);
            return dayDate >= new Date(now.getFullYear(), 0, 1);
        }

        // 关键指标 12 项：弹窗主标题直接取卡片标题（KPI_GROUP_DEFS.lbl），保证与界面一致
        const KPI_TITLES = {};
        KPI_GROUPS.forEach(g => {
            (KPI_GROUP_DEFS[g] || []).forEach(def => { KPI_TITLES[def.key] = def.lbl; });
        });
        const KPI_SUBS = {
            remainI: 'Ⅰ类 · 待消缺', remainCivil: '土建类 · 待消缺', remainII: 'Ⅱ类 · 待消缺', remainFire: '消防类 · 待消缺',
            yesterdayNew: '登记日期 · 昨日', weekNew: '登记日期 · 本周', monthNew: '登记日期 · 本月', yearNew: '登记日期 · 今年',
            yesterdayDone: '消缺日期 · 昨日', weekDone: '消缺日期 · 本周', monthDone: '消缺日期 · 本月', yearDone: '消缺日期 · 今年'
        };

        const KPI_ACTIONS = Object.keys(KPI_TITLES).reduce((acc, key) => {
            acc[key] = [KPI_TITLES[key], rows => kpiRows(rows, key), KPI_SUBS[key] || ''];
            return acc;
        }, {});

        // 总览四卡：主标题取卡片标题（缺陷总数 / 剩余缺陷 / 完成缺陷 / 消缺率）
        Object.assign(KPI_ACTIONS, {
            total: ['缺陷总数', rows => rows, '全部缺陷记录'],
            pending: ['剩余缺陷', rows => rows.filter(r => r.status === '待消缺项目'), '当前待消缺'],
            completed: ['完成缺陷', rows => rows.filter(r => r.status === '已消缺项'), '已完成消缺'],
            rate: ['累计消缺率', rows => rows, '累计完成 / 累计总数']
        });

        /* ================= 事件 / 初始化 ================= */
        function bindEvents() {
            document.getElementById('seg').addEventListener('click', function (e) {
                const btn = e.target.closest('.seg-btn');
                if (btn) setView(btn.dataset.view, true);
            });

            document.getElementById('periodTabs').addEventListener('click', function (e) {
                const btn = e.target.closest('.pbtn');
                if (!btn) return;
                state.period = btn.dataset.period;
                document.querySelectorAll('#periodTabs .pbtn').forEach(b => {
                    b.classList.toggle('active', b === btn);
                });
                renderBoardChart();
            });

            document.getElementById('boardList').addEventListener('click', function (e) {
                const row = e.target.closest('.podium-item');
                if (!row) return;
                const item = (state.boardItems || [])[+row.dataset.idx];
                if (!item) return;
                const p = state.period || 'month';
                const rows = state.rows.filter(r =>
                    r.status === '已消缺项' && getProfession(r) === item.prof && inSelectedPeriod(getCompleteDate(r), p)
                );
                // 主标题与区块名一致，专业 / 周期 / 条数放进副标题
                openModal('消缺龙虎榜', rows,
                    `${displayProfession(item.prof)} · ${PERIOD_LABELS[p]} · 消缺 ${rows.length} 条`);
            });

            // ===== 专业分布（饼环）交互：扇区 / 图例共用一套高亮与弹清单逻辑 =====
            const profBox = document.getElementById('chartProf');
            profBox.addEventListener('click', function (e) {
                const node = e.target.closest('.prof-slice, .prof-leg');
                if (!node) return;
                openProfItem(+node.dataset.idx);
            });
            profBox.addEventListener('keydown', function (e) {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                const slice = e.target.closest('.prof-slice');
                if (!slice) return;
                e.preventDefault();
                openProfItem(+slice.dataset.idx);
            });
            profBox.addEventListener('mouseover', function (e) {
                const node = e.target.closest('.prof-slice, .prof-leg');
                if (!node) return;
                const idx = +node.dataset.idx;
                profBox.querySelectorAll('.prof-slice, .prof-leg').forEach(n => {
                    n.classList.toggle('hot', +n.dataset.idx === idx);
                });
                updateProfSpot(idx);
            });
            profBox.addEventListener('mouseleave', function () {
                profBox.querySelectorAll('.prof-slice.hot, .prof-leg.hot').forEach(n => n.classList.remove('hot'));
                updateProfSpot(0);
            });

            // ===== 全屏 =====
            document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
            ['fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
                document.addEventListener(evt, function () {
                    updateFsBtn();
                    syncLayoutSize();
                });
            });

            // ===== 弹窗交互 =====
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modalMask').addEventListener('click', function (e) {
                if (e.target === this) closeModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                // Esc 优先级：弹窗 → 点位编辑 → 全屏。
                // 全屏的 Esc 是浏览器原生行为（无法用 preventDefault 拦截），
                // 因此全屏态下按 Esc 会直接退出全屏，这里只保证前两级不会被全屏抢走。
                if (document.getElementById('modalMask').classList.contains('show')) {
                    closeModal();
                    return;
                }
                if (mapEdit.active) toggleMapEdit();
            });

            // ===== 弹窗工具栏：搜索（防抖）+ 字段筛选（事件委托） =====
            const modalSearch = document.getElementById('modalSearch');
            modalSearch.addEventListener('input', function () {
                const v = this.value;
                document.getElementById('modalSearchClear').classList.toggle('show', !!v.trim());
                clearTimeout(modalSearchTimer);
                modalSearchTimer = setTimeout(function () {
                    modalState.query = v.trim();
                    renderModalRows();
                }, 180);
            });
            document.getElementById('modalSearchClear').addEventListener('click', function () {
                modalSearch.value = '';
                this.classList.remove('show');
                modalState.query = '';
                renderModalRows();
                modalSearch.focus();
            });
            document.getElementById('modalFilterBtn').addEventListener('click', function (e) {
                e.stopPropagation();
                toggleModalFilterPop();
            });
            document.getElementById('modalFilterPop').addEventListener('click', function (e) {
                const chip = e.target.closest('.mtf-opt');
                if (chip) {
                    const set = modalState.filters[chip.dataset.f];
                    const v = chip.dataset.v;
                    if (set.has(v)) set.delete(v); else set.add(v);
                    updateModalFilterUI();
                    renderModalRows();
                    return;
                }
                if (e.target.closest('#mtfReset')) {
                    resetModalFilters();
                    return;
                }
                if (e.target.closest('#mtfDone')) toggleModalFilterPop(false);
            });
            document.getElementById('modalFilterReset').addEventListener('click', resetModalFilters);
            document.addEventListener('click', function (e) {
                if (!e.target.closest('#modalFilterWrap')) toggleModalFilterPop(false);
            });

            document.getElementById('kpiTabs').addEventListener('click', function (e) {
                const btn = e.target.closest('.pbtn');
                if (!btn || KPI_GROUPS.indexOf(btn.dataset.group) < 0) return;
                state.kpiGroup = btn.dataset.group;
                document.querySelectorAll('#kpiTabs .pbtn').forEach(b => {
                    b.classList.toggle('active', b === btn);
                });
                renderKPI();
            });

            document.getElementById('kpiGrid').addEventListener('click', function (e) {
                const card = e.target.closest('.s-card');
                if (!card || !card.dataset.key) return;
                const action = KPI_ACTIONS[card.dataset.key];
                if (action) openModal(action[0], action[1](state.rows), action[2]);
            });

            document.getElementById('listViewport').addEventListener('click', function (e) {
                const row = e.target.closest('.list-row');
                if (row && row.dataset.id) openRowDetail(row.dataset.id, '缺陷滚动清单');
            });

            document.getElementById('superviseViewport').addEventListener('click', function (e) {
                const item = e.target.closest('.sp-item');
                if (item && item.dataset.id) openRowDetail(item.dataset.id, '督办滚动清单');
            });

            document.getElementById('alertBar').addEventListener('click', function () {
                openModal('督办预警', getAlertCandidates(), '督办 · 当前视图');
            });

            document.getElementById('mapDots').addEventListener('click', function (e) {
                const dot = e.target.closest('.map-dot');
                if (dot) setSlide(dot.dataset.slide);
            });

            document.getElementById('mapGrid').addEventListener('click', function (e) {
                if (mapEdit.active || mapSuppressClick) return;
                const marker = e.target.closest('.marker');
                if (!marker || !marker.dataset.zone) return;
                const box = marker.closest('.map-box');
                const type = box ? box.dataset.station : null;
                const label = type === 'recv' ? '接收站' : (type === 'fen' ? '分输站' : '');
                const rows = state.allRows.filter(r =>
                    r.status === '待消缺项目' &&
                    getZone(r) === marker.dataset.zone &&
                    (!type || getStationType(getId(r)) === type)
                );
                // 主标题沿用「厂区分布」面板标题（随视图变化），站点 / 岗位放进副标题
                openModal(MAP_TITLES[state.view] || MAP_TITLES.all, rows,
                    `${label} · ${marker.dataset.zone} · 待消缺`);
            });

            document.getElementById('mapEditBtn').addEventListener('click', toggleMapEdit);
            document.getElementById('mapImgBtn').addEventListener('click', toggleMapImgDrawer);

            document.getElementById('mapImgDrawer').addEventListener('click', function (e) {
                if (e.target.id === 'imgDone') {
                    toggleMapImgDrawer();
                    return;
                }
                const del = e.target.closest('.mi-del');
                if (del) {
                    removeMapImg(del.dataset.type);
                    renderMaps();
                    renderMapImgDrawer();
                    return;
                }
            });

            document.getElementById('mapImgDrawer').addEventListener('change', async function (e) {
                const input = e.target.closest('input[type="file"]');
                if (!input || !input.files.length) return;
                const type = input.dataset.type;
                const file = input.files[0];
                input.value = '';
                const res = await uploadMapImg(type, file);
                if (!res.ok) {
                    alert(res.msg);
                    return;
                }
                renderMaps();
                renderMapImgDrawer();
            });

            document.getElementById('editDrawer').addEventListener('click', function (e) {
                if (e.target.id === 'editDone') {
                    toggleMapEdit();
                    return;
                }
                const clear = e.target.closest('.ez-clear');
                if (clear) {
                    const spots = getMapSpots();
                    delete spots[clear.dataset.type][clear.dataset.zone];
                    saveMapSpots(spots);
                    renderMaps();
                    renderEditDrawer();
                    return;
                }
                const row = e.target.closest('.ez-row');
                if (row) {
                    mapEdit.pending = { type: row.dataset.type, zone: row.dataset.zone };
                    renderEditDrawer();
                }
            });

            window.addEventListener('hashchange', function () {
                setView(parseHashView(), false);
            });

            window.addEventListener('resize', fitStage);
        }

        function init() {
            fitStage();
            bindEvents();
            updateFsBtn();
            startClock();
            loadData();
            startAutoSync();
            initDebugPanel();
            setView(parseHashView(), false);
            setInterval(rotateAlert, 4000);
        }

        init();
    </script>
</body>

</html>
