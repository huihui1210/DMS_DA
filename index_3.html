        /* ===== 弹窗工具栏：搜索 + 字段筛选（沿用全局按钮/输入框令牌） ===== */
        .modal-tools {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-bottom: 1px solid var(--head-line);
            background: rgba(4, 16, 32, 0.5);
        }

        .mt-search {
            flex: 0 0 360px;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 8px;
            background: rgba(8, 30, 58, 0.78);
            border: 1px solid var(--btn-line);
            border-radius: var(--radius-btn);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .mt-search:focus-within {
            border-color: var(--btn-line-hover);
            box-shadow: 0 0 0 1px rgba(59, 210, 255, 0.16), 0 0 12px rgba(59, 210, 255, 0.16);
        }

        .mt-icon {
            font-size: 13px;
            color: var(--text-4);
            flex-shrink: 0;
        }

        .mt-search input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0;
            background: transparent;
            border: 0;
            outline: none;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--text-1);
        }

        .mt-search input::placeholder {
            color: var(--text-4);
            letter-spacing: 0.5px;
        }

        .mt-clear {
            display: none;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            padding: 0;
            font-size: 12px;
            line-height: 1;
            color: var(--text-2);
            background: rgba(59, 210, 255, 0.12);
            border: 1px solid var(--btn-line);
            border-radius: 50%;
            cursor: pointer;
        }

        .mt-clear.show {
            display: block;
        }

        .mt-clear:hover {
            color: var(--text-1);
            background: var(--btn-bg-hover);
        }

        .mt-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 10px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--text-2);
            background: var(--btn-bg);
            border: 1px solid var(--btn-line);
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mt-btn:hover {
            color: var(--text-1);
            background: var(--btn-bg-hover);
            border-color: var(--btn-line-hover);
        }

        .mt-btn.active {
            color: #03121e;
            font-weight: 700;
            background: var(--btn-active);
            border-color: var(--cyan);
        }

        .mt-badge {
            display: none;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #03121e;
            background: var(--cyan);
            border-radius: var(--radius-chip);
        }

        .mt-badge.show {
            display: inline-flex;
        }

        .mt-sum {
            font-size: 11.5px;
            letter-spacing: 1px;
            color: var(--text-3);
            white-space: nowrap;
        }

        .mt-filter {
            position: relative;
            flex-shrink: 0;
        }

        .mt-pop {
            display: none;
            position: absolute;
            top: 38px;
            right: 0;
            z-index: 8;
            width: 660px;
            max-height: 430px;
            overflow-y: auto;
            padding: 10px 12px 8px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-line);
            border-radius: var(--radius-panel);
            box-shadow: 0 14px 44px rgba(2, 8, 16, 0.65);
        }

        .mt-pop.show {
            display: block;
        }

        .mtf-group {
            margin-bottom: 10px;
        }

        .mtf-title {
            margin-bottom: 6px;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-3);
        }

        .mtf-opts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .mtf-opt {
            padding: 3px 9px;
            font-family: inherit;
            font-size: 11.5px;
            color: var(--text-2);
            background: var(--btn-bg);
            border: 1px solid var(--btn-line);
            border-radius: var(--radius-chip);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mtf-opt:hover {
            color: var(--text-1);
            background: var(--btn-bg-hover);
            border-color: var(--btn-line-hover);
        }

        .mtf-opt.on {
            color: #03121e;
            font-weight: 700;
            background: var(--btn-active);
            border-color: var(--cyan);
        }

        .mtf-dates {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mtf-dates input {
            height: 28px;
            padding: 0 8px;
            background: rgba(8, 30, 58, 0.78);
            border: 1px solid var(--btn-line);
            border-radius: var(--radius-btn);
            color: var(--text-1);
            font-family: inherit;
            font-size: 11.5px;
            color-scheme: dark;
        }

        .mtf-dates input:focus {
            outline: none;
            border-color: var(--btn-line-hover);
        }

        .mtf-dates span {
            font-size: 11px;
            color: var(--text-4);
        }

        .mtf-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--head-line);
        }

        .mtf-foot .mt-btn {
            height: 26px;
            font-size: 11.5px;
        }

        .m-hl {
            padding: 0 1px;
            color: #fff1cf;
            background: rgba(255, 198, 88, 0.26);
            border-radius: 2px;
        }

        .modal-body::-webkit-scrollbar {
            width: 4px;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(59, 210, 255, 0.3);
        }

        .m-row {
            display: grid;
            grid-template-columns: 160px 116px 76px 62px minmax(0, 1fr) 70px 72px 100px;
            gap: 10px;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px dashed rgba(59, 210, 255, 0.08);
            font-size: 12.5px;
            color: #cfe6f2;
        }

        .m-row.m-head {
            position: sticky;
            top: -6px;
            z-index: 1;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--text-2);
            background: #071526;
            border-bottom: 1px solid rgba(59, 210, 255, 0.22);
        }

        .m-row span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .m-row .m-desc {
            white-space: normal;
            line-height: 1.5;
        }

        .m-id {
            font-family: var(--num-font);
            color: #9fd8ee;
        }

        .m-done {
            color: #3ddc97;
        }

        .m-pending {
            color: #ffc658;
        }

        .m-empty {
            padding: 40px 0;
            text-align: center;
            color: #6d97b4;
            font-size: 13px;
            letter-spacing: 2px;
        }

        .m-empty span {
            display: block;
            margin-top: 7px;
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--text-4);
        }

        /* ================= 点位编辑 ================= */
        .map-box.map-edit .map-viewport {
            cursor: crosshair;
        }

        .map-unplaced {
            color: var(--amber);
        }

        .edit-drawer {
            position: absolute;
            top: 82px;
            right: 12px;
            bottom: 12px;
            z-index: 55;
            width: 264px;
            display: none;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--panel-line);
            border-radius: var(--radius-panel);
            overflow-y: auto;
        }

        .edit-drawer.show {
            display: flex;
        }

        .edit-drawer::-webkit-scrollbar {
            width: 4px;
        }

        .edit-drawer::-webkit-scrollbar-thumb {
            background: rgba(59, 210, 255, 0.3);
        }

        .ez-head {
            flex: 0 0 auto;
            padding: 10px 12px;
            border-bottom: 1px solid var(--head-line);
        }

        .ez-head b {
            display: block;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--text-1);
        }

        .ez-head span {
            display: block;
            margin: 4px 0 8px;
            font-size: 10.5px;
            color: var(--text-3);
        }

        .ez-head button {
            width: 100%;
            padding: 5px;
            font-family: inherit;
            font-weight: 700;
            color: #03121e;
            background: var(--btn-active);
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
        }

        .ez-group {
            padding: 8px 12px;
        }

        .ez-title {
            margin-bottom: 6px;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--text-2);
        }

        .ez-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
            padding: 5px 8px;
            font-size: 12px;
            color: #cfe6f2;
            border: 1px solid var(--card-line);
            border-radius: var(--radius-btn);
            cursor: pointer;
        }

        .ez-row:hover {
            border-color: rgba(59, 210, 255, 0.45);
        }

        .ez-row.placed .ez-state {
            color: var(--green);
        }

        .ez-row.placing {
            border-color: var(--amber);
            background: rgba(255, 198, 88, 0.08);
        }

        .ez-row.placing .ez-state {
            color: var(--amber);
        }

        .ez-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ez-state {
            font-size: 10.5px;
            color: var(--muted);
        }

        .ez-clear {
            width: 18px;
            height: 18px;
            font-size: 12px;
            line-height: 1;
            color: #ff8a94;
            background: none;
            border: 1px solid rgba(255, 95, 109, 0.4);
            border-radius: 2px;
            cursor: pointer;
        }

        .ez-none {
            padding: 4px 0;
            font-size: 11px;
            color: var(--muted);
        }

        /* ---- 底图上传抽屉 ---- */
        .mi-preview {
            width: 100%;
            height: 90px;
            margin: 6px 0 8px;
            border-radius: 3px;
            overflow: hidden;
            background: #061428;
            border: 1px solid rgba(59, 210, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mi-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mi-fallback {
            font-size: 11px;
            color: var(--muted);
        }

        .mi-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mi-btn {
            flex: 0 0 auto;
            padding: 4px 10px;
            font-family: inherit;
            font-size: 12px;
            color: var(--text-2);
            background: var(--btn-bg);
            border: 1px solid var(--btn-line);
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: all 0.15s;
        }

        .mi-btn:hover {
            color: var(--text-1);
            background: var(--btn-bg-hover);
            border-color: var(--btn-line-hover);
        }

        .mi-del {
            flex: 0 0 auto;
            padding: 4px 10px;
            font-size: 12px;
            color: #ffb4b4;
            background: rgba(255, 95, 109, 0.1);
            border: 1px solid rgba(255, 95, 109, 0.35);
            border-radius: var(--radius-btn);
            cursor: pointer;
        }

        .mi-del:hover {
            background: rgba(255, 95, 109, 0.2);
        }

        .mi-state {
            font-size: 11px;
            color: var(--muted);
        }

        .mi-state.mi-custom {
            color: #8feaff;
            margin-top: 4px;
        }

        .sys-link.as-btn {
            font-family: inherit;
            background: none;
            cursor: pointer;
        }

        .sys-link.as-btn.on {
            font-weight: 700;
            color: #03121e;
            background: linear-gradient(180deg, #8feaff, #3bd2ff);
        }

        @media (max-width: 1440px) {
            #stage {
                padding: 8px 10px 12px;
            }

            .brand h1 {
                font-size: 32px;
                letter-spacing: 4px;
            }

            .title-row::before,
            .title-row::after {
                width: 70px;
            }

            .pbtn {
                padding: 3px 7px;
                font-size: 10.5px;
            }
        }

        @media (max-width: 1200px) {
            .layout {
                grid-template-columns: minmax(0, 380px) minmax(0, 1fr) minmax(0, 380px);
                gap: 8px;
            }

            .brand h1 {
                font-size: 26px;
                letter-spacing: 2px;
            }

            .board-panel .panel-head {
                flex-wrap: wrap;
                row-gap: 4px;
                flex: 0 0 auto;
                padding: 8px 0;
            }

            .title-row::before,
            .title-row::after {
                display: none;
            }

            .clock b {
                font-size: 20px;
            }

            .list-head,
            .list-row {
                grid-template-columns: 150px 100px 80px minmax(0, 1fr);
            }
        }
    </style>
</head>

<body data-view="all">
    <div id="stage">
        <!-- ===== Header ===== -->

                <button class="sys-link as-btn" id="dbgBtn" type="button" title="数据核对（?debug=1 默认展开）">数据核对</button>

                        aria-hidden="true">
                        <path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4" />
                    </svg>
                    <svg class="fs-out" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
                        aria-hidden="true">
                        <path d="M2 6h4V2M14 6h-4V2M2 10h4v4M14 10h-4v4" />
                    </svg>
                </button>
                <a class="sys-link" href="index_1.html">福建LNG</a>

                <button id="dbgExportDiff" type="button">导出缺失行 JSON</button>

                    </div>
                    <button class="mt-btn" id="modalFilterReset">重置</button>
                    <span class="mt-sum" id="modalFilterSum"></span>
                </div>
                <div class="modal-body">
                    <div class="m-row m-head">
                        <span>缺陷编号</span>
                        <span>岗位/站场</span>
                        <span>专业</span>
                        <span>定级</span>
                        <span>缺陷描述</span>
                        <span>状态</span>
                        <span>消缺人</span>
                        <span>完成日期</span>
                    </div>
                    <div id="modalRows"></div>
                </div>
            </div>
        </div>

        <div id="emptyState">
            <h3>暂无缺陷数据</h3>
            <p>请先在接收站 / 分输站页面同步数据，看板会自动刷新。</p>
            <p><a class="sys-link" href="index_1.html">前往福建LNG总系统</a></p>
        </div>
    </div>

    <script>
        /* ================= 常量 ================= */
        const STORAGE_KEY = 'defectData_all';
        const VER_KEY = 'defectData_all_ver';
        const MAJOR_PROFESSIONS = ['机械', '电气', '仪表', '信息化', '防腐', '工程', '分析', '管道抢修', '后勤', '安全', '接收站运行部', '管道运行部'];
        const PROFESSION_DISPLAY_NAMES = {
            '安全': 'QHSE部',
            '后勤': '综合管理部'
        };
        const PERIOD_LABELS = { yesterday: '昨日', week: '本周', month: '本月', year: '今年' };
        // 厂区分布面板标题（随视图切换），弹窗主标题也复用它
        const MAP_TITLES = { all: '厂区分布（全站）', recv: '接收站分布', fen: '分输站分布' };

        /* ================= 点位存储（localStorage 持久化，由点位编辑模式写入） ================= */
        function getMapSpots() {
            try {
                const data = JSON.parse(localStorage.getItem('defectMapSpots_v1'));
                if (data && typeof data === 'object') return { recv: data.recv || {}, fen: data.fen || {} };
            } catch (e) { }
            return { recv: {}, fen: {} };
        }

        function saveMapSpots(spots) {
            localStorage.setItem('defectMapSpots_v1', JSON.stringify(spots));
        }

        /* ================= 底图上传（IndexedDB 持久化，支持原图，无需 git） ================= */
        const DB_NAME = 'defectDB';
        const DB_STORE = 'mapImgs';
        const DB_VER = 1;
        let _dbPromise = null;

        function openDB() {
            if (_dbPromise) return _dbPromise;
            _dbPromise = new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VER);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(DB_STORE)) {
                        db.createObjectStore(DB_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return _dbPromise;
        }

        async function dbGet(type) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_STORE, 'readonly');
                const req = tx.objectStore(DB_STORE).get(type);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        }

        async function dbPut(type, record) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.objectStore(DB_STORE).put(record, type);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(req.error);
            });
        }

        async function dbDelete(type) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.objectStore(DB_STORE).delete(type);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(req.error);
            });
        }

        // 缓存 blob URL，避免重复 createObjectURL
        const _imgUrlCache = { recv: null, fen: null };

        async function getMapImgSrc(type) {
            try {
                const rec = await dbGet(type);
                if (rec && rec.blob) {
                    if (!_imgUrlCache[type]) _imgUrlCache[type] = URL.createObjectURL(rec.blob);
                    return _imgUrlCache[type];
                }
            } catch (e) { }
            // 兜底：git 移除底图后会显示占位
            return '';
        }

        async function hasMapImg(type) {
            try { return !!(await dbGet(type)); } catch (e) { return false; }
        }

        async function removeMapImg(type) {
            await dbDelete(type);
            if (_imgUrlCache[type]) {
                URL.revokeObjectURL(_imgUrlCache[type]);
                _imgUrlCache[type] = null;
            }
        }

        async function uploadMapImg(type, file) {
            try {
                await dbPut(type, {
                    blob: file,
                    name: file.name,
                    size: file.size,
                    uploadedAt: Date.now(),
                    note: '原图'
                });
                if (_imgUrlCache[type]) {
                    URL.revokeObjectURL(_imgUrlCache[type]);
                    _imgUrlCache[type] = null;
                }
                return { ok: true, size: file.size };
            } catch (e) {
                return { ok: false, msg: e.message || '上传失败' };
            }
        }

        const MAP_IMG_SIZE = { recv: [8192, 5080], fen: [9620, 3605] };

        // 计算默认放大倍率（cover/contain 比值）：在 contain 完整显示基础上再放大到 cover 填满容器
        function getMapDefaultScale(vp, type) {
            if (!vp) return 1;
            const [iw, ih] = MAP_IMG_SIZE[type];
            const cw = vp.clientWidth || 1;
            const ch = vp.clientHeight || 1;
            const contain = Math.min(cw / iw, ch / ih);
            const cover = Math.max(cw / iw, ch / ih);
            return Math.max(1, +(cover / contain).toFixed(3));
        }

        const mapState = { recv: { s: 1, x: 0, y: 0 }, fen: { s: 1, x: 0, y: 0 } };
        const mapEdit = { active: false, pending: null };
        let mapSuppressClick = false;
        let drag = null; // 模块级，visibilitychange 兜底能访问

        const state = {
            view: 'all',
            mapSlide: 'recv',
            period: 'month',
            kpiGroup: 'overview',
            allRows: [],
            rows: [],
            invalidRows: [],
            dupRows: [],
            dataFallback: false,
            charts: {},
            alertIndex: 0,
            alertItems: [],
            lastVer: ''
        };

        /* ================= 通用工具（与 index_1 保持一致） ================= */
        function isEmpty(value) {
            return value === null || value === undefined || value === '' ||
                (typeof value === 'string' && value.trim() === '');
        }

        function cleanString(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[\s\u00A0\u2000-\u200B\uFEFF]/g, '');
        }

        function getFieldValue(row, fieldName) {
            const cleanField = cleanString(fieldName).toLowerCase();
            for (const key of Object.keys(row)) {
                if (cleanString(key).toLowerCase() === cleanField) return row[key];
            }
            return undefined;
        }

        function determineStatus(row) {
            const columns = Object.keys(row);
            const excludeColumns = ['备注'];

            const isCompletedField = getFieldValue(row, '是否消缺');
            if (!isEmpty(isCompletedField)) {
                const val = String(isCompletedField).trim().toLowerCase();
                const isPending = ['否', '未', 'no', 'false', '×', 'n'].some(v => val.includes(v));
                if (isPending) return '待消缺项目';
                const isCompleted = ['是', '已', '完', '√', '✔', 'y', 'yes', 'true'].some(v => val.includes(v));
                if (isCompleted) return '已消缺项';
            }

            const repairPerson = getFieldValue(row, '消缺人');
            if (isEmpty(repairPerson)) return '待消缺项目';

            const hasEmptyColumn = columns.some(col => {
                if (excludeColumns.some(exclude => col.includes(exclude) || exclude.includes(col))) return false;
                return isEmpty(row[col]);
            });
            return hasEmptyColumn ? '待消缺项目' : '已消缺项';
        }

        function getProfession(row) {
            for (const key of Object.keys(row)) {
                const cleanKey = cleanString(key).toLowerCase();
                if (cleanKey === '专业' || cleanKey === 'specialty' || cleanKey === 'major') {
                    const value = row[key];
                    return isEmpty(value) ? '未分类' : String(value).trim();
                }
            }
            for (const key of Object.keys(row)) {
                const cleanKey = cleanString(key).toLowerCase();
                if (cleanKey.includes('专业')) {
                    const value = row[key];
                    return isEmpty(value) ? '未分类' : String(value).trim();
                }
            }
            return '未分类';
        }

        function displayProfession(name) {
            return PROFESSION_DISPLAY_NAMES[name] || name;
        }

        function getId(row) {
            const raw = row['缺陷编号'] || row['编号'] || row['ID'];
            return isEmpty(raw) ? '' : String(raw).trim();
        }

        // 编号合法性：仅 11 位（接收站）/ 14 位（分输站）参与统计，其余视为脏数据
        function isValidIdLength(id) {
            const len = String(id || '').trim().length;
            return len === 11 || len === 14;
        }

        // 整行指纹：字段名排序，值 trim，null/undefined 视空串，排除内部临时字段（_ 开头）
        function rowFingerprint(row) {
            const obj = row || {};
            return Object.keys(obj)
                .filter(k => !String(k).startsWith('_'))
                .sort()
                .map(k => {
                    const v = obj[k];
                    return k + '=' + (v === undefined || v === null ? '' : String(v).trim());
                })
                .join('\u0001');
        }

        // 只折叠「整行完全相同」的行：保留先出现的一条，同编号不同内容不折叠
        function foldExactDuplicates(rows) {
            const seen = new Set();
            const kept = [];
            const folded = [];
            rows.forEach(row => {
                const fp = rowFingerprint(row);
                if (seen.has(fp)) { folded.push(row); return; }
                seen.add(fp);
                kept.push(row);
            });
            return { kept, folded };
        }

        function getStationType(id) {
            const s = String(id || '').trim();
            if (s.length === 14) return 'fen';
            if (s.length === 11) return 'recv';
            return '';
        }

        const ZONE_FIELDS = ['所属岗位', '所属站场', '站点', '所属岗位/站场', '所属站点', '站点名称', '站场', '站场名称', '所属场站', '场站', '区域', '岗位', '区域名称'];
        let zoneDiagDone = false;
        function getZone(row) {
            for (const field of ZONE_FIELDS) {
                const value = getFieldValue(row, field);
                if (!isEmpty(value)) return String(value).trim();
            }
            // 诊断：未识别到区域字段时，在控制台打印该行实际字段名，便于扩充 ZONE_FIELDS
            if (!zoneDiagDone && typeof console !== 'undefined') {
                zoneDiagDone = true;
                console.warn('[看板] 存在未识别区域字段的记录，实际字段名为：', Object.keys(row));
            }
            return '未归属';
        }

        // 缺陷描述 = 区域部位/设备名称/位号 + 缺陷描述 合并显示
        function getDesc(row, fallback) {
            const part = getFieldValue(row, '区域部位/设备名称/位号');
            const desc = getFieldValue(row, '缺陷描述');
            const p = isEmpty(part) ? '' : String(part).trim();
            const d = isEmpty(desc) ? '' : String(desc).trim();
            if (p && d) return p + ' ' + d;
            return p || d || (fallback || '—');
        }

        function isFlag(row, field) {
            const value = getFieldValue(row, field);
            if (isEmpty(value)) return false;
            const s = String(value).trim().toLowerCase();
            return ['是', '有', '√', '✔', 'true', 'yes', '1'].some(v => s === v || s.includes(v));
        }

        function getLevelRaw(row) {
            return getFieldValue(row, '分类定级') || getFieldValue(row, '定级') || getFieldValue(row, '分类');
        }

        /* ================= 日期工具（与 index_1 保持一致） ================= */
        function getMonthFromDefectId(defectId) {
            if (isEmpty(defectId)) return null;
            const idStr = String(defectId);
            let datePart;
            if (idStr.length === 14) {
                datePart = idStr.substring(3, 11);
            } else if (idStr.length >= 8) {
                datePart = idStr.substring(0, 8);
            } else {
                return null;
            }
            const year = datePart.substring(0, 4);
            const month = datePart.substring(4, 6);
            if (!isNaN(year) && !isNaN(month) && year.length === 4 && month.length === 2) {
                return `${year}-${month}`;
            }
            return null;
        }

        function getDateFromDefectId(defectId) {
            if (isEmpty(defectId)) return null;
            const idStr = String(defectId);
            let datePart;
            if (idStr.length === 14) {
                datePart = idStr.substring(3, 11);
            } else if (idStr.length >= 8) {
                datePart = idStr.substring(0, 8);
            } else {
                return null;
            }
            const year = parseInt(datePart.substring(0, 4), 10);
            const month = parseInt(datePart.substring(4, 6), 10);
            const day = parseInt(datePart.substring(6, 8), 10);
            if (isNaN(year) || isNaN(month) || isNaN(day)) return null;
            if (month < 1 || month > 12 || day < 1 || day > 31) return null;
            const d = new Date(year, month - 1, day);
            return isNaN(d.getTime()) ? null : d;
        }

        function toDate(dateValue) {
            if (isEmpty(dateValue)) return null;
            let date;
            if (typeof dateValue === 'number') {
                date = new Date((dateValue - 25569) * 86400 * 1000);
            } else {
                date = new Date(dateValue);
            }
            return isNaN(date.getTime()) ? null : date;
        }

        function formatDateOnly(val) {
            if (isEmpty(val)) return '';
            const d = toDate(val);
            if (d) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }
            return String(val).replace(/\s+\d{1,2}:\d{2}(:\d{2})?$/, '').trim();
        }

        function getCompleteDate(row) {
            const raw = row['消项时间'] || row['消缺完成日期'] || row['完成日期'] || row['消缺时间'];
            return toDate(raw);
        }

        function getCompleteMonth(row) {
            const d = getCompleteDate(row);
            if (!d) return null;
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        function getFilteredMonths() {
            const now = new Date();
            const months = [];
            for (let i = 11; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
            }
            return months;
        }

        /* 日期区间判定（实现与 index_1 逐行一致） */
        function isSameMonth(a, b) {
            return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
        }

        function isSameYear(a, b) {
            return a.getFullYear() === b.getFullYear();
        }

        // 同一自然周（周一 ~ 周日）
        function isSameWeek(a, b) {
            const dayA = a.getDay() || 7;
            const dayB = b.getDay() || 7;
            const mondayA = new Date(a);
            mondayA.setDate(a.getDate() - dayA + 1);
            mondayA.setHours(0, 0, 0, 0);
            const mondayB = new Date(b);
            mondayB.setDate(b.getDate() - dayB + 1);
            mondayB.setHours(0, 0, 0, 0);
            return mondayA.getTime() === mondayB.getTime();
        }

        function isYesterday(d) {
            const y = new Date();
            y.setDate(y.getDate() - 1);
            y.setHours(0, 0, 0, 0);
            const target = new Date(d);
            target.setHours(0, 0, 0, 0);
            return target.getTime() === y.getTime();
        }

        function isClassILevel(level) {
            const s = String(level || '');
            if (/[二Ⅱ]/.test(s) || /II/i.test(s)) return false;
            return /[一Ⅰ1I]/.test(s);
        }

        function isClassIScopeRow(row) {
            const profession = getProfession(row);
            if (profession === '未分类' || profession.includes('土建') || profession.includes('消防')) return false;
            const levelRaw = getLevelRaw(row);
            return !isEmpty(levelRaw) && isClassILevel(levelRaw);
        }

        /* ================= 数据加载 ================= */
        function normalizeRow(row) {
            const copy = { ...row };
            const id = getId(copy);

            const profKey = Object.keys(copy).find(k => {
                const ck = cleanString(k).toLowerCase();
                return ck === '专业' || ck === 'specialty' || ck === 'major' || ck.includes('专业');
            });
            if (profKey) {
                const p = String(copy[profKey] || '').trim();
                if (p === '其他' || p === '其他专业') {
                    if (id.length === 11) copy[profKey] = '接收站运行部';
                    else if (id.length === 14) copy[profKey] = '管道运行部';
                }
            }
            copy.status = determineStatus(copy);
            return copy;
        }

        function readStorageRows(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function loadData() {
            // defectData_all 是当前数据的唯一权威来源：原样读取，不去重、不过滤行
            // 仅当总键缺失/解析失败时，才用 recv + fen 并集兜底（同样不去重）
            let rows = null;
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) rows = parsed;
                }
            } catch (e) {
                rows = null;
            }

            state.dataFallback = false;
            if (!rows) {
                rows = readStorageRows('defectData_recv').concat(readStorageRows('defectData_fen'));
                state.dataFallback = true;
                console.warn('[数据] defectData_all 缺失或解析失败，已用接收站/分输站数据兜底，共 ' + rows.length + ' 条');
            }

            // 统计层不做编号长度过滤：所有行原样计入，仅折叠「整行完全相同」
            const rawRows = rows.filter(row => row && typeof row === 'object');
            state.invalidRows = rawRows.filter(row => !isValidIdLength(getId(row)));
            if (state.invalidRows.length) {
                console.warn('[数据] 编号非 11/14 位 ' + state.invalidRows.length + ' 条（仅提示，不参与过滤）；前 10 条编号：',
                    state.invalidRows.slice(0, 10).map(getId));
            }
            const folded = foldExactDuplicates(rawRows);
            state.dupRows = folded.folded;
            if (state.dupRows.length) {
                console.warn('[数据] 完全重复行 ' + state.dupRows.length + ' 条，已折叠；前 10 条编号：',
                    state.dupRows.slice(0, 10).map(getId));
            }
            state.allRows = folded.kept.map(normalizeRow);
        }

        function applyView() {
            if (state.view === 'all') {
                state.rows = state.allRows.slice();
            } else {
                state.rows = state.allRows.filter(row => getStationType(getId(row)) === state.view);
            }
        }

        /* ================= 数据核对面板（只读展示，不参与取数与统计） ================= */
        const dbgPanel = document.getElementById('dbgPanel');
        const dbgBtn = document.getElementById('dbgBtn');

        function readSourceInfo(key) {
            const raw = localStorage.getItem(key);
            if (raw === null) return { exists: false, broken: false, rows: [], raw: '' };
            try {
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed)) return { exists: true, broken: true, rows: [], raw };
                return { exists: true, broken: false, rows: parsed, raw };
            } catch (e) {
                return { exists: true, broken: true, rows: [], raw };
            }
        }

        function sourceCountText(info) {
            if (!info.exists) return '键不存在';
            if (info.broken) return '解析失败（键存在）';
            return info.rows.length + ' 条';
        }

        function uniqueIdCount(rows) {
            const set = new Set();
            rows.forEach(row => {
                if (!row || typeof row !== 'object') return;
                const id = getId(row);
                if (id) set.add(id);
            });
            return set.size;
        }

        function debugSourceRow(name, info) {
            const cells = !info.exists || info.broken
                ? '<td>—</td><td>—</td>'
                : '<td>' + info.rows.length + '</td><td>' + uniqueIdCount(info.rows) + '</td><td>'
                + (info.rows.length - uniqueIdCount(info.rows)) + '</td>';
            return '<tr><th>' + name + '</th><td>' + sourceCountText(info) + '</td>' + cells + '</tr>';
        }

        function escapeDbg(v) {
            return String(v === undefined || v === null ? '' : v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // 同编号分组（仅用于展示/导出，绝不折叠、不删除）
        function getSameIdGroups() {
            const map = new Map();
            state.allRows.forEach(row => {
                const id = getId(row);
                if (!id) return;
                if (!map.has(id)) map.set(id, []);
                map.get(id).push(row);
            });
            const groups = [];
            map.forEach((rows, id) => { if (rows.length > 1) groups.push({ id, rows }); });
            groups.sort((a, b) => b.rows.length - a.rows.length || a.id.localeCompare(b.id));
            return groups;
        }

        function describeSameIdRow(row) {
            const desc = String(getFieldValue(row, '缺陷描述') || '').replace(/\s+/g, ' ').trim();
            return {
                专业: getFieldValue(row, '专业') || '—',
                分类定级: getFieldValue(row, '分类定级') || getFieldValue(row, '定级') || getFieldValue(row, '分类') || '—',
                状态: getFieldValue(row, '状态') || determineStatus(row),
                登记日期: getFieldValue(row, '登记日期') || getFieldValue(row, '编号日期') || getFieldValue(row, '登记时间') || '—',
                消项时间: getFieldValue(row, '消项时间') || getFieldValue(row, '消缺完成日期') || getFieldValue(row, '完成日期') || '—',
                缺陷描述: desc.length > 30 ? desc.slice(0, 30) + '…' : desc
            };
        }

        function renderSameIdGroups() {
            const groups = getSameIdGroups();

        // 三键差集：recv/fen 有、all 没有的行（整行指纹 + 编号双路匹配，只读）
        function getKeyDiff() {
            const recv = readSourceInfo('defectData_recv');
            const fen = readSourceInfo('defectData_fen');
            const all = readSourceInfo('defectData_all');
            const allRows = all.exists && !all.broken ? all.rows : [];
            const allFp = new Set();
            const allIds = new Set();
            allRows.forEach(row => {
                if (!row || typeof row !== 'object') return;
                allFp.add(rowFingerprint(row));
                const id = getId(row);
                if (id) allIds.add(id);
            });
            const missing = [];
            const seen = new Set();
            const scan = (info, src) => {
                if (!info.exists || info.broken) return;
                info.rows.forEach(row => {
                    if (!row || typeof row !== 'object') return;
                    const fp = rowFingerprint(row);
                    if (allFp.has(fp) || seen.has(fp)) return;
                    const id = getId(row);
                    seen.add(fp);
                    missing.push({ row, src, reason: id && allIds.has(id) ? '同编号内容不同' : 'all 中无此编号' });
                });
            };
            scan(recv, 'recv');
            scan(fen, 'fen');
            const recvCount = recv.exists && !recv.broken ? recv.rows.length : null;
            const fenCount = fen.exists && !fen.broken ? fen.rows.length : null;
            const allCount = all.exists && !all.broken ? all.rows.length : null;
            const sum = recvCount !== null && fenCount !== null ? recvCount + fenCount : null;
            return {
                recvCount, fenCount, allCount, sum,
                diff: sum !== null && allCount !== null ? allCount - sum : null,
                missing
            };
        }

        function renderKeyDiff() {
            const d = getKeyDiff();
            const fmt = v => (v === null ? '—' : v);
            const diffCls = d.diff === 0 ? 'dbg-ok' : 'dbg-warn';
            const diffText = d.diff === null ? '—' : (d.diff > 0 ? '+' + d.diff : String(d.diff));
            const changed = d.missing.filter(m => m.reason === '同编号内容不同').length;
            let html = '<div style="margin-top:10px;font-size:11px;">三键条数对照：recv <b>' + fmt(d.recvCount)
                + '</b> · fen <b>' + fmt(d.fenCount) + '</b> · recv+fen <b>' + fmt(d.sum)
                + '</b> · all <b>' + fmt(d.allCount) + '</b> · 差额 <span class="' + diffCls + '">' + diffText + '</span></div>'
                + '<div style="margin-top:4px;font-size:11px;">recv/fen 有、all 没有：<b>' + d.missing.length
                + '</b> 条（其中同编号内容不同 ' + changed + ' 条）'
                + '<span class="dbg-nofold">只读，不写存储、不删除</span></div>';
            if (d.missing.length) {
                const body = d.missing.map((m, idx) => {
                    const f = describeSameIdRow(m.row);
                    return '<tr><td>' + (idx + 1) + '</td><td>' + m.src + '</td><td>' + escapeDbg(getId(m.row))
                        + '</td><td>' + getId(m.row).length + '</td><td>' + escapeDbg(f.专业) + '</td><td>'
                        + escapeDbg(f.状态) + '</td><td>' + escapeDbg(f.缺陷描述) + '</td><td class="dbg-warn">'
                        + m.reason + '</td></tr>';
                }).join('');
                html += '<div class="dbg-scroll" style="margin-top:4px;"><table class="dbg-table">'
                    + '<tr><th>#</th><th>来源</th><th>编号</th><th>长度</th><th>专业</th><th>状态</th><th>缺陷描述（前30字）</th><th>判定</th></tr>'

        }

        // 一次性手动清理：三个键各自独立折叠「整行完全相同」，不做按编号去重、不过滤编号
        function cleanExactDuplicates() {
            const keys = ['defectData_recv', 'defectData_fen', 'defectData_all'];
            const plan = keys.map(key => {
                const info = readSourceInfo(key);
                if (!info.exists || info.broken) return { key, before: null, after: null, folded: 0, kept: null };
                const res = foldExactDuplicates(info.rows);
                return { key, before: info.rows.length, after: res.kept.length, folded: res.folded.length, kept: res.kept };
            });
            const removable = plan.reduce((sum, p) => sum + p.folded, 0);
            if (!removable) {
                alert('未发现整行完全相同的重复行，无需清理。');
                return;
            }
            const detail = plan
                .filter(p => p.before !== null)
                .map(p => p.key + '：' + p.before + ' → ' + p.after + '（删除 ' + p.folded + ' 条）')
                .join('\n');
            if (!confirm('将删除整行完全相同的数据共 ' + removable + ' 条，无法恢复。\n\n' + detail +
                '\n\n只删除整行完全相同的数据；「同编号不同内容」清单中的记录一律不动，也不过滤编号。是否继续？')) return;
            if (!confirm('再次确认：将立即写回 localStorage 的 defectData_recv / defectData_fen / defectData_all，不可撤销。')) return;

            const recvPlan = plan.find(p => p.key === 'defectData_recv');
            const fenPlan = plan.find(p => p.key === 'defectData_fen');
            const recv = recvPlan && recvPlan.kept ? recvPlan.kept : readStorageRows('defectData_recv');
            const fen = fenPlan && fenPlan.kept ? fenPlan.kept : readStorageRows('defectData_fen');
            if (recvPlan && recvPlan.kept) localStorage.setItem('defectData_recv', JSON.stringify(recvPlan.kept));
            if (fenPlan && fenPlan.kept) localStorage.setItem('defectData_fen', JSON.stringify(fenPlan.kept));
            // all 重建 = 当前 recv 全量 + 当前 fen 全量原样拼接（不再折叠、不过滤）
            const rebuilt = recv.concat(fen);
            localStorage.setItem('defectData_all', JSON.stringify(rebuilt));
            localStorage.setItem('defectData_all_ver', String(Date.now()));
            alert('清理完成：\n' + detail + '\n\ndefectData_all 重建后 ' + rebuilt.length + ' 条（= recv ' + recv.length + ' + fen ' + fen.length + '）');
            loadData();
            renderAll();
            if (dbgPanel && dbgPanel.classList.contains('open')) renderDebugPanel();
        }

        function startAutoSync() {
            const POLL_INTERVAL_MS = 5000;
            let lastSnapshot = '';
            try {
                state.lastVer = localStorage.getItem(VER_KEY) || '';
                lastSnapshot = localStorage.getItem(STORAGE_KEY) || '';
            } catch (e) {
                state.lastVer = '';
            }
            if (state.lastVer) setSyncText(state.lastVer);

            function onDataChanged() {
                try {
                    lastSnapshot = localStorage.getItem(STORAGE_KEY) || '';
                    state.lastVer = localStorage.getItem(VER_KEY) || state.lastVer;
                } catch (e) { }
                loadData();
                renderAll();
                setSyncText(Date.now());
            }

            // 双重检测：版本号变化（接收站/分输站同步）+ 原始数据变化（插件直接写入）
            setInterval(function () {
                try {
                    const ver = localStorage.getItem(VER_KEY) || '';
                    const raw = localStorage.getItem(STORAGE_KEY) || '';
                    if ((ver && ver !== state.lastVer) || raw !== lastSnapshot) {
                        onDataChanged();
                    }
                } catch (e) { }
            }, POLL_INTERVAL_MS);

            window.addEventListener('storage', function (e) {
                if (e.key === VER_KEY && e.newValue && e.newValue !== state.lastVer) {
                    state.lastVer = e.newValue;
                    onDataChanged();
                }
                if (e.key === STORAGE_KEY && e.newValue) {
                    onDataChanged();
                }
            });
        }

        /* ================= 统计口径（与 index_1 一致） ================= */
        function calculateMonthlyStats(rows) {
            const now = new Date();
            const filteredMonths = getFilteredMonths();
            const stats = {
                remainingFire: 0,
                remainingI: 0,
                remainingII: 0,
                remainingCivil: 0,
                yesterdayNew: 0,
                monthNew: 0,
                yearCompleted: 0,
                yesterdayDone: 0,
                monthDone: 0,
                yearNew: 0
            };

            const monthlyStats = {};
            filteredMonths.forEach(m => {
                monthlyStats[m] = { new: 0, completed: 0, pending: 0 };
            });

            const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);

            rows.forEach(row => {
                const defectId = getId(row);
                const profession = getProfession(row);
                const isPending = row.status === '待消缺项目';
                const isCompleted = row.status === '已消缺项';
                const defectDate = getDateFromDefectId(defectId);
                const completeDate = isCompleted ? getCompleteDate(row) : null;

                if (isClassIScopeRow(row)) {
                    const newMonthKey = getMonthFromDefectId(defectId);
                    if (newMonthKey && filteredMonths.includes(newMonthKey)) {
                        monthlyStats[newMonthKey].new++;
                    }
                    if (isCompleted) {
                        const completeMonthKey = getCompleteMonth(row);
                        if (completeMonthKey && filteredMonths.includes(completeMonthKey)) {
                            monthlyStats[completeMonthKey].completed++;
                        }
                    }
                }

                if (defectDate) {
                    const dd = new Date(defectDate.getFullYear(), defectDate.getMonth(), defectDate.getDate());
                    if (dd.getTime() === yesterday.getTime()) stats.yesterdayNew++;
                    if (dd.getFullYear() === now.getFullYear() && dd.getMonth() === now.getMonth()) stats.monthNew++;
                    if (dd.getFullYear() === now.getFullYear()) stats.yearNew++;
                }

                if (isCompleted && completeDate) {
                    const cd = new Date(completeDate.getFullYear(), completeDate.getMonth(), completeDate.getDate());
                    if (cd.getTime() === yesterday.getTime()) stats.yesterdayDone++;
                    if (cd.getFullYear() === now.getFullYear() && cd.getMonth() === now.getMonth()) stats.monthDone++;
                    if (cd.getFullYear() === now.getFullYear()) stats.yearCompleted++;
                }

                if (isPending) {
                    const isFire = profession.includes('消防');
                    const isCivil = profession.includes('土建');
                    const levelRaw = getLevelRaw(row);
                    if (isFire) {
                        stats.remainingFire++;
                    } else if (isCivil) {
                        stats.remainingCivil++;
                    } else if (!isEmpty(levelRaw) && isClassILevel(levelRaw)) {
                        stats.remainingI++;
                    } else {
                        stats.remainingII++;
                    }
                }
            });

            filteredMonths.forEach(month => {
                let pending = 0;
                rows.forEach(row => {
                    if (!isClassIScopeRow(row)) return;
                    const mk = getMonthFromDefectId(getId(row));
                    if (!mk || mk > month) return;
                    if (row.status === '已消缺项') {
                        const ck = getCompleteMonth(row);
                        if (!ck || ck <= month) return;
                    }
                    pending++;
                });
                monthlyStats[month].pending = pending;
            });

            return { stats, monthlyStats, filteredMonths };
        }

        function getClassIProfessionStats(rows) {
            const remainingStats = {};
            const newStats = {};
            const completedStats = {};
            MAJOR_PROFESSIONS.forEach(p => {
                remainingStats[p] = 0;
                newStats[p] = 0;
                completedStats[p] = 0;
            });
            const extraProfessions = new Set();

            const now = new Date();
            const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

            rows.forEach(row => {
                const profession = getProfession(row);
                if (profession === '未分类' || profession.includes('土建') || profession.includes('消防')) return;
                const levelRaw = getLevelRaw(row);
                if (isEmpty(levelRaw) || !isClassILevel(levelRaw)) return;

                if (!(profession in remainingStats)) {
                    extraProfessions.add(profession);
                    remainingStats[profession] = 0;
                    newStats[profession] = 0;
                    completedStats[profession] = 0;
                }

                const newMonthKey = getMonthFromDefectId(getId(row));
                if (row.status === '待消缺项目' && newMonthKey && newMonthKey <= currentMonthKey) {
                    remainingStats[profession]++;
                }
                if (newMonthKey && newMonthKey === currentMonthKey) {
                    newStats[profession]++;
                }
                if (row.status === '已消缺项') {
                    const completeMonthKey = getCompleteMonth(row);
                    if (completeMonthKey && completeMonthKey === currentMonthKey) {
                        completedStats[profession]++;
                    }
                }
            });

            return {
                professions: [...MAJOR_PROFESSIONS, ...extraProfessions],
                remainingStats,
                newStats,
                completedStats
            };
        }

        /* 龙虎榜上榜率（试验版）：开关关闭即完全隐藏 UI 并短路计算 */
        const SHOW_BOARD_RATE = true;

        /* 本年上榜率：月度榜口径，分子=进入当月前三的月数，分母=1 月至当前月 */
        function getBoardRateStats(rows, now) {
            if (!SHOW_BOARD_RATE) return { hits: {}, totalMonths: 0 };
            const ref = now || new Date();
            const curY = ref.getFullYear();
            const totalMonths = ref.getMonth() + 1;
            const hits = {};
            for (let m = 0; m < totalMonths; m++) {
                const map = {};
                rows.forEach(row => {
                    if (row.status !== '已消缺项') return;
                    const d = getCompleteDate(row);
                    if (!d || d.getFullYear() !== curY || d.getMonth() !== m) return;
                    const prof = getProfession(row);
                    if (!prof || prof === '未分类') return;
                    map[prof] = (map[prof] || 0) + 1;
                });
                Object.entries(map)
                    .map(([prof, count]) => ({ prof, count }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 3)
                    .forEach(item => { hits[item.prof] = (hits[item.prof] || 0) + 1; });
            }
            return { hits, totalMonths };
        }

        function getLeaderboard(rows, period) {
            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const yearStart = new Date(now.getFullYear(), 0, 1);
            const yesterdayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            const yesterdayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const map = {};
            rows.forEach(row => {
                if (row.status !== '已消缺项') return;
                const d = getCompleteDate(row);
                if (!d) return;
                const dayDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                let matched = false;
                if (period === 'yesterday') matched = dayDate >= yesterdayStart && dayDate < yesterdayEnd;
                else if (period === 'week') matched = isSameWeek(dayDate, now);
                else if (period === 'month') matched = dayDate >= monthStart;
                else matched = dayDate >= yearStart;
                if (!matched) return;
                const prof = getProfession(row);
                if (prof === '未分类') return;
                map[prof] = (map[prof] || 0) + 1;
            });
            return Object.entries(map)
                .map(([prof, count]) => ({ prof, count }))
                .sort((a, b) => b.count - a.count);
        }

        /* ================= 渲染 ================= */
        const CHART_TOOLTIP = {
            backgroundColor: 'rgba(4, 20, 34, 0.94)',
            borderColor: 'rgba(59, 210, 255, 0.55)',
            borderWidth: 1,
            textStyle: { color: '#d8f2ff', fontSize: 12 },
            extraCssText: 'box-shadow:0 4px 16px rgba(0,0,0,.45);border-radius:3px;'
        };

        function getChart(id) {
            if (typeof echarts === 'undefined') return null;
            const el = document.getElementById(id);
            if (!el) return null;
            if (!state.charts[id]) state.charts[id] = echarts.init(el);
            return state.charts[id];
        }

        function showChartFallback(id, text) {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#6d97b4;font-size:12px;letter-spacing:2px;">${text}</div>`;
        }

        function renderAll() {
            applyView();
            renderKPI();
            renderTrend();
            renderSuperviseStats();
            renderProfChart();
            renderBoardChart();
            renderList();
            renderAlerts();
            renderSuperviseList();
            renderMaps();
            document.getElementById('emptyState').classList.toggle('show', state.allRows.length === 0);
            if (dbgPanel && dbgPanel.classList.contains('open')) renderDebugPanel();
        }

        /* ================= 关键指标 ================= */
        // 四组：总览（原有四卡） / 剩余分类 / 较上日·较上周 / 较上月·较上年（12 项，取数与 index_1 一致）
        const KPI_GROUPS = ['overview', 'remain', 'week', 'month'];
        const KPI_GROUP_DEFS = {
            remain: [
                { key: 'remainI', cls: 'cyan', icon: 'Ⅰ', lbl: '剩余Ⅰ类缺陷数' },
                { key: 'remainCivil', cls: 'amber', icon: '土', lbl: '剩余土建类缺陷数' },
                { key: 'remainII', cls: 'green', icon: 'Ⅱ', lbl: '剩余Ⅱ类缺陷数' },
                { key: 'remainFire', cls: 'silver', icon: '火', lbl: '剩余消防类缺陷数' }
            ],
            week: [
                { key: 'yesterdayNew', cls: 'cyan', icon: '昨', lbl: '昨日新增缺陷数' },
                { key: 'weekNew', cls: 'amber', icon: '周', lbl: '本周新增缺陷数' },
                { key: 'yesterdayDone', cls: 'green', icon: '昨', lbl: '昨日消缺数' },
                { key: 'weekDone', cls: 'silver', icon: '周', lbl: '本周消缺数' }
            ],
            month: [
                { key: 'monthNew', cls: 'cyan', icon: '月', lbl: '本月新增缺陷数' },
                { key: 'yearNew', cls: 'amber', icon: '年', lbl: '今年新增缺陷数' },
                { key: 'monthDone', cls: 'green', icon: '月', lbl: '本月消缺数' },
                { key: 'yearDone', cls: 'silver', icon: '年', lbl: '今年消缺数' }
            ]
        };

        // 剩余分类判定：消防 → 土建 → Ⅰ类 → Ⅱ类（分支顺序与 index_1 的 Row1 一致）
        function remainCategoryOf(row) {
            const prof = getProfession(row);
            if (prof.includes('消防')) return 'remainFire';
            if (prof.includes('土建')) return 'remainCivil';
            const levelRaw = getLevelRaw(row);
            return (!isEmpty(levelRaw) && isClassILevel(levelRaw)) ? 'remainI' : 'remainII';
        }

        function monthKeyOf(d) {
            return d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : null;
        }

        // 一次性把每行的日期 / 状态 / 剩余分类算好，避免多次重复解析
        function buildKpiMeta(rows) {
            return rows.map(row => {
                const dd = getDateFromDefectId(getId(row));
                const done = row.status === '已消缺项';
                const cd = done ? getCompleteDate(row) : null;
                return {
                    row,
                    dd,
                    cd,
                    mk: monthKeyOf(dd),
                    ck: monthKeyOf(cd),
                    pending: row.status === '待消缺项目',
                    done,
                    cat: remainCategoryOf(row)
                };
            });
        }

        function kpiMatches(m, key) {
            const now = new Date();
            if (key === 'remainI' || key === 'remainII' || key === 'remainCivil' || key === 'remainFire') {
                return m.pending && m.cat === key;
            }
            if (key === 'yesterdayNew') return !!m.dd && isYesterday(m.dd);
            if (key === 'weekNew') return !!m.dd && isSameWeek(m.dd, now);
            if (key === 'monthNew') return !!m.dd && isSameMonth(m.dd, now);
            if (key === 'yearNew') return !!m.dd && isSameYear(m.dd, now);
            if (key === 'yesterdayDone') return m.done && !!m.cd && isYesterday(m.cd);
            if (key === 'weekDone') return m.done && !!m.cd && isSameWeek(m.cd, now);
            if (key === 'monthDone') return m.done && !!m.cd && isSameMonth(m.cd, now);
            if (key === 'yearDone') return m.done && !!m.cd && isSameYear(m.cd, now);
            return false;
        }

        function kpiRows(rows, key) {
            return buildKpiMeta(rows).filter(m => kpiMatches(m, key)).map(m => m.row);
        }

        /* ===== 趋势 / sparkline / 卡片渲染（总览、分组、督办三处共用） ===== */
        /* 方向即颜色：↗ 上升=绿、↘ 下降=红、— 持平=灰，不再按指标语义反转 */
        function kpiTrend(cur, prev, emptyLabel) {
            if (prev === 0) return { arrow: '—', pct: '', tone: 'flat', tip: emptyLabel || '无上期数据' };
            if (cur === prev) return { arrow: '—', pct: '0%', tone: 'flat' };
            const pct = Math.abs(cur - prev) / prev * 100;
            const pctStr = pct < 1 ? pct.toFixed(2) + '%' : pct.toFixed(1) + '%';
            // 负值一律视为下降，避免出现「↗ + 负数」的矛盾
            const up = cur > prev && cur >= 0;
            return { arrow: up ? '↗' : '↘', pct: pctStr, tone: up ? 'up' : 'down' };
        }

        /* 统一趋势视图：对比值为 0 一律「— 无上期数据」；invert=true 时颜色按好坏反转（剩余类：降为绿） */
        function trendView(cur, prev, opts) {
            const o = opts || {};
            const t = kpiTrend(cur, prev, o.emptyLabel || '无上期数据');
            if (o.invert && t.tone !== 'flat') t.tone = t.tone === 'up' ? 'down' : 'up';
            return t;
        }

        /* 存量快照：截至某时点的累计总数 / 累计完成数 / 累计剩余数（无日期记录不进历史快照） */
        function stockSnapshot(rows, end) {
            let total = 0, done = 0, remain = 0;
            rows.forEach(r => {
                const dd = getDateFromDefectId(getId(r));
                const created = !!dd && dd <= end;
                if (created) total++;
                const isDone = r.status === '已消缺项';
                const cd = isDone ? getCompleteDate(r) : null;
                const completedByEnd = !!(isDone && cd && cd <= end);
                if (completedByEnd) done++;
                if (created && !completedByEnd) remain++;
            });
            return { total, done, remain };
        }

        /* 存量指标环比：当前累计 vs 上月末累计，同口径；opts.invert=true → 下降为好（总数/剩余类） */
        function stockTrend(cur, prev, label, opts) {
            const o = opts || {};
            const t = trendView(cur, prev, { emptyLabel: '无上月数据', invert: !!o.invert });
            const diff = cur - prev;
            t.title = prev === 0
                ? `${label} 当前累计 ${cur} 条 · 上月无数据`
                : `${label} 当前累计 ${cur} 条 · 上月末累计 ${prev} 条（较上月 ${diff >= 0 ? '+' : ''}${diff} 条）`;
            return t;
        }

        /* 曲线单调化：按方向做包络（上行取历史最大值、下行取历史最小值），
           消除「整体上升但中间下跌」的锯齿；若首尾无净变化则补一个微小斜率，保证形态与箭头一致 */
        function monotoneSpark(data, tone) {
            let arr = (data && data.length) ? data.map(v => Number(v) || 0) : [0];
            if (arr.length < 2) arr = [arr[0], arr[0]];
            if (tone === 'flat') {
                const last = arr[arr.length - 1];
                return arr.map(() => last);
            }
            const dir = tone === 'up' ? 1 : -1;
            const out = [];
            let run = tone === 'up' ? -Infinity : Infinity;
            arr.forEach(v => {
                run = tone === 'up' ? Math.max(run, v) : Math.min(run, v);
                out.push(run);
            });
            if ((out[out.length - 1] - out[0]) * dir <= 0) {
                const span = Math.max(...out) - Math.min(...out);
                const step = Math.max(1, span) / (arr.length - 1);
                for (let i = 0; i < out.length; i++) out[i] += dir * step * i;
            }
            return out;
        }

        /* 月末快照：某月最后一天 23:59:59.999 */
        function monthEndDate(y, m) {
            return new Date(y, m + 1, 0, 23, 59, 59, 999);
        }

        /* 截至某一时点的累计总数 / 累计完成数（未登记日期的记录不计入历史快照） */
        function cumulativeAt(rows, end) {
            let t = 0, d = 0;
            rows.forEach(r => {
                const dd = getDateFromDefectId(getId(r));
                if (dd && dd <= end) t++;
                if (r.status !== '已消缺项') return;
                const cd = getCompleteDate(r);
                if (cd && cd <= end) d++;
            });
            return { t, d };
        }

        /* 累计完成率序列：各月末累计完成 / 各月末累计总数（当月末取当前全量，含无日期记录） */
        function cumulativeRateSeries(rows, months, curY, curM) {
            return months.map(mm => {
                const isCur = mm.y === curY && mm.m === curM;
                let t, d;
                if (isCur) {
                    t = rows.length;
                    d = rows.filter(r => r.status === '已消缺项').length;
                } else {
                    const snap = cumulativeAt(rows, monthEndDate(mm.y, mm.m));
                    t = snap.t;
                    d = snap.d;
                }
                return t ? +(d / t * 100).toFixed(1) : 0;
            });
        }

        /* 累计完成率环比：胶囊=箭头+百分点差+「较上月」，箭头/颜色只跟百分点差走；条数与基数移到 tooltip */
        function rateDeltaView(rows, curY, curM, lastY, lastM, curRate, label) {
            const prevEnd = monthEndDate(lastY, lastM);
            let prevT = 0, prevD = 0;
            rows.forEach(r => {
                const dd = getDateFromDefectId(getId(r));
                if (dd && dd <= prevEnd) prevT++;
                if (r.status !== '已消缺项') return;
                const cd = getCompleteDate(r);
                if (cd && cd <= prevEnd) prevD++;
            });
            let curD = 0;
            rows.forEach(r => {
                if (r.status !== '已消缺项') return;
                const cd = getCompleteDate(r);
                if (cd) curD++;
            });
            const delta = curD - prevD;
            const crossYear = lastY !== curY ? `（跨年对比 ${lastY}-${String(lastM + 1).padStart(2, '0')}）` : '';
            const curStr = curRate.toFixed(1) + '%';
            const deltaNote = `本月累计完成较上月 ${delta >= 0 ? '+' : ''}${delta} 条${crossYear}`;
            if (prevT === 0) {
                return {
                    arrow: '—', pct: '', tip: '无上月数据', tone: 'flat',
                    title: `${label} ${curStr}（上月无数据）· ${deltaNote}`
                };
            }
            const pp = +(curRate - (prevD / prevT * 100)).toFixed(1);
            const ppAbs = Math.abs(pp).toFixed(1);
            const ppStr = `${pp >= 0 ? '+' : '-'}${ppAbs} 个百分点`;
            if (pp === 0) {
                return {
                    arrow: '—', pct: '0pp', tip: '较上月', tone: 'flat',
                    title: `${label} ${curStr}（较上月 0.0 个百分点）· ${deltaNote}`
                };
            }
            const up = pp > 0;
            return {
                arrow: up ? '↗' : '↘',
                pct: `${up ? '' : '-'}${ppAbs}pp`,
                tip: '较上月',
                tone: up ? 'up' : 'down',
                title: `${label} ${curStr}（较上月 ${ppStr}）· ${deltaNote}`
            };
        }

        function sparklineSVG(data, w, h, tone) {
            w = w || 56;
            h = h || 28;
            const arr = monotoneSpark(data, tone);
            const max = Math.max(...arr, 1);
            const min = Math.min(...arr, 0);
            const range = max - min || 1;
            const step = arr.length > 1 ? w / (arr.length - 1) : 0;
            const flat = tone === 'flat';
            const pts = arr.map((v, i) => {
                const x = arr.length > 1 ? i * step : w / 2;
                const y = flat ? h * 0.55 : h - ((v - min) / range * (h - 4)) - 2;
                return [x, y];
            });
            const dLine = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
            const dArea = dLine + ` L${pts[pts.length - 1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
            return `<svg class="s-spark s-spark-${tone || 'flat'}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
                <path class="area" d="${dArea}" />
                <path class="line" d="${dLine}" />
                <circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="1.5" fill="currentColor" opacity="0.9"/>
            </svg>`;
        }

        function kpiCardHTML(c) {
            return `
                <div class="s-card ${c.cls}" data-key="${c.key}">
                    <div class="s-head">
                        <div class="s-icon">${c.icon}</div>
                        <div class="s-lbl" title="${c.lbl}">${c.lbl}</div>
                    </div>
                    <div class="s-body">
                        <div class="s-val">${c.val}</div>
                        <div class="s-foot">
                            <span class="s-trend s-${c.tone}" title="${c.title || (c.lbl + ' ' + c.tip + ' ' + c.arrow + ' ' + c.pct)}">
                                <i class="s-arrow">${c.arrow}</i><span class="s-pct">${c.pct}</span><em>${c.tip}</em>
                            </span>
                            ${sparklineSVG(c.spark, c.sparkW, c.sparkH, c.tone)}
                        </div>
                    </div>
                </div>`;
        }

        /* ===== 总览：原有四张指标卡（缺陷总数 / 剩余缺陷 / 完成缺陷 / 消缺率） ===== */
        function renderKPIOverview() {
            const rows = state.rows;
            const now = new Date();
            const curY = now.getFullYear();
            const curM = now.getMonth();
            const lastMD = new Date(curY, curM - 1, 1);
            const lastY = lastMD.getFullYear();
            const lastM = lastMD.getMonth();

            const total = rows.length;
            const pending = rows.filter(r => r.status === '待消缺项目').length;
            const completed = total - pending;
            const rate = total ? (completed / total * 100) : 0;

            // 存量环比：当前累计 vs 上月末累计（同口径，不再用本月/上月新增流量对比总数）
            const prevSnap = stockSnapshot(rows, monthEndDate(lastY, lastM));

            // 累计消缺率环比：主显示累计完成绝对增量，百分比与百分点为次要信息
            const rateTrend = rateDeltaView(rows, curY, curM, lastY, lastM, rate, '累计消缺率');

            // 最近 6 个月 sparkline：存量卡取各月末累计快照，比率卡取各月末累计率
            const months = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(curY, curM - i, 1);
                months.push({ y: d.getFullYear(), m: d.getMonth() });
            }
            const slStock = months.map(m => (m.y === curY && m.m === curM)
                ? { total, done: completed, remain: pending }
                : stockSnapshot(rows, monthEndDate(m.y, m.m)));
            const slTotal = slStock.map(s => s.total);
            const slDone = slStock.map(s => s.done);
            const slRemain = slStock.map(s => s.remain);
            const slRate = cumulativeRateSeries(rows, months, curY, curM);

            const tTotal = stockTrend(total, prevSnap.total, '缺陷总数', { invert: true });
            const tRemain = stockTrend(pending, prevSnap.remain, '剩余缺陷', { invert: true });
            const tDone = stockTrend(completed, prevSnap.done, '完成缺陷');

            const cards = [
                { key: 'total', cls: 'cyan', val: total, lbl: '缺陷总数', icon: '●', arrow: tTotal.arrow, pct: tTotal.pct, tone: tTotal.tone, tip: tTotal.tip || '较上月', title: tTotal.title, spark: slTotal },
                { key: 'pending', cls: 'amber', val: pending, lbl: '剩余缺陷', icon: '◆', arrow: tRemain.arrow, pct: tRemain.pct, tone: tRemain.tone, tip: tRemain.tip || '较上月', title: tRemain.title, spark: slRemain },
                { key: 'completed', cls: 'green', val: completed, lbl: '完成缺陷', icon: '✓', arrow: tDone.arrow, pct: tDone.pct, tone: tDone.tone, tip: tDone.tip || '较上月', title: tDone.title, spark: slDone },
                { key: 'rate', cls: 'silver', val: total ? rate.toFixed(1) + '%' : '—', lbl: '累计消缺率', icon: '%', arrow: rateTrend.arrow, pct: rateTrend.pct, tone: rateTrend.tone, tip: rateTrend.tip, title: rateTrend.title, spark: slRate }
            ];

            document.getElementById('kpiGrid').innerHTML = cards.map(kpiCardHTML).join('');
        }

        /* ===== 分组：12 项指标（剩余 / 较上日·较上周 / 较上月·较上年） ===== */
        /* 上一周期对比窗口：[start, end)，上界 = 同周期最后一天 + 1 天，月末/年末按实际天数截断 */
        function prevPeriodWindow(kind, now) {
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (kind === 'day') {
                const start = new Date(today); start.setDate(today.getDate() - 1);
                return [start, today]; // [昨日00:00, 今日00:00)
            }
            if (kind === 'week') {
                const wd = today.getDay() || 7;
                const thisMon = new Date(today); thisMon.setDate(today.getDate() - wd + 1);
                const lastMon = new Date(thisMon); lastMon.setDate(thisMon.getDate() - 7);
                const elapsed = Math.round((today - thisMon) / 86400000);
                const end = new Date(lastMon); end.setDate(lastMon.getDate() + elapsed + 1);
                return [lastMon, end]; // [上周一, 上周同星期几+1天)
            }
            if (kind === 'month') {
                const start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                const daysInLast = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
                const day = Math.min(today.getDate(), daysInLast);
                return [start, new Date(start.getFullYear(), start.getMonth(), day + 1)]; // [上月1日, 上月同日+1天)
            }
            const start = new Date(today.getFullYear() - 1, 0, 1);
            const daysInLast = new Date(today.getFullYear() - 1, today.getMonth() + 1, 0).getDate();
            const day = Math.min(today.getDate(), daysInLast);
            return [start, new Date(today.getFullYear() - 1, today.getMonth(), day + 1)]; // [去年1/1, 去年同月同日+1天)
        }

        function rangeCount(meta, kind, start, end) {
            return meta.filter(m => {
                const d = kind === 'new' ? m.dd : (m.done ? m.cd : null);
                return d && d >= start && d < end;
            }).length;
        }

        function renderKPIGroup(group) {
            const rows = state.rows;
            const meta = buildKpiMeta(rows);
            const now = new Date();

            // 对比窗口：上日 / 上周同期 / 上月同期 / 上年同期，统一由 prevPeriodWindow 生成（上界=同周期最后一天+1天）
            const monthPrev0 = new Date(now.getFullYear(), now.getMonth() - 1, 1);
            const lastMonthKey = monthKeyOf(monthPrev0);

            const PREV_WIN = {
                yesterdayNew: ['new', ...prevPeriodWindow('day', now)],
                weekNew: ['new', ...prevPeriodWindow('week', now)],
                monthNew: ['new', ...prevPeriodWindow('month', now)],
                yearNew: ['new', ...prevPeriodWindow('year', now)],
                yesterdayDone: ['done', ...prevPeriodWindow('day', now)],
                weekDone: ['done', ...prevPeriodWindow('week', now)],
                monthDone: ['done', ...prevPeriodWindow('month', now)],
                yearDone: ['done', ...prevPeriodWindow('year', now)]
            };
            const TREND_LABEL = {
                yesterdayNew: '较上日', weekNew: '较上周', monthNew: '较上月', yearNew: '较上年',
                yesterdayDone: '较上日', weekDone: '较上周', monthDone: '较上月', yearDone: '较上年'
            };

            const monthKeys = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                monthKeys.push(monthKeyOf(d));
            }

            const cards = KPI_GROUP_DEFS[group].map(def => {
                const val = meta.filter(m => kpiMatches(m, def.key)).length;
                const isRemain = def.key.indexOf('remain') === 0;
                let prev, label;
                if (isRemain) {
                    // 与上月末同类剩余量对比
                    prev = meta.filter(m => m.cat === def.key && m.mk && m.mk <= lastMonthKey
                        && !(m.done && (!m.ck || m.ck <= lastMonthKey))).length;
                    label = '较上月';
                } else {
                    const w = PREV_WIN[def.key];
                    prev = rangeCount(meta, w[0], w[1], w[2]);
                    label = TREND_LABEL[def.key];
                }
                const isNewAdd = /New$/.test(def.key);
                const t = trendView(val, prev, {
                    emptyLabel: isRemain ? '无上月数据' : '无上期数据',
                    invert: isRemain || isNewAdd
                });
                const title = isRemain
                    ? (prev === 0
                        ? `${def.lbl} 当前 ${val} · 上月无数据`
                        : `${def.lbl} 当前 ${val} · 上月末 ${prev}（较上月 ${val - prev >= 0 ? '+' : ''}${val - prev}）`)
                    : (isNewAdd
                        ? (prev === 0
                            ? `${def.lbl} 当前 ${val} 条 · 上期无数据`
                            : `${def.lbl} 当前 ${val} 条 · 上期 ${prev} 条（差 ${val - prev >= 0 ? '+' : ''}${val - prev}）`)
                        : undefined);

                const spark = monthKeys.map(mk => {
                    if (isRemain) {
                        // 该月末仍未消缺的同类缺陷数
                        return meta.filter(m => m.mk && m.mk <= mk
                            && !(m.done && (!m.ck || m.ck <= mk))
                            && m.cat === def.key).length;
                    }
                    return meta.filter(m => def.key.slice(-3) === 'New' ? m.mk === mk : (m.done && m.ck === mk)).length;
                });

                return {
                    ...def, val, spark, sparkW: 62, sparkH: 26,
                    arrow: t.arrow, pct: t.pct, tone: t.tone, tip: t.tip || label, title
                };
            });

            document.getElementById('kpiGrid').innerHTML = cards.map(kpiCardHTML).join('');
        }

        function renderKPI() {
            const group = KPI_GROUPS.indexOf(state.kpiGroup) >= 0 ? state.kpiGroup : 'overview';
            if (group === 'overview') renderKPIOverview();
            else renderKPIGroup(group);
        }

        /* ===== 缺陷趋势 · 3D 立体柱（ECharts custom series 手绘，不新增依赖） =====
           主次关系：柱体只做背景量感，柱顶数值弱化为次要色；「剩余」折线为主视觉。 */
        const TREND_COL3D = {
            新增: {
                offset: -7,
                face: ['rgba(255,226,160,.70)', 'rgba(230,150,50,.44)'],
                side: 'rgba(140,86,20,.62)',
                cap: 'rgba(255,226,160,.62)',
                legend: '#ffc658'
            },
            消缺: {
                offset: 7,
                face: ['rgba(185,240,255,.70)', 'rgba(28,120,190,.44)'],
                side: 'rgba(10,58,106,.62)',
                cap: 'rgba(196,240,255,.62)',
                legend: '#3bd2ff'
            }
        };

        /* 单根柱：接触阴影 → 右侧斜切暗面 → 正面渐变 → 顶面 + 高光椭圆（不再标柱顶数值，数值看 tooltip） */
        function trend3dBarItem(style) {
            return function (params, api) {
                const idx = api.value(0);
                const value = Math.max(0, Number(api.value(1)) || 0);
                const base = api.coord([idx, 0]);
                const top = api.coord([idx, value]);
                const zero = value <= 0;
                const cx = base[0] + style.offset;
                const half = 6;
                const depth = 4;
                const rise = 2.2;
                const x0 = cx - half;
                const x1 = cx + half;
                const baseY = base[1];
                const barTop = zero ? baseY - 2.5 : Math.min(top[1], baseY - 2);
                const capTop = barTop - rise;
                const faceFill = zero ? 'rgba(120,150,170,.26)' : new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: style.face[0] },
                    { offset: 1, color: style.face[1] }
                ]);
                return {
                    type: 'group',
                    children: [
